#:schema node_modules/wrangler/config-schema.json
# Configuración para Cloudflare Workers (modo "Static Assets" + lógica de API).
#
# Sirve los archivos estáticos de public/ (index.html, manifest.json, sw.js)
# y expone /api/sync para guardar/leer expedientes.json en GitHub sin
# exponer el token al navegador (queda como secret de Cloudflare).

name = "expedientes-crm"
main = "worker.js"
compatibility_date = "2024-12-01"

[env.production]
name = "expedientes-crm"
routes = [
  { pattern = "expedientes-crm.f-c-joaquin.workers.dev/*", zone_name = "workers.dev" }
]

[env.production.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "none"

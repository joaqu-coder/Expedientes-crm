<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <!-- Opt-in a la transición entre pantallas. Es LO ÚNICO del sistema de
       diseño que NO puede vivir en design-system.css: el navegador decide si
       anima en el primer render del documento nuevo, y una hoja externa llega
       tarde a esa decisión. Medido: con la regla en design-system.css la
       transición salía en 5 de 8 navegaciones; acá adentro, en 8 de 8.
       El resto —qué se anima, cuánto dura, qué se queda quieto— sí está en
       design-system.css. Si tocás este bloque, tocá las cinco páginas: lo
       verifica tests/ids.test.mjs. -->
  <style>@view-transition{navigation:auto}@media(prefers-reduced-motion:reduce){@view-transition{navigation:none}}</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Resoluciones — EGPAIS">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Resoluciones">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Resoluciones — EGPAIS</title>
<!-- Sistema de diseño compartido por las 5 páginas. El orden importa:
     design-system.css son los valores (colores, radios, medidas) y
     ui-kit.css los componentes que los usan. El <style> de abajo es lo
     propio de esta pantalla y va último, para poder pisar algo puntual. -->
<link rel="stylesheet" href="/design-system.css">
<link rel="stylesheet" href="/ui-kit.css">
<style>
/* Sin :root propio. Los colores, la tipografía y los colores de categoría
   (--c1..--c6) viven en design-system.css: esta pantalla los hereda. Si algo
   de acá necesita desviarse, se redeclara ESE token y se explica por qué —
   no se vuelve a copiar la paleta entera. */
body{margin:0 auto;padding-inline:16px;padding-top:20px;padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* Barra de navegación inferior fija, presente en las 5 páginas del hub —
   mismo concepto que la barra de pestañas de WhatsApp (ícono + etiqueta,
   plana, sin cajas ni sombra), con la app actual marcada con color y un
   fondo sutil detrás del ícono. Queda siempre visible al cambiar de
   sección o hacer scroll (position:fixed), por eso el body le deja
   84px de aire abajo. */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:15}
.nav-item{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px 8px;text-decoration:none;color:var(--muted);transition:color .15s ease}
.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav-icon{width:26px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background-color .15s ease}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.01em;line-height:1.2}
.nav-item.active{color:var(--accent)}
.nav-item.active .nav-icon{background:color-mix(in srgb, var(--accent) 16%, transparent)}

/* ---- Toolbar: búsqueda siempre visible + filtros ---- */
.toolbar-search{padding:12px 0 8px}
.toolbar-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:var(--ds-gap);display:flex;flex-direction:column;gap:12px}
/* El campo de búsqueda lo dibuja .search-bar de ui-kit.css: acá quedan
   solo los desplegables de filtro. */
.toolbar-card select{background:var(--surface-2);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:13px}
.toolbar-filters{display:flex;gap:8px;flex-wrap:wrap}
.toolbar-filters select{flex:1 1 160px}

/* ---- Listado de tarjetas ---- */
.res-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:860px){.res-list{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}}
.res-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;cursor:pointer;text-align:left;width:100%}
.res-card:hover{border-color:var(--accent)}
.res-card-main{min-width:0}
.res-card-title{font-size:15px;font-weight:700}
.res-card-snippet{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res-card-sub{font-size:11.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-count{font-size:12px;color:var(--muted);margin-bottom:12px;font-variant-numeric:tabular-nums}
.res-barra{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.res-barra:empty{display:none}
.res-barra-txt{font-size:12.5px;color:var(--muted);margin-right:auto;font-variant-numeric:tabular-nums}
.res-card.is-sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#printArea{display:none;font-family:Roboto,Helvetica,Arial,sans-serif;color:#000}
#printArea section{break-inside:avoid;margin-bottom:18pt}
#printArea h2{font-size:12pt;font-weight:700;margin:0 0 6pt}
#printArea dl{display:grid;grid-template-columns:max-content 1fr;gap:2pt 10pt;margin:6pt 0;font-size:10.5pt}
#printArea dt{font-weight:700}
#printArea dd{margin:0}
#printArea p{font-size:10.5pt;line-height:1.4;white-space:pre-wrap;margin:4pt 0;text-align:justify}
.res-more{display:flex;justify-content:center;margin-top:12px}
.res-card-aside{flex:0 0 auto;display:flex;align-items:center;gap:6px}
/* Línea de tema con punto de color, igual que .exp-estado de Proyectos. */
.res-estado{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:600;margin-top:6px}
.res-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
@media (max-width:480px){
  .res-card{flex-direction:column;align-items:flex-start}
  .res-card-main{width:100%}
  .res-card-sub{white-space:normal;overflow:visible;text-overflow:clip;text-align:justify}
}
.empty-state{padding:30px 14px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:10px}

.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border-radius:6px;padding:3px 8px;white-space:nowrap}

/* ---- Modal ---- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:40px}
@media (min-width:640px){.veil{align-items:center}}
.veil[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:18px}
@media (min-width:640px){.modal{border-radius:14px}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.modal-head h2{font-size:17px}
.x-close{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:4px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}

/* Los botones de acción (Guardar/Cancelar/Eliminar/Editar) viven en
   /ui-kit.css, compartidos con las otras tres apps. */
.modal-actions{display:flex;gap:8px;margin-top:16px}

/* ---- Modal: vista de lectura ---- */
.view-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.view-title{font-size:var(--ds-text-title);line-height:var(--ds-text-title-lh);font-weight:700;color:var(--text)}
.view-sub{font-family:var(--font-mono);font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.view-section{margin-top:14px;padding-top:13px;border-top:1px solid var(--border)}
.view-section h3{font-size:var(--ds-text-subtitle);line-height:var(--ds-text-subtitle-lh);letter-spacing:.04em;text-transform:uppercase;color:var(--text);margin-bottom:9px;font-weight:700}
.view-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px}
.view-item label{display:block;font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);font-weight:700;color:var(--text)}
.view-item .v{margin-top:1px;font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);font-weight:400;color:var(--muted)}
.view-obs{font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);margin-top:11px;color:var(--muted);white-space:pre-wrap;text-align:justify}
.view-texto{font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);color:var(--muted);white-space:pre-wrap;margin:0;text-align:justify}
.view-empty{font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);color:var(--muted)}
.view-actions{display:flex;gap:8px;margin-top:16px}

/* ---- Pestañas Listado / Análisis (el patrón de Proyectos: .app-tabs de ui-kit) ---- */
.view[hidden]{display:none}
/* ---- Análisis: tres KPIs de lectura sobre el archivo (no escriben nada) ---- */
.kpi-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:860px){.kpi-grid{grid-template-columns:1fr 1fr}}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0}
.kpi-card.wide{grid-column:1 / -1}
.kpi-title{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kpi-hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4;font-variant-numeric:tabular-nums}
.kpi-hint select{margin-left:6px;background:var(--surface-2);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:6px 8px;font-size:13px}
.kpi-rows{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.kpi-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:12.5px}
.kpi-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-val{font-weight:600;font-variant-numeric:tabular-nums}
.kpi-bar{grid-column:1 / -1;height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.kpi-bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.kpi-cols{display:flex;align-items:flex-end;gap:5px;margin-top:14px}
.kpi-col{display:flex;flex-direction:column;align-items:center;flex:1 1 0;min-width:0}
.kpi-col-area{height:110px;width:100%;display:flex;align-items:flex-end}
.kpi-col-bar{display:block;width:100%;min-height:2px;background:var(--accent);border-radius:5px 5px 0 0}
.kpi-col-val{font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:3px}
.kpi-col-lbl{font-size:10.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
/* Resumen del análisis: totales, firmantes y botón de imprimir. */
.res-resumen-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.res-resumen-head .btn{width:auto}
.kpi-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
@media (min-width:860px){.kpi-tiles{grid-template-columns:repeat(5,minmax(0,1fr))}}
.kpi-tile{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.kpi-num{font-family:var(--font-mono);font-size:24px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.kpi-num-sm{font-size:17px}
.kpi-lbl{font-size:12px;color:var(--muted);margin-top:2px}
.res-sub{margin-top:14px}
.kpi-per{display:block;font-size:11.5px;color:var(--muted)}
@media print{
  body *{visibility:hidden}
  #viewDash, #viewDash *{visibility:visible}
  #viewDash{position:absolute;left:0;top:0;width:100%;padding:0;margin:0}
  .app-tabs,#resImprimir,.bottom-nav,.veil{display:none !important}
  .kpi-card{break-inside:avoid;border:1px solid #999}
  body.imprimiendo-res > *:not(#printArea){display:none !important}
  body.imprimiendo-res #printArea{display:block !important}
  body.imprimiendo-res #printArea, body.imprimiendo-res #printArea *{visibility:visible}
}
</style>
</head>
<body>
<div id="printArea" aria-hidden="true"></div>

<!-- El header (título + ⋮) lo monta header.js, común a las 4 apps.
     El alta vive ahora en el botón flotante (+), como en Seguimiento. -->

<!-- La búsqueda va directo debajo del título, fuera de la tarjeta de filtros:
     mismo orden que las otras apps (título → búsqueda → contenido). -->
<div class="app-tabs" role="tablist" aria-label="Vistas">
  <button class="app-tab tab" id="tabList" role="tab" aria-selected="true" aria-controls="viewList">Listado</button>
  <button class="app-tab tab" id="tabDash" role="tab" aria-selected="false" aria-controls="viewDash">Análisis</button>
</div>
<section class="view" id="viewList" role="tabpanel" aria-labelledby="tabList">
<div class="toolbar-search">
  <div class="search-bar"><input type="search" id="search" placeholder="Buscar por N° de resolución, expediente, autoridad o texto de la resolución…"></div>
</div>
<div class="toolbar-card">
  <div class="toolbar-filters">
    <select id="filterTema"><option value="">Todos los temas</option></select>
    <select id="filterAnio"><option value="">Todos los años</option></select>
  </div>
</div>

<div class="res-barra" id="resBarra"></div>
<div class="res-count" id="resCount"></div>
<div class="res-list" id="resList"></div>
<div class="res-more" id="resMore"></div>
</section>
<section class="view" id="viewDash" role="tabpanel" aria-labelledby="tabDash" hidden>
  <div class="kpi-card wide res-resumen">
    <div class="res-resumen-head">
      <div class="kpi-title">Resumen del archivo</div>
    </div>
    <div class="kpi-tiles">
      <div class="kpi-tile"><div class="kpi-num" id="resTotal">0</div><div class="kpi-lbl">Resoluciones</div></div>
      <div class="kpi-tile"><div class="kpi-num kpi-num-sm" id="resAnios">—</div><div class="kpi-lbl">Período</div></div>
      <div class="kpi-tile"><div class="kpi-num" id="resFirmantesN">0</div><div class="kpi-lbl">Firmantes</div></div>
      <div class="kpi-tile"><div class="kpi-num" id="resExpedientes">0</div><div class="kpi-lbl">Expedientes distintos</div></div>
      <div class="kpi-tile"><div class="kpi-num" id="resFaltantes">0</div><div class="kpi-lbl">Documento faltante</div></div>
    </div>
    <div class="kpi-hint" id="resNotas"></div>
    <div class="kpi-title res-sub">Quién firma</div>
    <div class="kpi-rows" id="resFirmantes" data-kpi="firmantes"></div>
  </div>
  <div class="kpi-grid">
    <div class="kpi-card wide">
      <div class="kpi-title">Resoluciones por año</div>
      <div class="kpi-hint" id="kpiAnioTotal"></div>
      <div class="kpi-cols" id="kpiAnio" data-kpi="anio"></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Temas principales</div>
      <div class="kpi-hint"><label>Año <select id="kpiTemaAnio"><option value="">Todos los años</option></select></label></div>
      <div class="kpi-rows" id="kpiTema" data-kpi="tema"></div>
    </div>
  </div>
</section>

<div class="veil" id="veil" hidden><div class="modal" id="modal"></div></div>

<script src="/header.js"></script>
<script>
(function(){
  "use strict";

  // Enum de Temas: son exactamente las 30 categorías del archivo histórico,
  // escritas como las escribe el archivo (en singular). Si el archivo traía la
  // misma categoría de varias formas (mayúsculas, espaciado) se unificó en una
  // sola grafía, porque dos entradas del filtro para lo mismo no sirven.
  // "Falta" es el marcador del propio archivo para las resoluciones cuyo
  // documento no está. El color del badge cicla entre 6 tonos para que temas
  // distintos no queden todos iguales.
  var TEMAS = [
    "Adenda","Adjudicación","Alquiler","Asignar","Aumento de precio",
    "Autorización","Boleto de compra venta","Cesión de derechos","Comodato",
    "Contrato","Contrato de adjudicación","Contrato de locación",
    "Contrato de servicios","Convenio","Desadjudicación","Designación",
    "Devolución","Disposición","Falta","Intimación","Licencia","Otorgamiento",
    "Prórroga","Protocolo","Rechazo","Recurso de reconsideración",
    "Regularización catastral","Renuncia","Requerimiento","Revocación"
  ];
  var PAGINA = 100; // cuántas tarjetas se pintan por tanda (el archivo tiene 422)
  function claseTema(tema){
    var i = TEMAS.indexOf(tema);
    var n = (i===-1 ? 0 : i) % 6 + 1;
    return "c"+n;
  }


  var STORAGE_KEY = "resoluciones_crm_v1";

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function uid(){ return "res_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  // Las 3 resoluciones de ejemplo (ejemplo:true) se dieron de baja al cargar
  // el archivo histórico real: ya no se siembran y se descartan si quedaron
  // guardadas en localStorage o en resoluciones.json.
  function sinEjemplos(arr){
    return arr.filter(function(r){ return !r || r.ejemplo !== true; });
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      var data = JSON.parse(raw);
      if(!Array.isArray(data)) return [];
      var limpias = sinEjemplos(data);
      // La limpieza se persiste local, pero NO se marca para subir: eso lo
      // decide bajarCambiosIniciales() con los datos del servidor en la mano,
      // para no pisar resoluciones que este navegador todavía no vio.
      if(limpias.length !== data.length){
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(limpias)); }catch(e2){}
      }
      return limpias;
    }catch(e){ return []; }
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.resoluciones)); }catch(e){}
    marcarPendiente();
  }

  // ---- Sync: GitHub-como-base-de-datos detrás del Worker (/api/sync-resoluciones) ----
  // Guardado local SIEMPRE instantáneo (ya ocurrió en save()). La subida real
  // va en background, debounced, y nunca bloquea al usuario. Endpoint propio
  // (distinto de /api/sync y /api/sync-cartas) porque las tres apps comparten
  // el mismo Worker/token pero escriben archivos distintos.
  var SYNC_ENDPOINT = "/api/sync-resoluciones";
  var SYNC_PENDING_KEY = "resoluciones_crm_sync_pendiente_v1";
  var syncTimer = null, syncEnProgreso = false;

  // Reintento con espera creciente, portado de proyectos.html.
  //
  // Antes de esto el `catch` de subirCambios() terminaba llamándose a sí
  // mismo de inmediato, porque al fallar NO se borra la marca de pendiente:
  //     }catch(e){ setSyncStatus("offline"); }
  //     syncEnProgreso = false;
  //     if(haySyncPendiente()) subirCambios();   // ← otra vez, ya
  // Medido en Chromium con los datos reales y el server devolviendo 500: 62
  // POST por segundo, 170 MB subidos en 10 segundos, y las 124 llamadas/s que
  // eso dispara contra la API de GitHub agotan el presupuesto de 5.000/hora
  // en 40 segundos. Como el GITHUB_TOKEN es uno solo para las cuatro apps,
  // un teléfono con mala señal dejaba sin sincronizar a las otras tres.
  //
  // El disparador es lo más común que hay: que el server no esté un rato.
  var BACKOFF_BASE_MS = 2000;
  var BACKOFF_MAX_MS = 60000;
  var fallosSeguidos = 0;
  var errorPermanente = false; // 4xx: reintentar no lo va a arreglar

  function proximoBackoff(){
    return Math.min(BACKOFF_BASE_MS * Math.pow(2, fallosSeguidos - 1), BACKOFF_MAX_MS);
  }
  function programarSubida(ms){
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){ syncTimer = null; subirCambios(); }, ms);
  }

  function marcarPendiente(){
    try{ localStorage.setItem(SYNC_PENDING_KEY, "1"); }catch(e){}
    setSyncStatus("pendiente");
    // Un cambio nuevo es señal de que el usuario sigue trabajando: se limpia
    // el contador de fallos para que no arrastre la espera del intento viejo.
    fallosSeguidos = 0;
    errorPermanente = false;
    programarSubida(100);
  }
  function haySyncPendiente(){
    try{ return localStorage.getItem(SYNC_PENDING_KEY) === "1"; }catch(e){ return false; }
  }
  // El estado de sincronización ya no ocupa un lugar fijo arriba: vive en el
  // menú ⋮ y solo sale a la vista si hay un problema, que es cuando importa.
  function setSyncStatus(s){
    if(!window.HeaderGlobal) return;
    var map = {
      sincronizado: ["Al día", "ok"],
      cargando: ["Cargando…", "ok"],
      pendiente: ["Subiendo cambios…", "ok"],
      subiendo: ["Subiendo cambios…", "ok"],
      offline: ["Sin conexión. Tus cambios están guardados en este dispositivo y se suben solos al volver la señal. Tocá para reintentar.", "error"],
      rechazado: ["El servidor rechazó los datos. Tus cambios están guardados en este dispositivo, pero no se van a subir hasta que esto se corrija. Tocá para reintentar.", "error"]
    };
    var m = map[s] || map.sincronizado;
    // El reintento manual es una decisión explícita del usuario: levanta la
    // bandera de "error permanente", que si no dejaría el botón muerto.
    HeaderGlobal.setSync(m[0], m[1], function(){
      errorPermanente = false;
      fallosSeguidos = 0;
      subirCambios();
      bajarCambiosIniciales();
    });
  }

  async function subirCambios(){
    if(syncEnProgreso || !haySyncPendiente() || errorPermanente) return;
    syncEnProgreso = true;
    setSyncStatus("subiendo");
    try{
      var resp = await HeaderGlobal.fetchApi(SYNC_ENDPOINT, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({resoluciones: state.resoluciones})
      });
      if(!resp.ok){
        // 4xx (salvo 429) es culpa del payload o de la configuración:
        // reintentar en loop no lo arregla y esconde el problema.
        if(resp.status >= 400 && resp.status < 500 && ![401, 403, 408, 429].includes(resp.status)) errorPermanente = true;
        throw new Error("POST falló: "+resp.status);
      }
      try{ localStorage.removeItem(SYNC_PENDING_KEY); }catch(e){}
      fallosSeguidos = 0;
      setSyncStatus("sincronizado");
    }catch(e){
      fallosSeguidos++;
      setSyncStatus(errorPermanente ? "rechazado" : "offline");
      if(!errorPermanente){
        var espera = proximoBackoff();
        console.warn("[sync] intento "+fallosSeguidos+" falló; reintento en "+(espera/1000)+"s:", e.message||e);
        programarSubida(espera);
      } else {
        console.error("[sync] el servidor rechaza los datos, no se reintenta:", e.message||e);
      }
      syncEnProgreso = false;
      return;
    }
    syncEnProgreso = false;
    // Llegó algo nuevo mientras el POST estaba en vuelo: se manda agendado,
    // nunca por recursión inmediata.
    if(haySyncPendiente()) programarSubida(100); // llegó algo nuevo mientras el POST estaba en vuelo
  }

  async function bajarCambiosIniciales(){
    if(haySyncPendiente()){
      // hay cambios locales sin subir: los subimos primero, nunca pisamos trabajo no sincronizado
      subirCambios();
      return;
    }
    setSyncStatus("cargando");
    try{
      var resp = await HeaderGlobal.fetchApi(SYNC_ENDPOINT);
      if(!resp.ok) throw new Error("GET falló: "+resp.status);
      var datos = await resp.json();
      if(datos && Array.isArray(datos.resoluciones) && datos.resoluciones.length){
        var remotas = datos.resoluciones;
        var limpias = sinEjemplos(remotas);
        state.resoluciones = limpias;
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.resoluciones)); }catch(e){}
        // había ejemplos arriba: ahora sí corresponde subir la limpieza
        if(limpias.length !== remotas.length) marcarPendiente();
        renderFiltros();
        renderList();
      }
      setSyncStatus("sincronizado");
    }catch(e){
      setSyncStatus("offline");
    }
  }

  var state = { resoluciones: load(), editingId: null, modalMode: null, filterTema:"", filterAnio:"", search:"", limite: PAGINA, seleccionando: false, seleccion: [] };

  // ---- Filtros ----
  var selTema = document.getElementById("filterTema");
  var selAnio = document.getElementById("filterAnio");
  function renderFiltros(){
    var temaActual = selTema.value, anioActual = selAnio.value;
    selTema.innerHTML = '<option value="">Todos los temas</option>'+
      TEMAS.map(function(t){ return '<option value="'+esc(t)+'">'+esc(t)+'</option>'; }).join("");
    var anios = Array.from(new Set(state.resoluciones.map(function(r){return r.anio;}).filter(Boolean))).sort().reverse();
    selAnio.innerHTML = '<option value="">Todos los años</option>'+
      anios.map(function(a){ return '<option value="'+esc(a)+'">'+esc(a)+'</option>'; }).join("");
    selTema.value = temaActual; selAnio.value = anioActual;
  }
  function cambioFiltro(){ state.limite = PAGINA; renderList(); }
  selTema.addEventListener("change", function(){ state.filterTema=this.value; cambioFiltro(); });
  selAnio.addEventListener("change", function(){ state.filterAnio=this.value; cambioFiltro(); });
  document.getElementById("search").addEventListener("input", function(){ state.search=this.value.toLowerCase(); cambioFiltro(); });

  function resolucionesFiltradas(){
    return state.resoluciones.filter(function(r){
      if(state.filterTema && r.tema!==state.filterTema) return false;
      if(state.filterAnio && r.anio!==state.filterAnio) return false;
      if(state.search){
        var blob = [r.nro_resolucion,r.anio,r.tema,r.nro_expediente,r.autoridad,r.observaciones,r.contenido].join(" ").toLowerCase();
        if(blob.indexOf(state.search)===-1) return false;
      }
      return true;
    });
  }

  // ---- Listado (tarjetas) ----
  function renderList(){
    // Todo cambio de datos pasa por acá (alta, edición, baja, descarga del
    // servidor, filtros), así que el análisis se recalcula en el mismo lugar.
    renderAnalisis();
    var cont = document.getElementById("resList");
    var cuenta = document.getElementById("resCount");
    var mas = document.getElementById("resMore");
    var filtradas = resolucionesFiltradas().slice().sort(function(a,b){
      // más recientes primero: año desc, luego N° de resolución desc
      // (el N° va con ceros a la izquierda, así "031" no queda sobre "100")
      if(a.anio!==b.anio) return (b.anio||"").localeCompare(a.anio||"");
      return (b.nro_resolucion||"").localeCompare(a.nro_resolucion||"");
    });
    var total = state.resoluciones.length;
    cuenta.textContent = !total ? ""
      : (filtradas.length===total ? total+" resoluciones" : filtradas.length+" de "+total+" resoluciones");
    if(!filtradas.length){
      mas.innerHTML = "";
      cont.innerHTML = '<div class="empty-state">'+
        (total ? 'Sin resoluciones que coincidan con el filtro.'
               : 'Todavía no hay resoluciones cargadas. Usá “+ Nueva resolución”.')+
        '</div>';
      return;
    }
    var visibles = filtradas.slice(0, state.limite);
    cont.innerHTML = visibles.map(function(r){
      var firma = (r.autoridad || "").trim();
      var sel = state.seleccion.indexOf(r.id) !== -1;
      return '<button class="res-card'+(sel?' is-sel':'')+'" data-open="'+esc(r.id)+'"'+(state.seleccionando?' aria-pressed="'+sel+'"':'')+'>'+
        '<div class="res-card-main">'+
          '<div class="res-card-title">N° '+esc(r.nro_resolucion||"s/n")+(r.anio?('/'+esc(r.anio)):'')+'</div>'+
          (r.tema?'<div class="res-estado" style="color:var(--'+claseTema(r.tema)+')"><i class="res-dot"></i>'+esc(r.tema)+'</div>':'')+
          (firma?'<div class="res-card-sub">'+esc(firma)+'</div>':'')+
        '</div>'+
        '</button>';
    }).join("");
    cont.querySelectorAll("[data-open]").forEach(function(btn){
      btn.addEventListener("click", function(){
        if(state.seleccionando) return alternarSeleccion(btn.getAttribute("data-open"));
        openModal(btn.getAttribute("data-open"));
      });
    });
    renderBarra();
    var restantes = filtradas.length - visibles.length;
    mas.innerHTML = restantes>0
      ? '<button type="button" class="btn btn-secondary" id="btnMas">Mostrar '+Math.min(restantes,PAGINA)+' más ('+restantes+' restantes)</button>'
      : "";
    var btnMas = document.getElementById("btnMas");
    if(btnMas) btnMas.addEventListener("click", function(){ state.limite += PAGINA; renderList(); });
  }

  // ---- Modal: nuevo / editar / ver ----

  // ---- Seleccionar y imprimir resoluciones ----
  // Modo selección: un clic en la tarjeta la marca en vez de abrir la ficha.

  function renderBarra(){
    var barra = document.getElementById("resBarra");

        '<button type="button" class="btn btn-secondary" id="resCancelarSel">Cancelar</button>';

  function fila(etiqueta, valor){

  function imprimirSeleccion(){
    // En el orden del listado, no el orden en que se marcaron.

  function renderModalEdit(r, isNew){
    modal.innerHTML =
      '<div class="modal-head"><h2>'+(isNew?"Nueva resolución":"Editar resolución")+'</h2><button class="x-close" id="xClose">&times;</button></div>'+
      '<form id="resForm">'+
        '<div class="row2">'+field("nro_resolucion","N° de Resolución","text",r,"045")+field("anio","Año","text",r,"2026")+'</div>'+

        field("nro_expediente","N° de Expe.","text",r,"363-65027/2026-0",true)+
        field("autoridad","Autoridad","text",r,"Directorio EGPAIS")+

        (isNew?'':'<button type="button" class="btn btn-secondary btn-grow" id="btnCancelEdit">'+HeaderGlobal.icono("cancelar")+'Cancelar</button><button type="button" class="btn btn-danger btn-grow" id="btnDelete">'+HeaderGlobal.icono("eliminar")+'Eliminar</button>')+'</div>'+

  function field(name,label,type,r,placeholder,mono){
    var val = r ? (r[name]==null?"":r[name]) : "";
    return '<div class="field"><label for="f_'+name+'">'+esc(label)+'</label>'+
      '<input class="'+(mono?"mono":"")+'" id="f_'+name+'" name="'+name+'" type="'+type+'" value="'+esc(val)+'" placeholder="'+esc(placeholder||"")+'"></div>';
  }
  function selectField(name,label,options,r){
    var current = r ? r[name] : "";
    var opts = options.map(function(opt){
      return '<option value="'+esc(opt)+'" '+(opt===current?"selected":"")+'>'+esc(opt)+'</option>';
    }).join("");
    var blank = (!current) ? '<option value="" selected disabled>Seleccionar…</option>' : '';
    return '<div class="field"><label for="f_'+name+'">'+esc(label)+'</label><select id="f_'+name+'" name="'+name+'">'+blank+opts+'</select></div>';

  function closeModal(){ veil.hidden = true; state.editingId = null; state.modalMode = null; }

  function onSave(ev){
    ev.preventDefault();
    var id = state.editingId;
    var existing = id ? state.resoluciones.find(function(x){return x.id===id;}) : null;
    var isNew = !existing;
    var g = function(name){ var el=document.getElementById("f_"+name); return el?el.value:""; };

    var res = existing || {id:uid()};
    res.nro_resolucion = g("nro_resolucion").trim();
    res.anio = g("anio").trim();
    res.fecha = g("fecha").trim();
    res.tema = g("tema");
    res.nro_expediente = g("nro_expediente").trim();
    res.autoridad = g("autoridad").trim();
    res.contenido = g("contenido").trim();
    res.observaciones = g("observaciones").trim();

    if(isNew) state.resoluciones.push(res);

    closeModal();
    renderFiltros();

  function onDelete(){
    if(!state.editingId) return;
    state.resoluciones = state.resoluciones.filter(function(x){return x.id!==state.editingId;});

  // ---- Pestañas: Listado / Análisis (mismo patrón que Proyectos) ----
  var tabList = document.getElementById("tabList"), tabDash = document.getElementById("tabDash");
  var viewList = document.getElementById("viewList"), viewDash = document.getElementById("viewDash");
  function showView(name){
    var isDash = name === "analisis";
    viewList.hidden = isDash; viewDash.hidden = !isDash;
    tabList.classList.toggle("active", !isDash); tabDash.classList.toggle("active", isDash);
    tabList.setAttribute("aria-selected", String(!isDash)); tabDash.setAttribute("aria-selected", String(isDash));
    // El hash refleja la pestaña, así que recargar o volver con «atrás» queda
    // en la misma. El hashchange que dispara vuelve a llamar acá, sin efecto.
    if(isDash ? location.hash !== "#analisis" : location.hash === "#analisis")
      location.hash = isDash ? "#analisis" : "#listado";
  }
  tabList.addEventListener("click", function(){ showView("listado"); });
  tabDash.addEventListener("click", function(){ showView("analisis"); });
  window.addEventListener("hashchange", function(){
    showView(location.hash === "#analisis" ? "analisis" : "listado");
  });

  // ---- Análisis: tres KPIs de lectura sobre el archivo ----
  // Solo leen state.resoluciones: no escriben nada. Se recalculan desde
  // renderList(); el único estado propio es el año del ranking de temas.
  var kpiAnioTema = "";
  var TOP_N = 10;
  function conteoPor(arr, fn){
    var o = {};
    arr.forEach(function(r){ var k = fn(r); if(k) o[k] = (o[k] || 0) + 1; });
    return o;
  }
  // Ranking de mayor a menor. Empates: orden alfabético, para que el mismo
  // archivo siempre dé la misma lista.
  function rankear(o){
    return Object.keys(o).map(function(k){ return { clave: k, n: o[k] }; })
      .sort(function(a, b){
        if(b.n !== a.n) return b.n - a.n;
        return a.clave < b.clave ? -1 : a.clave > b.clave ? 1 : 0;
      })
      .slice(0, TOP_N);
  }
  function filaBarra(clave, etiqueta, n, max){
    return '<div class="kpi-row" data-clave="'+esc(clave)+'" data-n="'+n+'">'+
      '<span class="kpi-label" title="'+esc(etiqueta)+'">'+esc(etiqueta)+'</span>'+
      '<span class="kpi-val">'+n+'</span>'+
      '<span class="kpi-bar"><span style="width:'+Math.round(n/max*100)+'%"></span></span>'+
    '</div>';
  }
  // Resumen: totales, período, firmantes con su cantidad y años, y las notas
  // de calidad del archivo (fechas mal formadas, documentos faltantes).
  // «Quién firma» sale de `autoridad`; sin firma se cuenta aparte.
  function renderResumen(){
    var res = state.resoluciones;
    var anios = Array.from(new Set(res.map(function(r){ return r.anio; }).filter(Boolean))).sort();
    var firmantes = {};
    res.forEach(function(r){
      var k = (r.autoridad || "").trim() || "(sin firma)";
      var f = firmantes[k] || (firmantes[k] = { n: 0, desde: r.anio, hasta: r.anio });
      f.n++;
      if(r.anio < f.desde) f.desde = r.anio;
      if(r.anio > f.hasta) f.hasta = r.anio;
    });
    var ranking = Object.keys(firmantes).sort(function(a, b){
      if(firmantes[b].n !== firmantes[a].n) return firmantes[b].n - firmantes[a].n;
      return a < b ? -1 : a > b ? 1 : 0;
    });
    var conExpte = res.filter(function(r){ return r.nro_expediente && !esMarcadorExpte(r.nro_expediente); });
    var expDistintos = Object.keys(conteoPor(conExpte, function(r){ return r.nro_expediente; })).length;
    var faltantes = res.filter(function(r){ return r.tema === "Falta"; }).length;
    var fechasMal = res.filter(function(r){ return !/^\d{2}\/\d{2}\/\d{4}$/.test(r.fecha || ""); }).length;

    document.getElementById("resTotal").textContent = res.length;
    document.getElementById("resAnios").textContent = anios.length
      ? (anios[0] === anios[anios.length - 1] ? anios[0] : anios[0]+"–"+anios[anios.length - 1]) : "—";
    document.getElementById("resFirmantesN").textContent = ranking.length;
    document.getElementById("resExpedientes").textContent = expDistintos;
    document.getElementById("resFaltantes").textContent = faltantes;

    var notas = [];
    if(faltantes) notas.push(faltantes+" resoluciones tienen el documento faltante en el archivo (tema «Falta»): su número y año se conocen, el texto no.");
    if(fechasMal) notas.push(fechasMal+" fechas no tienen formato dd/mm/aaaa y se muestran tal como vinieron.");
    document.getElementById("resNotas").innerHTML = notas.map(function(n){ return "<div>"+esc(n)+"</div>"; }).join("");

    var max = ranking.length ? firmantes[ranking[0]].n : 1;
    document.getElementById("resFirmantes").innerHTML = ranking.length
      ? ranking.map(function(k){
          var f = firmantes[k];
          var per = f.desde === f.hasta ? f.desde : f.desde+"–"+f.hasta;
          return '<div class="kpi-row" data-firma="'+esc(k)+'" data-n="'+f.n+'" data-desde="'+esc(f.desde)+'" data-hasta="'+esc(f.hasta)+'">'+
            '<span class="kpi-label">'+esc(k)+'<span class="kpi-per">'+esc(per)+'</span></span>'+
            '<span class="kpi-val">'+f.n+' ('+Math.round(f.n/res.length*100)+'%)</span>'+
            '<span class="kpi-bar"><span style="width:'+Math.round(f.n/max*100)+'%"></span></span>'+
          '</div>';
        }).join("")
      : '<div class="empty-state">Sin resoluciones cargadas.</div>';
  }
  // Imprimir (menú ⋮ o Ctrl+P) siempre saca el análisis: si está abierto el
  // listado, se muestra el análisis mientras dura la impresión y después se
  // vuelve a la pestaña que había.
  var vistaAntesDeImprimir = null;
  window.addEventListener("beforeprint", function(){
    vistaAntesDeImprimir = viewDash.hidden ? "listado" : "analisis";
    showView("analisis");
  });
  window.addEventListener("afterprint", function(){
    if(vistaAntesDeImprimir) showView(vistaAntesDeImprimir);
    vistaAntesDeImprimir = null;
  });
  function renderAnalisis(){
    if(!document.getElementById("kpiAnio")) return;
    renderResumen();
    renderKpiAnio();
    renderKpiTemas();
  }
  function renderKpiAnio(){
    var res = state.resoluciones;
    var porAnio = conteoPor(res, function(r){ return r.anio; });
    var anios = Object.keys(porAnio).sort();
    var max = anios.reduce(function(m, a){ return Math.max(m, porAnio[a]); }, 0) || 1;
    var ultimo = anios[anios.length - 1];
    document.getElementById("kpiAnioTotal").textContent = !res.length ? "Sin resoluciones cargadas"
      : res.length+" resoluciones en "+anios.length+" años · último año "+ultimo+": "+porAnio[ultimo];
    document.getElementById("kpiAnio").innerHTML = anios.map(function(a){
      var n = porAnio[a], h = Math.max(2, Math.round(n/max*100));
      // El año va como ’NN en la barra (cabe en 390px) y completo en el tooltip.
      return '<div class="kpi-row kpi-col" data-clave="'+esc(a)+'" data-n="'+n+'" title="'+esc(a)+': '+n+'">'+
        '<span class="kpi-col-val">'+n+'</span>'+
        '<span class="kpi-col-area"><span class="kpi-col-bar" style="height:'+h+'px"></span></span>'+
        '<span class="kpi-col-lbl">’'+esc(a.slice(-2))+'</span>'+
      '</div>';
    }).join("");
  }
  function renderKpiTemas(){
    var selAnio = document.getElementById("kpiTemaAnio");
    var anios = Array.from(new Set(state.resoluciones.map(function(r){ return r.anio; }).filter(Boolean))).sort().reverse();
    if(kpiAnioTema && anios.indexOf(kpiAnioTema) === -1) kpiAnioTema = "";
    selAnio.innerHTML = '<option value="">Todos los años</option>'+
      anios.map(function(a){ return '<option value="'+esc(a)+'">'+esc(a)+'</option>'; }).join("");
    selAnio.value = kpiAnioTema;
    var base = state.resoluciones.filter(function(r){ return !kpiAnioTema || r.anio === kpiAnioTema; });
    var ranking = rankear(conteoPor(base, function(r){ return r.tema; }));
    document.getElementById("kpiTema").innerHTML = ranking.length
      ? ranking.map(function(f){ return filaBarra(f.clave, f.clave, f.n, ranking[0].n); }).join("")
      : '<div class="empty-state">Sin resoluciones en este año.</div>';
  }
  // «Sn expediente» (109) y «Falta» (15) son marcadores del archivo, no un
  // número de expediente: no cuentan como expediente distinto.
  function esMarcadorExpte(e){ return /^(sn\b|s\/n|falta$)/i.test(e); }
  document.getElementById("kpiTemaAnio").addEventListener("change", function(){
    kpiAnioTema = this.value;
    renderKpiTemas();
  });

  // Header común a las 4 apps (título + ⋮) y botón flotante de alta.
  HeaderGlobal.init({
    titulo: "Resoluciones",
    accion: { etiqueta: "Nueva resolución", onClick: function(){ openModal(null); } },
    menu: [
      { etiqueta: "Imprimir...", icono: "imprimir", atajo: "Ctrl+P", onClick: function(){ window.print(); } },
      { etiqueta: "Actualizar datos", onClick: function(){ bajarCambiosIniciales(); } }
    ]
  });

  renderFiltros();
  renderList();
  showView(location.hash === "#analisis" ? "analisis" : "listado");
  bajarCambiosIniciales();

  window.addEventListener("online", function(){
    if(haySyncPendiente()) programarSubida(0); else bajarCambiosIniciales();
  });

  var _ultimaDescargaRes = Date.now();
  document.addEventListener("visibilitychange", function(){
    if(document.hidden || !veil.hidden) return;
    if(Date.now() - _ultimaDescargaRes < 30000) return;
    _ultimaDescargaRes = Date.now();
    if(haySyncPendiente()) programarSubida(0); else bajarCambiosIniciales();
  });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>

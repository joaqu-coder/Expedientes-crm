<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <!-- Opt-in a la transición entre pantallas. Es LO ÚNICO del sistema de
       diseño que NO puede vivir en design-system.css: el navegador decide si
       anima en el primer render del documento nuevo, y una hoja externa llega
       tarde a esa decisión. Medido: con la regla en design-system.css la
       transición salía en 5 de 8 navegaciones; acá adentro, en 8 de 8.
       El resto —qué se anima, cuánto dura, qué se queda quieto— sí está en
       design-system.css. Si tocás este bloque, tocá las cinco páginas: lo
       verifica tests/ids.test.mjs. -->
  <style>@view-transition{navigation:auto}@media(prefers-reduced-motion:reduce){@view-transition{navigation:none}}</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Parques — EGPAIS">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parques">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Parques — EGPAIS</title>
<!-- Sistema de diseño compartido por las 5 páginas. El orden importa:
     design-system.css son los valores (colores, radios, medidas) y
     ui-kit.css los componentes que los usan. El <style> de abajo es lo
     propio de esta pantalla y va último, para poder pisar algo puntual. -->
<link rel="stylesheet" href="/design-system.css">
<link rel="stylesheet" href="/ui-kit.css">
<style>
/* Sin :root propio. Los colores, la tipografía y los colores de categoría
   (--c1..--c6) viven en design-system.css: esta pantalla los hereda. Si algo
   de acá necesita desviarse, se redeclara ESE token y se explica por qué —
   no se vuelve a copiar la paleta entera. */
body{margin:0;padding-inline:16px;padding-top:20px;padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* Barra de navegación inferior fija, presente en las 5 páginas del hub —
   mismo concepto que la barra de pestañas de WhatsApp (ícono + etiqueta,
   plana, sin cajas ni sombra), con la app actual marcada con color y un
   fondo sutil detrás del ícono. Queda siempre visible al cambiar de
   sección o hacer scroll (position:fixed), por eso el body le deja
   84px de aire abajo. */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:15}
.nav-item{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px 8px;text-decoration:none;color:var(--muted);transition:color .15s ease}
.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav-icon{width:26px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background-color .15s ease}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.01em;line-height:1.2}
.nav-item.active{color:var(--accent)}
.nav-item.active .nav-icon{background:color-mix(in srgb, var(--accent) 16%, transparent)}

.sticky-top{position:sticky;top:0;background:var(--bg);z-index:10;padding-top:2px;border-bottom:1px solid var(--border)}
.sticky-top-search{padding:12px 0 8px}
.sticky-top-search[hidden]{display:none}
.sticky-top .app-tabs{padding-bottom:8px}

/* Selector de parque. No es un filtro más del listado: cambia el alcance de
   TODA la pantalla (lotes, empresas y análisis). Usa el mismo patrón de
   pestañas que el resto de las apps (ui-kit.css, .app-tabs / .app-tab). Va
   debajo de las pestañas, al principio del contenido, y con dos parques cada
   chip ocupa la mitad del ancho. Si solo hay un parque, la fila no se dibuja. */
.parque-switch{margin-bottom:8px}
.parque-switch[hidden]{display:none}
.parque-chip{flex:1 1 0;min-width:0;justify-content:center}
.parque-chip .count{font-weight:600;margin-left:4px}
.view[hidden]{display:none}

/* ---- Toolbar ---- */
.toolbar-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:20px;display:flex;flex-direction:column;gap:12px}
/* El campo de búsqueda lo dibuja .search-bar de ui-kit.css: acá quedan
   solo los desplegables de filtro. */
.toolbar-card select{background:var(--surface-2);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:13px}
.toolbar-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar-filters select{flex:1 1 150px}
.toolbar-check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}

/* ---- Listado de tarjetas ---- */
.lista{display:flex;flex-direction:column;gap:8px}
.tarjeta-row{display:flex;align-items:center;gap:10px;min-width:0}

/* Avatar con iniciales: no hay logos reales cargados, así que es texto,
   no una imagen. Mismo color de acento que el resto de la suite. */
.avatar{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--c1-bg);color:var(--c1);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:var(--font-display)}
.avatar.lg{width:44px;height:44px;font-size:15px}

/* Bloque "a revisar": inconsistencia conocida del dato de origen (Excel de
   Güemes), no un error de la app — ámbar, no rojo. */
.view-section.revisar{background:var(--warn-bg);border:1px solid var(--warn);border-radius:10px;padding:11px 12px;margin-top:14px}
.view-section.revisar h3{color:var(--warn)}
.view-section.revisar p{font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);margin:0 0 6px}
.view-section.revisar p:last-child{margin-bottom:0}
.view-section.revisar a{color:inherit;font-weight:600}
.tarjeta-count{font-size:12px;color:var(--muted);margin-bottom:12px;font-variant-numeric:tabular-nums}
.empty-state{padding:30px 14px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:10px}

.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border-radius:6px;padding:3px 8px;white-space:nowrap}

/* ---- Modal ---- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:40px}
@media (min-width:640px){.veil{align-items:center}}
.veil[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:18px}
@media (min-width:640px){.modal{border-radius:14px}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.modal-head h2{font-size:17px}
.x-close{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:4px;min-width:44px;min-height:44px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field-check{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px}
.field-nota{font-size:12px;color:var(--muted);line-height:1.45;margin:6px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}

/* Los botones de acción (Guardar/Cancelar/Eliminar/Editar) viven en
   /ui-kit.css, compartidos con las otras tres apps. */
.modal-actions{display:flex;gap:8px;margin-top:16px}

/* ---- Modal: vista de lectura ---- */
.view-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.view-title{font-size:var(--ds-text-title);line-height:var(--ds-text-title-lh);font-weight:700;color:var(--text)}
.view-sub{font-family:var(--font-mono);font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.view-section{margin-top:14px;padding-top:13px;border-top:1px solid var(--border)}
.view-section h3{font-size:var(--ds-text-subtitle);line-height:var(--ds-text-subtitle-lh);letter-spacing:.04em;text-transform:uppercase;color:var(--text);margin-bottom:9px;font-weight:700}
/* La ocupación es otra empresa, no una fila más de la ficha del lote: va en
   bloque propio con un filete al costado, para que no se lea como si
   matrícula, superficie y titular (arriba) fueran del ocupante. */
.view-section.ocupacion{background:var(--surface-2);border-top:none;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px}
.view-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px}
.view-item label{display:block;font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);font-weight:700;color:var(--text)}
.view-item .v{margin-top:1px;font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);font-weight:400;color:var(--muted)}
.view-item .v a{color:inherit}
.view-empty{font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);color:var(--muted)}
.view-actions{display:flex;gap:8px;margin-top:16px}

/* ---- Ficha de empresa: sub-tabs Empresa / Lotes / Contacto ----
   Usan el mismo patrón de pestañas que el resto (ui-kit.css); acá solo queda
   el margen que las separa del contenido de la ficha. */
.emp-m2-hero{font-family:var(--font-display);font-size:var(--ds-text-title);line-height:var(--ds-text-title-lh);font-weight:700;color:var(--accent)}
.subtabs{margin:12px 0 14px}

/* ---- Ficha de empresa: lista de lotes/matrículas (una empresa puede tener
   muchas: ALIMENTOS SOFIA, E007, tiene 22) — por eso lista scrolleable con
   fila por matrícula, no campos sueltos que no escalan. */
.lot-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden;max-height:380px;overflow-y:auto}
/* Lotes: más espaciado que el resto de las listas de la ficha (pedido
   explícito del usuario 2026-10-13) — más padding por fila y más separación
   entre la línea de ubicación y la de propiedad/escritura. */
.lot-row{padding:16px 14px;border-bottom:1px solid var(--border);font-size:13px}
.lot-row:last-child{border-bottom:none}
.lot-row:nth-child(even){background:var(--surface-2)}
.lot-row-main{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lot-row-main a{color:inherit;text-decoration:none;font-weight:600}
.lot-row-main a:hover{color:var(--accent)}
.lot-m2{flex:0 0 auto;font-weight:600;font-variant-numeric:tabular-nums}
.lot-row-sub{display:flex;justify-content:space-between;gap:14px;font-size:12.5px;margin-top:10px}
/* Mismo criterio tipográfico que el resto de la ficha: título en negrita,
   contenido en gris. */
/* Encabezado de grupo dentro de la pestaña Lotes: "A su nombre" vs "Ocupa
   por alquiler". Solo aparece cuando hay de los dos. */
.lot-group{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 7px}
.lot-group:first-child{margin-top:0}
.lot-row-extra{margin-top:8px;font-size:12.5px;color:var(--accent);font-weight:600}
.lot-row-extra a{color:inherit}
.lot-field-label{font-weight:700;color:var(--fg)}
.lot-field-value{color:var(--muted)}
/* ---- Ficha de empresa: sub-tab Empresa — etiqueta en negrita, dato en
   gris (al revés del .view-item de arriba), en el orden pedido:
   Representante, Cargo, Rubro, Actividad, CUIT. */
.info-list{display:flex;flex-direction:column}
.info-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);}
.info-row:last-child{border-bottom:none}
.info-row dt{font-weight:700;color:var(--fg);flex-shrink:0;margin:0}
.info-row dd{margin:0;font-weight:400;color:var(--muted);text-align:right}
.info-row .info-nota{display:block;font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);color:var(--muted);opacity:.8}
.field-hint{font-size:11.5px;color:var(--muted);line-height:1.45;margin:5px 0 0}

/* ---- Ficha de empresa: sub-tab Contacto — fila con ícono + label + valor.
   Íconos SVG inline, todos en el mismo gris neutro (pedido explícito del
   usuario: "sin tanto color, todo gris", sin un color por red social). */
.contact-list{display:flex;flex-direction:column;gap:2px}
.contact-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);color:inherit;text-decoration:none}
.contact-row:last-child{border-bottom:none}
.contact-row:hover .contact-value{color:var(--accent)}
.contact-icon{flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted)}
.contact-icon svg{width:18px;height:18px}
.contact-body{min-width:0;display:flex;flex-direction:column;gap:1px}
/* Mismo criterio tipográfico que el resto de la ficha: título en negrita,
   contenido en gris (pedido explícito del usuario 2026-10-13). */
.contact-label{font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);font-weight:700;color:var(--fg)}
.contact-value{font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);font-weight:400;color:var(--muted);overflow-wrap:anywhere}

/* ---- Dashboard ---- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:22px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
.kpi-card .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi-card .l{font-size:12px;color:var(--muted);margin-top:2px}
.dash-section{margin-bottom:22px}
.dash-section h3{font-size:13px;font-weight:700;margin-bottom:10px}
.barra-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.barra-label{flex:0 0 120px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra-track{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.barra-fill{height:100%;border-radius:4px}
.barra-val{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--muted)}

</style>
</head>
<body>

<!-- El header (título + ⋮) lo monta header.js, común a las 4 apps.
     El alta de lotes vive ahora en el botón flotante (+), como en Seguimiento. -->

<div class="sticky-top">
  <div class="sticky-top-search">
    <div class="toolbar-search" data-buscador="empresas">
      <div class="search-bar"><input type="search" id="searchEmpresas" placeholder="Buscar por empresa, rubro o contacto…"></div>
    </div>
    <div class="toolbar-search" data-buscador="comercial" hidden>
      <div class="search-bar"><input type="search" id="searchComercial" placeholder="Buscar por lote, manzana, parcela o matrícula…"></div>
    </div>
  </div>
  <div class="app-tabs" role="tablist" aria-label="Vistas">
    <button class="app-tab tab" id="tabEmpresas" role="tab" aria-selected="true" aria-controls="viewEmpresas">Empresas</button>
    <button class="app-tab tab" id="tabComercial" role="tab" aria-selected="false" aria-controls="viewComercial">Comercial</button>
    <!-- "Análisis" arranca oculto: está en stand by hasta definir los KPIs
         (ver DASH_STANDBY en el script). El atributo acá evita que la pestaña
         parpadee antes de que corra el JS; el interruptor real es la constante. -->
    <button class="app-tab tab" id="tabDash" role="tab" aria-selected="false" aria-controls="viewDash" hidden>Análisis</button>
  </div>
</div>

<div class="app-tabs parque-switch" id="parqueSwitch" role="tablist" aria-label="Parque industrial" hidden></div>

<!-- ===== VISTA EMPRESAS ===== -->
<!-- Lo operativo por lote (estado, filtros de manzana, etc.) vive dentro
     de la ficha de cada empresa, en su sub-tab Lotes — ya no hay una
     pestaña "Lotes" suelta a este nivel. -->
<section class="view" id="viewEmpresas" role="tabpanel" aria-labelledby="tabEmpresas">
  <div class="toolbar-card">
    <div class="toolbar-filters">
      <!-- Filtra por la situación de la EMPRESA (`situacion`: Activa / Sin
           actividad / En construcción), que es distinta del estado del lote:
           una titular que alquila su lote puede seguir activa. Estuvo inerte
           hasta el 2026-10-18, cuando el dato llegó con el Sistema Salta. -->
      <select id="filterEstadoEmpresas"><option value="">Todos los estados</option></select>
    </div>
  </div>
  <div class="tarjeta-count" id="empresasCount"></div>
  <div class="lista" id="empresasList"></div>
</section>

<!-- ===== VISTA COMERCIAL: lotes sin empresa — disponibles para la venta
     (ex "LIBRE: ...") y los pendientes de revisión ===== -->
<section class="view" id="viewComercial" role="tabpanel" aria-labelledby="tabComercial" hidden>
  <div class="toolbar-card">
    <div class="toolbar-filters">
      <select id="filterEstadoComercial"><option value="">Todos los estados</option></select>
      <select id="filterManzanaComercial"><option value="">Todas las manzanas</option></select>
      <label class="toolbar-check"><input type="checkbox" id="filterDisponibleComercial"> Solo disponibles para la venta</label>
    </div>
  </div>
  <div class="tarjeta-count" id="comercialCount"></div>
  <div class="lista" id="comercialList"></div>
</section>

<!-- ===== VISTA DASHBOARD ===== -->
<section class="view" id="viewDash" role="tabpanel" aria-labelledby="tabDash" hidden>
  <div class="kpi-grid" id="kpiGrid"></div>
  <div class="dash-section">
    <h3>Lotes por estado</h3>
    <div id="dashEstados"></div>
  </div>
  <div class="dash-section">
    <h3>Escrituración</h3>
    <div id="dashEscrituracion"></div>
  </div>
  <div class="dash-section">
    <h3>Empresas por superficie ocupada</h3>
    <div id="dashRankingEmpresas"></div>
  </div>
  <div class="dash-section">
    <h3>Por rubro</h3>
    <div id="dashRubros"></div>
  </div>
</section>

<div class="veil" id="veil" hidden><div class="modal" id="modal"></div></div>

<script src="/header.js"></script>
<script>
(function(){
  "use strict";

  var ESTADOS = ["Activa","Sin actividad","Alquilada","En construcción"];
  // La actividad de la EMPRESA es otra cosa que el estado del LOTE, y por eso
  // no incluye "Alquilada": que un lote esté alquilado describe al lote, no
  // dice si la empresa titular sigue operando. Así el titular y el ocupante
  // pueden estar activos los dos a la vez, cada uno con su propio estado.
  var SITUACIONES = ["Activa","Sin actividad","En construcción"];
  function claseEstado(estado){
    var i = ESTADOS.indexOf(estado);
    var n = (i===-1 ? 4 : i) % 5 + 1;
    return "c"+n;
  }


  // Íconos de la pestaña Contacto — mismo trazo gris neutro para todos,
  // sin un color propio por red (pedido explícito del usuario).
  var ICON_MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 5L2 7"></path></svg>';
  var ICON_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"></path></svg>';
  var ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>';
  var ICON_WEB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"></path></svg>';
  var ICON_IG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle></svg>';
  var ICON_LINKEDIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6Z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>';
  var ICON_FB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3Z"></path></svg>';

  var STORAGE_KEY = "parques_crm_v1";

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtM2(n){
    if(n==null || n==="") return "—";
    return Number(n).toLocaleString("es-AR")+" m²";
  }

  // Links reales para la pestaña Contacto de la ficha de empresa: el dato
  // llega tal como lo tipeó alguien ("www.algo.com.ar", "@usuario"), así
  // que para que el click navegue de verdad hay que completar el esquema,
  // no usar el valor crudo como href.
  // Varios campos del origen traen más de un valor pegado en el mismo
  // string (" | ", " / ", un salto de línea). El dato se muestra entero —no
  // se corrige el archivo— pero el link tiene que navegar a UNO. Esto
  // estaba escrito solo dentro de linkedinHref, y por eso mail, teléfono e
  // Instagram quedaron con el href roto: la misma defensa aplicada en un
  // solo lugar, otra vez. Ahora es una función y la usan todos.
  // No parte por "/" porque una URL está llena de barras; el teléfono, que
  // sí las usa de separador, la parte aparte.
  function primerValor(v){ return String(v||"").split(/[|;\n]/)[0].trim(); }
  function webHref(v){
    v = primerValor(v);
    if(!v) return "";
    return /^https?:\/\//i.test(v) ? v : "https://"+v;
  }
  function instagramHref(v){
    v = primerValor(v);
    if(!v) return "";
    if(/^https?:\/\//i.test(v)) return v;
    return "https://instagram.com/"+v.replace(/^@/,"");
  }
  // 83 empresas traen dos o tres mails en el campo y "mailto:" + el campo
  // entero no abre nada: el cliente recibe tres direcciones como si fueran
  // una. Además hay 3 cuyo "mail" no es un mail ("no", "5000", un nombre):
  // ahí no hay link que valga, y el valor se sigue mostrando como texto.
  function mailtoHref(v){
    var m = String(v||"").match(/[^\s|;,/<>()]+@[^\s|;,/<>()]+/);
    return m ? "mailto:"+m[0] : "";
  }
  // 54 empresas traen dos teléfonos. Sacarle los separadores al campo
  // entero daba tel:38742827583875322977 — 20 dígitos que marcan cualquier
  // cosa. Es el peor de los tres porque parecía funcionar.
  function telHref(v){
    var digitos = primerValor(v).split("/")[0].replace(/[^+\d]/g,"");
    return digitos ? "tel:"+digitos : "";
  }
  function linkedinHref(v){ return webHref(v); }
  function facebookHref(v){
    v = primerValor(v);
    if(!v) return "";
    if(/^https?:\/\//i.test(v)) return v;
    return "https://facebook.com/"+v.replace(/^@/,"");
  }

  // Fecha de hoy en ISO, armada con los getters locales: `toISOString()` da
  // UTC y en Argentina (UTC-3) después de las 21:00 devuelve el día
  // siguiente, así que una ocupación cerrada un lunes a la noche quedaría
  // fechada el martes (ver la nota de fechas en CLAUDE.md).
  function hoyISO(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }

  // Iniciales para el avatar: no hay logos cargados. Toma la primera letra
  // de hasta 2 palabras significativas (ignora S.A./S.R.L./LTDA y artículos).
  var PALABRAS_IGNORADAS = /^(s\.?a\.?|s\.?r\.?l\.?|ltda\.?|de|del|la|el|los|las|y)$/i;
  function iniciales(nombre){
    var palabras = String(nombre||"").trim().split(/\s+/).filter(function(w){
      return w && !PALABRAS_IGNORADAS.test(w);
    });
    if(!palabras.length) return "—";
    if(palabras.length===1) return palabras[0].slice(0,2).toUpperCase();
    return (palabras[0].charAt(0)+palabras[1].charAt(0)).toUpperCase();
  }

  // Normaliza un nombre de empresa para detectar posibles duplicados: sin
  // acentos, sin razón social (S.A./S.R.L.), sin puntuación.
  function normEmpresa(s){
    return String(s||"")
      .toUpperCase()
      .normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/\b(S\.?\s?A\.?|S\.?\s?R\.?\s?L\.?|LTDA\.?)\b/g,"")
      .replace(/[^A-Z0-9 ]/g,"")
      .replace(/\s+/g," ")
      .trim();
  }
  // Solo dentro del mismo parque: "PETIT PLAST" y "SALTA POR" existen en
  // Güemes y en Salta, y son empresas instaladas en parques distintos — no
  // dos cargas de la misma.
  function empresasSimilares(e){
    var n = normEmpresa(e.nombre_empresa);
    if(!n) return [];
    return state.empresas.filter(function(o){
      if(o.id_empresa===e.id_empresa) return false;
      if(parqueDe(o)!==parqueDe(e)) return false;
      var on = normEmpresa(o.nombre_empresa);
      return !!on && (on===n || on.indexOf(n+" ")===0 || n.indexOf(on+" ")===0);
    });
  }

  // Un lote puede tener VARIAS matrículas, cada una con su superficie, su
  // escritura y su titular registral: 23 de los 274 las tienen, hasta 6 en
  // un mismo lote. Los campos sueltos (`matricula`, `escritura`,
  // `propietario_matricula`) describen solo a la PRIMERA, así que dibujarlos
  // como si fueran del lote entero miente cuando las matrículas no coinciden
  // — y no coinciden seguido: 9 de esos 23 tienen titular distinto entre sus
  // matrículas y 6, escritura distinta. En SL009 la ficha decía
  // "Escritura: Sí · Sanabria Salmón" y ocultaba que los otros 1.352 m² son
  // del Ente y no están escriturados.
  //
  // Devuelve siempre una lista, para que el render no se bifurque. Cuando el
  // lote trae una sola, se arma con sus campos sueltos: así los otros 251
  // lotes siguen dibujándose exactamente igual que antes.
  function matriculasDe(l){
    var lista = (Array.isArray(l.matriculas) ? l.matriculas : []).filter(function(m){
      // Los 4 lotes de Salta sin datos registrales traen una entrada con
      // todo en null: eso no es una matrícula, es la ausencia de una.
      return m && (m.matricula || m.superficie_m2);
    });
    if(lista.length > 1) return lista;
    return l.matricula
      ? [{ matricula:l.matricula, superficie_m2:l.superficie_m2, escritura:l.escritura,
           titulares: l.propietario_matricula ? [l.propietario_matricula] : [] }]
      : [];
  }
  function titularDeMatricula(m){ return (m.titulares||[]).join(" · "); }
  // "Si"/"si"/"NO"/"no " y a veces null — misma normalización que
  // tituloYTitularDeLote, que es la otra que lee este campo.
  function escrituraTexto(v){
    var e = String(v||"").trim();
    if(!e) return "Sin dato";
    return /^s/i.test(e) ? "Sí" : "No";
  }
  function valoresDistintos(ms, leer){
    var vistos = {};
    ms.forEach(function(m){ vistos[String(leer(m)||"")] = 1; });
    return Object.keys(vistos).length > 1;
  }

  // Lotes con la misma matrícula pero distinto titular: no necesariamente un
  // error de carga (puede ser un caso que `ocupaciones` ya explica), pero
  // vale la pena marcarlo para revisar antes de asumir cualquier cosa.
  // Compara TODAS las matrículas de los dos lotes: mirando solo la principal
  // veía 14 repetidas de las 17 que hay.
  function lotesConMatriculaCompartida(lote){
    var propias = matriculasDe(lote).map(function(m){ return String(m.matricula||""); })
      .filter(Boolean);
    if(!propias.length) return [];
    var coincidencias = [];
    state.lotes.forEach(function(o){
      if(parqueDe(o)!==parqueDe(lote) || o.id_lote===lote.id_lote) return;
      if(o.id_empresa===lote.id_empresa) return;
      matriculasDe(o).forEach(function(m){
        var nro = String(m.matricula||"");
        if(nro && propias.indexOf(nro)!==-1) coincidencias.push({ lote:o, matricula:nro });
      });
    });
    return coincidencias;
  }

  // IDs nuevos siguen el esquema del dato real (E001, L001…) en vez de un
  // uid random, para no mezclar dos estilos de id en la misma colección.
  // Cada parque tiene su propio prefijo (Güemes E/L, Salta SE/SL) y el máximo
  // se calcula SOLO entre los ids de ese prefijo: tomarlo de la colección
  // entera haría que un lote nuevo en Güemes arranque en L136 solo porque
  // Salta ya llegó a SL135.
  function prefijoDe(parque, base){ return (parque==="guemes" ? "" : "S") + base; }
  function siguienteId(lista, campo, prefijo){
    var max = 0;
    var re = new RegExp("^"+prefijo+"(\\d+)$");
    // Los ids dados de baja cuentan igual: si el último se reusara, la
    // empresa nueva nacería ya filtrada por su propia baja.
    var bajas = campo==="id_empresa" ? state.eliminados.empresas : state.eliminados.lotes;
    lista.concat(bajas.map(function(id){ return {id: id}; })).forEach(function(x){
      var m = re.exec(x[campo]||x.id||"");
      if(m) max = Math.max(max, parseInt(m[1],10));
    });
    return prefijo + String(max+1).padStart(3,"0");
  }

  function vacio(){ return { parques:[{id:"guemes",nombre:"Güemes"}], empresas:[], lotes:[], ocupaciones:[], reservas:[], eliminados:{ empresas:[], lotes:[] } }; }

  // Hasta el 2026-10-18 esto guardaba un solo parque, como un string
  // (`parque:"Güemes"`), porque solo existía Güemes. Al sumar Parque
  // Industrial Salta pasó a ser una lista + `id_parque` en cada lote y cada
  // empresa. Esta migración corre al leer, no una sola vez: un celular que
  // tenga la versión vieja en localStorage, o un GET que todavía devuelva el
  // formato anterior, entran igual y quedan atribuidos a Güemes en vez de
  // aparecer con el selector vacío.
  //
  // El nombre que se muestra en el selector sale de acá y no del dato: el
  // chip es una etiqueta corta al lado de otra ("Güemes"), y
  // "Parque Industrial Salta" quedaba desparejo y ocupando toda la fila.
  // Normalizarlo al leer —y no una sola vez en parques.json— evita que un
  // celular con el nombre viejo en localStorage lo vuelva a subir en su
  // próximo POST.
  var NOMBRES_PARQUE = { guemes:"Güemes", salta:"Salta" };
  function migrarParques(d){
    if(!Array.isArray(d.parques) || !d.parques.length){
      d.parques = [{ id:"guemes", nombre: d.parque || "Güemes" }];
    }
    d.parques.forEach(function(p){ if(NOMBRES_PARQUE[p.id]) p.nombre = NOMBRES_PARQUE[p.id]; });
    var primero = d.parques[0].id;
    d.empresas.forEach(function(e){ if(!e.id_parque) e.id_parque = primero; });
    d.lotes.forEach(function(l){ if(!l.id_parque) l.id_parque = primero; });
    // Las bajas se aplican también al leer: una copia local vieja o un GET
    // que todavía no las trae no pueden mostrar lo que ya se borró.
    d.eliminados = {
      empresas: Array.isArray(d.eliminados && d.eliminados.empresas) ? d.eliminados.empresas.slice() : [],
      lotes: Array.isArray(d.eliminados && d.eliminados.lotes) ? d.eliminados.lotes.slice() : []
    };
    d.empresas = d.empresas.filter(function(e){ return d.eliminados.empresas.indexOf(e.id_empresa) < 0; });
    d.lotes = d.lotes.filter(function(l){ return d.eliminados.lotes.indexOf(l.id_lote) < 0; });
    d.ocupaciones = d.ocupaciones.filter(function(o){
      return d.eliminados.lotes.indexOf(o.id_lote) < 0 && d.eliminados.empresas.indexOf(o.id_empresa_ocupante) < 0;
    });
    delete d.parque;
    return d;
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return vacio();
      var data = JSON.parse(raw);
      if(!data || typeof data!=="object") return vacio();
      return migrarParques({
        parques: Array.isArray(data.parques) ? data.parques : null,
        parque: data.parque,
        empresas: Array.isArray(data.empresas) ? data.empresas : [],
        lotes: Array.isArray(data.lotes) ? data.lotes : [],
        ocupaciones: Array.isArray(data.ocupaciones) ? data.ocupaciones : [],
        reservas: Array.isArray(data.reservas) ? data.reservas : [],
        eliminados: data.eliminados,
        // Qué parque está elegido es estado de pantalla, no dato: se guarda
        // acá para que sobreviva a un refresh, pero NO viaja en datosParaSync.
        parqueActivo: data.parqueActivo || null
      });
    }catch(e){ return vacio(); }
  }
  // Dos cosas distintas, separadas a propósito: guardar en el dispositivo y
  // declarar que hay un cambio que subir. Confundirlas hacía que elegir un
  // parque —que es estado de pantalla, no dato— disparara un POST con el
  // archivo entero (~240 KB) y, del otro lado, un commit en el repo: seis
  // toques al selector, seis commits y 1,4 MB subidos sin que nadie hubiera
  // editado nada. Lo mismo que se evita en datosParaSync, pero del lado del
  // disparador.
  function guardarLocal(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function save(){
    guardarLocal();
    marcarPendiente();
  }

  // ---- Sync: GitHub-como-base-de-datos detrás del Worker (/api/sync-parques) ----
  var SYNC_ENDPOINT = "/api/sync-parques";
  var SYNC_PENDING_KEY = "parques_crm_sync_pendiente_v1";
  var syncTimer = null, syncEnProgreso = false;

  // Reintento con espera creciente, portado de proyectos.html.
  //
  // Antes de esto el `catch` de subirCambios() terminaba llamándose a sí
  // mismo de inmediato, porque al fallar NO se borra la marca de pendiente:
  //     }catch(e){ setSyncStatus("offline"); }
  //     syncEnProgreso = false;
  //     if(haySyncPendiente()) subirCambios();   // ← otra vez, ya
  // Medido en Chromium con los datos reales y el server devolviendo 500: 62
  // POST por segundo, 170 MB subidos en 10 segundos, y las 124 llamadas/s que
  // eso dispara contra la API de GitHub agotan el presupuesto de 5.000/hora
  // en 40 segundos. Como el GITHUB_TOKEN es uno solo para las cuatro apps,
  // un teléfono con mala señal dejaba sin sincronizar a las otras tres.
  //
  // El disparador es lo más común que hay: que el server no esté un rato.
  var BACKOFF_BASE_MS = 2000;
  var BACKOFF_MAX_MS = 60000;
  var fallosSeguidos = 0;
  var errorPermanente = false; // 4xx: reintentar no lo va a arreglar

  function proximoBackoff(){
    return Math.min(BACKOFF_BASE_MS * Math.pow(2, fallosSeguidos - 1), BACKOFF_MAX_MS);
  }
  function programarSubida(ms){
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){ syncTimer = null; subirCambios(); }, ms);
  }

  function marcarPendiente(){
    cambiosSeq++;
    try{ localStorage.setItem(SYNC_PENDING_KEY, "1"); }catch(e){}
    setSyncStatus("pendiente");
    // Un cambio nuevo es señal de que el usuario sigue trabajando: se limpia
    // el contador de fallos para que no arrastre la espera del intento viejo.
    fallosSeguidos = 0;
    errorPermanente = false;
    programarSubida(100);
  }
  function haySyncPendiente(){
    try{ return localStorage.getItem(SYNC_PENDING_KEY) === "1"; }catch(e){ return false; }
  }
  // El estado de sincronización ya no ocupa un lugar fijo arriba: cuando todo
  // anda bien vive en el menú ⋮, y solo sale a la vista si hay un problema
  // (sin conexión), que es cuando el dato le sirve a alguien.
  function setSyncStatus(s){
    if(!window.HeaderGlobal) return;
    var map = {
      sincronizado: ["Al día", "ok"],
      cargando: ["Cargando…", "ok"],
      pendiente: ["Subiendo cambios…", "ok"],
      subiendo: ["Subiendo cambios…", "ok"],
      offline: ["Sin conexión. Tus cambios están guardados en este dispositivo y se suben solos al volver la señal. Tocá para reintentar.", "error"],
      rechazado: ["El servidor rechazó los datos. Tus cambios están guardados en este dispositivo, pero no se van a subir hasta que esto se corrija. Tocá para reintentar.", "error"]
    };
    var m = map[s] || map.sincronizado;
    // El reintento manual es una decisión explícita del usuario: levanta la
    // bandera de "error permanente", que si no dejaría el botón muerto.
    HeaderGlobal.setSync(m[0], m[1], function(){
      errorPermanente = false;
      fallosSeguidos = 0;
      subirCambios();
      bajarCambiosIniciales();
    });
  }

  // Lo que se publica en el repo son los DATOS, no el estado de la pantalla.
  // `state` mezcla las dos cosas (filtros, búsqueda, qué modal está abierto),
  // y mandarlo entero hacía que terminara commiteado en parques.json lo que
  // alguien tenía tipeado en el buscador. La bajada ya tomaba solo estos
  // campos (ver bajarCambiosIniciales) y load() también: faltaba la simetría
  // de este lado.
  function datosParaSync(){
    return {
      parques: state.parques,
      empresas: state.empresas,
      lotes: state.lotes,
      ocupaciones: state.ocupaciones,
      reservas: state.reservas,
      eliminados: state.eliminados
    };
  }

  // ---- Fusión de dos versiones (concurrencia optimista, como Proyectos) ----
  // Este dispositivo guarda el sha y el contenido que el servidor tenía la
  // última vez que lo leyó: la "base". Con la base se sabe qué cambió de cada
  // lado, registro por registro, y lo del otro dispositivo no se pisa.
  var SYNC_BASE_KEY = "parques_crm_base_v1";
  var syncBase = cargarBase();
  // Cuenta cada cambio local: si algo se edita mientras un POST vuela, la
  // marca de pendiente no se borra al terminar.
  var cambiosSeq = 0;

  function cargarBase(){
    try{
      var v = JSON.parse(localStorage.getItem(SYNC_BASE_KEY));
      if(v && typeof v.sha === "string" && v.datos && typeof v.datos === "object") return v;
    }catch(e){}
    return {sha:null, datos:null};
  }
  function copiar(x){ return x==null ? x : JSON.parse(JSON.stringify(x)); }
  function guardarBase(sha, datos){
    syncBase = {sha: sha, datos: copiar(datos)};
    try{ localStorage.setItem(SYNC_BASE_KEY, JSON.stringify(syncBase)); }catch(e){}
  }
  // Comparación sin importar el orden de las claves: el servidor y este
  // dispositivo no las serializan igual, y eso no es un cambio.
  function canon(x){
    if(Array.isArray(x)) return x.map(canon);
    if(x && typeof x === "object"){
      var o = {};
      Object.keys(x).sort().forEach(function(k){ if(x[k] !== undefined) o[k] = canon(x[k]); });
      return o;
    }
    return x;
  }
  function mismo(a, b){ return JSON.stringify(canon(a)) === JSON.stringify(canon(b)); }
  function indexar(lista, clave){
    var m = {};
    (lista||[]).forEach(function(x){ if(x && x[clave] != null) m[String(x[clave])] = x; });
    return m;
  }
  function idsDe(lista, campo){
    return (lista||[]).map(function(x){ return x ? x[campo] : null; }).filter(function(v){ return v != null; });
  }
  // Próximo id libre con ese prefijo, mirando todos los ids conocidos (las
  // bajas incluidas, para no reusar uno que otro dispositivo ya conoce).
  function proximoId(usados, prefijo){
    var re = new RegExp("^" + prefijo + "(\\d+)$"), max = 0;
    usados.forEach(function(id){ var m = re.exec(String(id)); if(m) max = Math.max(max, parseInt(m[1], 10)); });
    return prefijo + String(max + 1).padStart(3, "0");
  }

  // Fusiona `local` y `remoto` contra `base`. Un registro cambiado de un solo
  // lado gana ese cambio. Si cambió en los dos, gana este dispositivo y se
  // cuenta como conflicto. Las altas independientes que chocan por id se
  // renumeran en la copia local (con sus referencias), así no se pierde ninguna.
  function fusionarParques(base, local, remoto){
    var b = base || {parques:[], empresas:[], lotes:[], ocupaciones:[], reservas:[], eliminados:{empresas:[], lotes:[]}};
    var eliminados = {
      empresas: unirIds(remoto.eliminados.empresas, local.eliminados.empresas),
      lotes: unirIds(remoto.eliminados.lotes, local.eliminados.lotes)
    };
    var L = copiar(local);
    var conflictos = 0;

    // Altas que chocan por id: se renumera la local.
    var usadosEmp = idsDe(b.empresas,"id_empresa").concat(idsDe(L.empresas,"id_empresa"),
                          idsDe(remoto.empresas,"id_empresa"), eliminados.empresas);
    var bEmp = indexar(b.empresas,"id_empresa"), rEmp = indexar(remoto.empresas,"id_empresa");
    var renEmp = {};
    L.empresas.forEach(function(e){
      var id = e.id_empresa;
      if(bEmp[id] || !rEmp[id] || mismo(rEmp[id], e)) return;
      var nuevo = proximoId(usadosEmp, prefijoDe(e.id_parque, "E"));
      usadosEmp.push(nuevo); renEmp[id] = nuevo; e.id_empresa = nuevo;
    });
    if(Object.keys(renEmp).length){
      L.lotes.forEach(function(l){ if(renEmp[l.id_empresa]) l.id_empresa = renEmp[l.id_empresa]; });
      L.ocupaciones.forEach(function(o){
        ["id_empresa_titular","id_empresa_ocupante"].forEach(function(c){ if(renEmp[o[c]]) o[c] = renEmp[o[c]]; });
      });
    }

    var usadosLot = idsDe(b.lotes,"id_lote").concat(idsDe(L.lotes,"id_lote"),
                          idsDe(remoto.lotes,"id_lote"), eliminados.lotes);
    var bLot = indexar(b.lotes,"id_lote"), rLot = indexar(remoto.lotes,"id_lote");
    var renLot = {};
    L.lotes.forEach(function(l){
      var id = l.id_lote;
      if(bLot[id] || !rLot[id] || mismo(rLot[id], l)) return;
      var nuevo = proximoId(usadosLot, prefijoDe(l.id_parque, "L"));
      usadosLot.push(nuevo); renLot[id] = nuevo; l.id_lote = nuevo;
    });
    if(Object.keys(renLot).length){
      L.ocupaciones.forEach(function(o){ if(renLot[o.id_lote]) o.id_lote = renLot[o.id_lote]; });
    }

    // Ocupaciones usan id numérico: mismo criterio.
    var usadosOcu = idsDe(b.ocupaciones,"id").concat(idsDe(L.ocupaciones,"id"), idsDe(remoto.ocupaciones,"id"));
    var bOcu = indexar(b.ocupaciones,"id"), rOcu = indexar(remoto.ocupaciones,"id");
    L.ocupaciones.forEach(function(o){
      var id = String(o.id);
      if(bOcu[id] || !rOcu[id] || mismo(rOcu[id], o)) return;
      var nuevo = Math.max.apply(null, [0].concat(usadosOcu.map(Number))) + 1;
      usadosOcu.push(nuevo); o.id = nuevo;
    });

    function fusionarColeccion(bl, ll, rl, clave){
      var B = indexar(bl, clave), Lm = indexar(ll, clave), R = indexar(rl, clave);
      var claves = {};
      [B, Lm, R].forEach(function(m){ Object.keys(m).forEach(function(k){ claves[k] = true; }); });
      var out = [];
      Object.keys(claves).forEach(function(k){
        var bk = B[k], lk = Lm[k], rk = R[k];
        var lCambio = !mismo(lk, bk), rCambio = !mismo(rk, bk);
        var elegido;
        if(lCambio && rCambio && !mismo(lk, rk)){ conflictos++; elegido = lk; }
        else if(lCambio){ elegido = lk; }
        else { elegido = rk; }
        if(elegido !== undefined) out.push(elegido);
      });
      return out;
    }

    var empresas = fusionarColeccion(b.empresas, L.empresas, remoto.empresas, "id_empresa");
    var lotes = fusionarColeccion(b.lotes, L.lotes, remoto.lotes, "id_lote");
    var ocupaciones = fusionarColeccion(b.ocupaciones, L.ocupaciones, remoto.ocupaciones, "id");
    // Las bajas se aplican después: la fusión no puede resucitar lo borrado.
    empresas = empresas.filter(function(e){ return eliminados.empresas.indexOf(e.id_empresa) < 0; });
    lotes = lotes.filter(function(l){ return eliminados.lotes.indexOf(l.id_lote) < 0; });
    ocupaciones = ocupaciones.filter(function(o){
      return eliminados.lotes.indexOf(o.id_lote) < 0 && eliminados.empresas.indexOf(o.id_empresa_ocupante) < 0;
    });

    return {
      conflictos: conflictos,
      merged: {
        parques: mismo(L.parques, b.parques) ? remoto.parques : L.parques,
        empresas: empresas,
        lotes: lotes,
        ocupaciones: ocupaciones,
        reservas: mismo(L.reservas, b.reservas) ? remoto.reservas : L.reservas,
        eliminados: eliminados
      }
    };
  }
  function unirIds(a, b){
    return Array.from(new Set([].concat(Array.isArray(a) ? a : [], Array.isArray(b) ? b : [])));
  }

  // Lo que llega del servidor, con el mismo formato que usa la app.
  function normalizarRemoto(datos){
    var arr = function(x){ return Array.isArray(x) ? x : []; };
    var m = migrarParques({
      parques: Array.isArray(datos.parques) ? datos.parques : null,
      parque: datos.parque,
      empresas: arr(datos.empresas), lotes: arr(datos.lotes),
      ocupaciones: arr(datos.ocupaciones), reservas: arr(datos.reservas),
      eliminados: datos.eliminados
    });
    return {parques: m.parques, empresas: m.empresas, lotes: m.lotes,
            ocupaciones: m.ocupaciones, reservas: m.reservas, eliminados: m.eliminados};
  }

  function aplicarDatos(d){
    state.parques = d.parques; state.empresas = d.empresas; state.lotes = d.lotes;
    state.ocupaciones = d.ocupaciones; state.reservas = d.reservas; state.eliminados = d.eliminados;
    resolverParqueActivo();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    renderParqueSwitch();
    renderFiltros();
    renderComercial();
    renderEmpresas();
    if(!viewDash.hidden) renderDashboard();
  }

  // Adopta lo que tiene el servidor. Si hay cambios sin subir, los fusiona
  // con él (nunca los descarta). Devuelve true si todavía hay algo que subir.
  function adoptarRemoto(datos, sha){
    var remoto = normalizarRemoto(datos);
    var pendientes = haySyncPendiente();
    var final = remoto;
    if(pendientes){
      var f = fusionarParques(syncBase.datos, datosParaSync(), remoto);
      final = f.merged;
      if(f.conflictos) console.warn("[sync] " + f.conflictos + " registro(s) editados en dos dispositivos: se conservó la versión de este dispositivo.");
    }
    guardarBase(sha, remoto);
    aplicarDatos(final);
    if(pendientes && mismo(final, remoto)){
      // Nada que subir: lo local ya estaba en el servidor.
      try{ localStorage.removeItem(SYNC_PENDING_KEY); }catch(e){}
      return false;
    }
    return pendientes;
  }

  // Pide el archivo al servidor y lo adopta. Devuelve true si hay que subir.
  async function descargar(){
    var resp = await HeaderGlobal.fetchApi(SYNC_ENDPOINT);
    if(!resp.ok) throw new Error("GET falló: " + resp.status);
    var datos = await resp.json();
    if(!datos || !(Array.isArray(datos.lotes) || Array.isArray(datos.empresas))){
      throw new Error("El servidor devolvió datos con una forma inesperada.");
    }
    return adoptarRemoto(datos, (datos._meta && datos._meta.sha) || null);
  }

  async function subirCambios(){
    if(syncEnProgreso || !haySyncPendiente() || errorPermanente) return;
    syncEnProgreso = true;
    setSyncStatus("subiendo");
    var seqEnviado = cambiosSeq;
    try{
      // Sin base no hay forma de detectar un choque: se trae primero.
      if(!syncBase.sha) await descargar();
      var enviado = datosParaSync();
      var resp = await HeaderGlobal.fetchApi(SYNC_ENDPOINT, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(Object.assign({}, enviado, {_baseSha: syncBase.sha}))
      });

      // 409: otro dispositivo escribió después de nuestra base. Se fusiona
      // con lo que hay y se vuelve a intentar sobre el sha nuevo.
      if(resp.status === 409){
        var choque = null;
        try{ choque = await resp.json(); }catch(e){}
        if(!choque || !choque.actual || !Array.isArray(choque.actual.empresas)){
          throw new Error("Conflicto con otro dispositivo y no se pudo fusionar. Recargá la página.");
        }
        var quedaAlgo = adoptarRemoto(choque.actual, (choque.actual._meta && choque.actual._meta.sha) || null);
        syncEnProgreso = false;
        if(quedaAlgo) programarSubida(0);
        return;
      }

      if(!resp.ok){
        // 4xx (salvo 429) es culpa del payload o de la configuración:
        // reintentar en loop no lo arregla y esconde el problema.
        if(resp.status >= 400 && resp.status < 500 && resp.status !== 429) errorPermanente = true;
        throw new Error("POST falló: " + resp.status);
      }
      var ok = null;
      try{ ok = await resp.json(); }catch(e){}
      // Lo que el servidor tiene ahora es lo enviado: pasa a ser la base.
      guardarBase(ok && ok.sha ? ok.sha : null, enviado);
      // Si se editó algo mientras volaba el POST, la marca se queda.
      if(cambiosSeq === seqEnviado){
        try{ localStorage.removeItem(SYNC_PENDING_KEY); }catch(e){}
      }
      fallosSeguidos = 0;
      setSyncStatus(haySyncPendiente() ? "pendiente" : "sincronizado");
    }catch(e){
      fallosSeguidos++;
      setSyncStatus(errorPermanente ? "rechazado" : "offline");
      if(!errorPermanente){
        var espera = proximoBackoff();
        console.warn("[sync] intento " + fallosSeguidos + " falló; reintento en " + (espera/1000) + "s:", e.message || e);
        programarSubida(espera);
      } else {
        console.error("[sync] el servidor rechaza los datos, no se reintenta:", e.message || e);
      }
      syncEnProgreso = false;
      return;
    }
    syncEnProgreso = false;
    // Llegó algo nuevo mientras el POST estaba en vuelo: se manda agendado.
    if(haySyncPendiente()) programarSubida(100);
  }

  // Traer el servidor no depende de que no haya cambios locales: si los hay,
  // se fusionan. Así "Actualizar datos" y la vuelta a la pantalla siempre
  // muestran lo último, sin perder nada.
  async function bajarCambiosIniciales(){
    setSyncStatus("cargando");
    try{
      var subir = await descargar();
      if(subir) programarSubida(0);
      setSyncStatus(haySyncPendiente() ? "pendiente" : "sincronizado");
    }catch(e){
      setSyncStatus("offline");
    }
  }

  var inicial = load();
  var state = Object.assign({
    editingTipo:null, editingId:null, modalMode:null,
    filterEstadoComercial:"", filterManzanaComercial:"", filterDisponibleComercial:false,
    filterSituacionEmpresas:"", searchComercial:"", searchEmpresas:"", parqueActivo:null
  }, inicial);

  // ---- Alcance: qué parque se está mirando ----
  // Todo lo que se lista, cuenta o grafica sale de estas dos funciones, nunca
  // de state.lotes/state.empresas directo: si una pantalla se saltea el
  // filtro, mezcla los 138 lotes de Güemes con los 135 de Salta sin que se
  // note (los totales quedan plausibles y el bug pasa desapercibido).
  function resolverParqueActivo(){
    var ids = state.parques.map(function(p){ return p.id; });
    if(ids.indexOf(state.parqueActivo) === -1) state.parqueActivo = ids[0] || "guemes";

  function empresaPorId(id){ return state.empresas.find(function(e){return e.id_empresa===id;}); }
  function lotesDeEmpresa(id){ return state.lotes.filter(function(l){return l.id_empresa===id;}); }
  // Lotes que una empresa ocupa por alquiler sin ser la titular. La
  // titularidad vive en lote.id_empresa y la ocupación en `ocupaciones`: son
  // dos vínculos distintos y ninguno sobreescribe al otro.
  function lotesOcupadosPor(id){
    return state.ocupaciones
      .filter(function(o){ return o.vigente && o.id_empresa_ocupante===id; })
      .map(function(o){ return state.lotes.find(function(l){ return l.id_lote===o.id_lote; }); })
      .filter(Boolean);
  }
  function empresaTotalM2(id){
    return lotesDeEmpresa(id).reduce(function(acc,l){ return acc + (Number(l.superficie_m2)||0); }, 0);
  }
  function ocupacionDeLote(idLote){ return state.ocupaciones.find(function(o){return o.id_lote===idLote && o.vigente;}); }

  // La situación de la EMPRESA cuando su registro no la declara.
  //
  // El origen de Salta traía una columna que mezclaba las dos cosas y se
  // separó al importar (ver CLAUDE.md): "Alquila" describe al LOTE y pasó a
  // `estado`, Activa/Sin actividad/En construcción describen a la EMPRESA y
  // pasaron a `situacion`. En Güemes esa separación nunca se hizo: la base
  // SQLite dejó TODO en `lotes.estado` y las 53 empresas quedaron con
  // `situacion: null`, así que el desplegable del listado estaba
  // deshabilitado y la ficha mostraba "—" para todas.
  //
  // Se deriva, no se inventa: el valor sale del estado de los lotes que esa
  // misma empresa tiene a su nombre, que es exactamente el dato que el
  // origen puso en la fila equivocada. "Alquilada" no entra porque describe
  // al lote y no dice nada de si su titular sigue operando; si no queda
  // ninguna evidencia, la situación sigue siendo desconocida.
  //
  // Es una lectura, no una escritura: nada de esto se guarda en el registro
  // de la empresa. Si alguien carga la situación a mano desde la ficha, ese
  // valor gana y la derivación deja de aplicarse para esa empresa.
  var PRIORIDAD_SITUACION = ["Activa","En construcción","Sin actividad"];
  function situacionSegunLotes(idEmpresa){
    var estados = lotesDeEmpresa(idEmpresa).map(function(l){ return l.estado; });
    // Un titular con un lote activo y otro parado está operando: gana el
    // estado más activo. Son 2 de las 53 de Güemes (FMF ARGENTINA y PETIT
    // PLAST), las dos con un lote Activa.
    for(var i=0;i<PRIORIDAD_SITUACION.length;i++){
      if(estados.indexOf(PRIORIDAD_SITUACION[i])!==-1) return PRIORIDAD_SITUACION[i];
    }
    return null;
  }
  function situacionDe(e){
    if(!e) return null;
    return e.situacion || situacionSegunLotes(e.id_empresa);
  }
  function situacionEsDerivada(e){ return !!e && !e.situacion && !!situacionSegunLotes(e.id_empresa); }

  // Guardar el ocupante elegido en el formulario. Toca SOLO `ocupaciones`:
  // ni el lote ni ninguna de las dos empresas. Cambiar de ocupante cierra la
  // ocupación anterior (queda en el historial con su fecha_hasta, no se
  // borra) y abre una nueva — el lote no se duplica y la titularidad queda
  // exactamente como estaba.
  function siguienteIdOcupacion(){
    return state.ocupaciones.reduce(function(m,o){ return Math.max(m, Number(o.id)||0); }, 0) + 1;
  }
  function aplicarOcupante(lote, idOcupante){
    var actual = ocupacionDeLote(lote.id_lote);
    if(actual && actual.id_empresa_ocupante===idOcupante){
      // Mismo ocupante: el vínculo sigue igual. Solo se refresca de qué
      // titular depende, por si el lote cambió de titular en este guardado.
      actual.id_empresa_titular = lote.id_empresa || null;
      return;
    }
    if(actual){
      actual.vigente = false;
      if(!actual.fecha_hasta) actual.fecha_hasta = hoyISO();
    }
    if(!idOcupante) return;
    state.ocupaciones.push({
      id: siguienteIdOcupacion(),
      id_lote: lote.id_lote,
      id_empresa_titular: lote.id_empresa || null,
      id_empresa_ocupante: idOcupante,
      fecha_desde: hoyISO(),
      fecha_hasta: null,
      vigente: true,
      observacion: null
    });
  }
  function nombreEmpresa(id){ var e=empresaPorId(id); return e ? e.nombre_empresa : null; }

  // ---- Filtros ----
  // "Comercial" = lotes sin empresa (disponibles para la venta + los pocos
  // pendientes de revisión); los filtros de estado/manzana se calculan solo
  // sobre ese universo, no sobre los 138 lotes totales.
  function lotesSinEmpresa(){ return lotesDelParque().filter(function(l){ return !l.id_empresa; }); }

  var selSituacionEmpresas = document.getElementById("filterEstadoEmpresas");

  document.getElementById("searchComercial").addEventListener("input", function(){ state.searchComercial=this.value.toLowerCase(); renderComercial(); });
  document.getElementById("searchEmpresas").addEventListener("input", function(){ state.searchEmpresas=this.value.toLowerCase(); renderEmpresas(); });

  function comercialFiltrados(){

      if(state.filterManzanaComercial && l.manzana!==state.filterManzanaComercial) return false;

  // ---- Listado: Comercial (lotes sin empresa) ----
  function renderComercial(){

      var id = "Mz "+(l.manzana||"—")+" · Parcela "+(l.parcela||"—");
      var estado = l.estado
        ? '<div class="ui-card-estado" style="color:var(--'+claseEstado(l.estado)+')"><i class="ui-dot"></i>'+esc(l.estado)+(l.disponible?' · en venta':'')+'</div>'
        : (l.disponible ? '<div class="ui-card-estado is-ok"><i class="ui-dot"></i>En venta</div>' : '');
      return '<button class="ui-card" data-open-lote="'+esc(l.id_lote)+'">'+
        '<div class="ui-card-title">'+esc(nombre)+'</div>'+
        '<div class="ui-card-id">'+esc(l.id_lote)+' · '+esc(id)+'</div>'+
        estado+
        '<div class="ui-card-meta">'+fmtM2(l.superficie_m2)+'</div>'+
        '</button>';
    }).join("");
    cont.querySelectorAll("[data-open-lote]").forEach(function(btn){
      btn.addEventListener("click", function(){ openModal("lote", btn.getAttribute("data-open-lote")); });
    });
  }

  // ---- Listado: Empresas ----
  function renderEmpresas(){
    var cont = document.getElementById("empresasList");
    var cuenta = document.getElementById("empresasCount");
    var filtradas = empresasFiltradas().slice().sort(function(a,b){
      return String(a.nombre_empresa||"").localeCompare(String(b.nombre_empresa||""));
    });
    var total = empresasDelParque().length;
    cuenta.textContent = !total ? ""
      : (filtradas.length===total ? total+" empresas" : filtradas.length+" de "+total+" empresas");
    // Contador en el chip de la pestaña (no en "Análisis": no es un listado,
    // no tiene una cantidad de ítems que mostrar).
    tabEmpresas.innerHTML = 'Empresas <span class="count">'+total+'</span>';
    if(!filtradas.length){
      cont.innerHTML = '<div class="empty-state">'+
        (total ? 'Sin empresas que coincidan con el filtro.' : 'Todavía no hay empresas cargadas.')+
        '</div>';
      return;
    }
    cont.innerHTML = filtradas.map(function(e){
      var totalM2 = empresaTotalM2(e.id_empresa);
      var situ = situacionDe(e);
      var tono = {"Activa":"is-ok","En construcción":"is-warn","Sin actividad":"is-idle"}[situ] || "";
      var estado = situ ? '<div class="ui-card-estado '+tono+'"><i class="ui-dot"></i>'+esc(situ)+'</div>' : '';
      var detalle = [e.rubro, e.contacto_nombre].filter(Boolean).join(" · ");
      return '<button class="ui-card" data-open-empresa="'+esc(e.id_empresa)+'">'+
        '<div class="ui-card-title">'+esc(e.nombre_empresa)+'</div>'+
        '<div class="ui-card-id">'+esc(e.id_empresa)+'</div>'+
        estado+
        '<div class="ui-card-meta">'+resumenSuperficie(lotesDeEmpresa(e.id_empresa), lotesOcupadosPor(e.id_empresa), totalM2)+'</div>'+
        (detalle?'<div class="ui-card-meta">'+esc(detalle)+'</div>':'')+
        '</button>';
    }).join("");
    cont.querySelectorAll("[data-open-empresa]").forEach(function(btn){
      btn.addEventListener("click", function(){ openModal("empresa", btn.getAttribute("data-open-empresa")); });
    });
  }

  // ---- Modal ----
  var veil = document.getElementById("veil"), modal = document.getElementById("modal");
  veil.addEventListener("click", function(ev){ if(ev.target===veil) closeModal(); });

  // Escape cierra la ficha, como en Seguimiento (abrirOverlay) y en
  // Proyectos. Sin esto, en Parques la única salida era la × o el clic
  // fuera: con el teclado la ficha quedaba abierta y, en el celular, el
  // botón «atrás» salía de la app en vez de cerrar lo que estaba arriba.
  document.addEventListener("keydown", function(ev){
    if(ev.key==="Escape" && !veil.hidden) closeModal();
  });

  function openModal(tipo, id){
    state.editingTipo = tipo;
    state.editingId = id;
    state.modalMode = id ? "view" : "edit";
    if(tipo==="empresa") state.empresaSubTab = "empresa";
    veil.hidden = false;
    renderModal();
  }
  function closeModal(){ veil.hidden = true; state.editingTipo=null; state.editingId = null; state.modalMode = null; }

  function renderModal(){
    if(state.editingTipo==="empresa"){
      var emp = state.editingId ? empresaPorId(state.editingId) : null;
      if(!emp || state.modalMode==="edit") renderEmpresaEdit(emp);
      else renderEmpresaView(emp);
    } else {
      var lote = state.editingId ? state.lotes.find(function(x){return x.id_lote===state.editingId;}) : null;
      if(!lote || state.modalMode==="edit") renderLoteEdit(lote);
      else renderLoteView(lote);
    }
  }

  function viewItem(label, html){
    return '<div class="view-item"><label>'+esc(label)+'</label><div class="v">'+(html || '<span class="view-empty">—</span>')+'</div></div>';
  }

  // Fila título-en-negrita/dato-en-gris para la pestaña Empresa de la
  // ficha (al revés de viewItem, que usa label chico arriba y valor en
  // negrita abajo) — pedido explícito del usuario 2026-10-13.
  function infoRow(label, valor, nota){
    return '<div class="info-row"><dt>'+esc(label)+'</dt><dd>'+(valor?esc(valor):'<span class="view-empty">—</span>')+
      (valor&&nota?'<span class="info-nota">'+esc(nota)+'</span>':'')+'</dd></div>';
  }

  // Fila ícono + label + valor para la pestaña Contacto. Si hay href, toda
  // la fila es un <a> real (mailto:/tel:/https:) — si no hay dato, la fila
  // ni se dibuja (nada que mostrar ni a dónde ir).
  function contactRow(icon, label, valor, href, targetBlank){
    if(!valor) return "";
    var tag = href ? 'a href="'+esc(href)+'"'+(targetBlank?' target="_blank" rel="noopener"':'') : 'div';
    var cierre = href ? 'a' : 'div';
    return '<'+tag+' class="contact-row">'+
      '<span class="contact-icon" aria-hidden="true">'+icon+'</span>'+
      '<div class="contact-body"><span class="contact-label">'+esc(label)+'</span>'+
      '<span class="contact-value">'+esc(valor)+'</span></div>'+
      '</'+cierre+'>';
  }

  // Datos institucionales de UNA empresa, leídos siempre de su propio
  // registro. Lo usan la pestaña Contacto de la ficha de empresa y el bloque
  // de ocupación de la ficha de lote: titular y ocupante se muestran con el
  // mismo criterio y ninguno hereda los datos del otro.
  function filasContacto(e){
    // `|| null` y no `e.campo ? … : null`: un valor que existe pero del que
    // no sale un link (el "mail" que dice "no") tiene que quedar como texto,
    // no como un <a href="">.
    return contactRow(ICON_MAIL, "Email", e.mail, mailtoHref(e.mail) || null)+
      contactRow(ICON_PHONE, "Teléfono", e.telefono, telHref(e.telefono) || null)+
      contactRow(ICON_PIN, "Domicilio", e.ubicacion, null)+
      contactRow(ICON_WEB, "Página web", e.pagweb, webHref(e.pagweb) || null, true)+
      contactRow(ICON_IG, "Instagram", e.instagram, instagramHref(e.instagram) || null, true)+
      contactRow(ICON_FB, "Facebook", e.facebook, facebookHref(e.facebook) || null, true)+
      contactRow(ICON_LINKEDIN, "LinkedIn", e.linkedin, linkedinHref(e.linkedin) || null, true);
  }
  function tieneContacto(e){
    return !!(e.mail || e.telefono || e.ubicacion || e.pagweb || e.instagram || e.facebook || e.linkedin);
  }
  // viewItem siempre dibuja la fila (con "—" si no hay dato), que es lo que
  // se quiere en Ubicación: ahí el guión informa que falta. En la ocupación
  // no: se dibujan solo los campos con dato.
  // Línea de superficie de la ficha y de la tarjeta de empresa. Separa los
  // dos vínculos: m² propios si tiene lotes a su nombre, y si no los tiene
  // pero ocupa, cuántos ocupa.
  function resumenSuperficie(propios, ocupados, totalM2){
    if(propios.length) return esc(fmtM2(totalM2))+" totales";
    if(ocupados.length) return "Ocupa "+ocupados.length+(ocupados.length===1?" lote":" lotes")+" por alquiler";
    return esc(fmtM2(totalM2))+" totales";
  }
  function itemsConDato(pares){
    return pares.filter(function(p){ return p[1]; })
      .map(function(p){ return viewItem(p[0], esc(p[1])); }).join("");
  }

  // ---- Ficha de lote ----
  function renderLoteView(l){
    var titular = empresaPorId(l.id_empresa);
    var ocup = ocupacionDeLote(l.id_lote);
    var ocupante = ocup ? empresaPorId(ocup.id_empresa_ocupante) : null;
    var compartida = lotesConMatriculaCompartida(l);
    // Cuando hay más de una matrícula, el resumen de arriba no puede hablar
    // por todas: se dice "Según matrícula" y el detalle va en su sección.
    var mats = matriculasDe(l);
    var variasMat = mats.length > 1;
    var escrituraMezclada = variasMat && valoresDistintos(mats, function(m){ return escrituraTexto(m.escritura); });
    var titularMezclado  = variasMat && valoresDistintos(mats, titularDeMatricula);
    var faltaMatricula = !mats.length;
    var faltaSuperficie = l.superficie_m2 == null || l.superficie_m2 === "";

    modal.innerHTML =
      '<div class="modal-head"><button class="x-close" id="xCloseViewLote">&times;</button></div>'+
      '<div class="view-head">'+
        '<div><div class="view-title">'+esc(l.id_lote)+'</div>'+
          '<div class="view-sub">'+(variasMat
            ? esc(mats.length+" matrículas")
            : 'Matrícula '+esc(l.matricula||"—"))+'</div></div>'+
        (l.estado?'<span class="badge" style="background:var(--'+claseEstado(l.estado)+'-bg);color:var(--'+claseEstado(l.estado)+')">'+esc(l.estado)+'</span>':'')+
      '</div>'+

      '<div class="view-section"><h3>Ubicación</h3>'+
        '<div class="view-grid">'+
          // 123 de los 135 lotes de Salta traen domicilio y la ficha no lo
          // mostraba, con la sección llamándose justamente "Ubicación".
          // Solo cuando hay dato: en Güemes la columna no existe (0 de 139)
          // y una fila con guión en los 139 no informaría nada.
          (l.ubicacion ? viewItem("Domicilio", esc(l.ubicacion)) : '')+
          viewItem("Manzana", l.manzana?esc(l.manzana):null)+
          viewItem("Parcela", l.parcela?esc(l.parcela):null)+
          viewItem("Superficie", esc(fmtM2(l.superficie_m2)))+
          viewItem("Escritura", escrituraMezclada
            ? "Según matrícula"
            : (variasMat ? esc(escrituraTexto(mats[0].escritura)) : (l.escritura?esc(l.escritura):null)))+
        '</div>'+
      '</div>'+

      // Detalle registral, solo cuando hay más de una. Con una sola, lo que
      // ya muestran Ubicación y Titularidad alcanza y esta sección sería
      // repetir el mismo dato en dos lugares.
      (variasMat
        ? '<div class="view-section"><h3>Matrículas ('+mats.length+')</h3>'+
            '<div class="lot-list">'+mats.map(function(m){
              return '<div class="lot-row">'+
                '<div class="lot-row-main">'+
                  '<span class="mono">'+esc(m.matricula||"—")+'</span>'+
                  '<span class="lot-m2">'+fmtM2(m.superficie_m2)+'</span>'+
                '</div>'+
                '<div class="lot-row-sub">'+
                  '<span><span class="lot-field-label">Propiedad: </span><span class="lot-field-value">'+
                    esc(titularDeMatricula(m) || "—")+'</span></span>'+
                  '<span><span class="lot-field-label">Escritura: </span><span class="lot-field-value">'+
                    esc(escrituraTexto(m.escritura))+'</span></span>'+
                '</div>'+
              '</div>';
            }).join("")+'</div>'+
            (titularMezclado || escrituraMezclada
              ? '<p class="view-empty" style="margin-top:8px">Las matrículas de este lote no coinciden entre sí en '+
                  (titularMezclado && escrituraMezclada ? 'titular y escritura'
                    : (titularMezclado ? 'el titular registral' : 'el estado de escritura'))+
                '. El lote no es de una sola propiedad: cada matrícula vale por su fila.</p>'
              : '')+
          '</div>'
        : '')+

      '<div class="view-section"><h3>Titularidad</h3>'+
        (titular
          ? '<div class="view-grid">'+
              viewItem("Empresa", '<a href="#" data-goto-empresa="'+esc(titular.id_empresa)+'">'+esc(titular.nombre_empresa)+'</a>')+
              viewItem("Propietario de la matrícula", titularMezclado
                ? "Según matrícula"
                : (variasMat ? esc(titularDeMatricula(mats[0]) || "") : (l.propietario_matricula?esc(l.propietario_matricula):null)))+
            '</div>'
          : '<p class="view-empty">'+(l.disponible ? 'Sin empresa — disponible para la venta.' : 'Sin empresa asignada (pendiente de revisión).')+'</p>')+
      '</div>'+

      // Ocupación por alquiler. Todo lo de arriba (matrícula, superficie,
      // escritura, titularidad) sale del lote y de su titular y no se toca
      // acá; esta sección sale ENTERA del registro de la empresa ocupante.
      // Son dos vínculos distintos y ninguno sobreescribe al otro: cambiar
      // de ocupante no mueve un solo dato registral del lote.
      (ocup
        ? '<div class="view-section ocupacion"><h3>Ocupación por alquiler</h3>'+
            '<div class="view-grid">'+
              viewItem("Empresa ocupante", ocupante ? '<a href="#" data-goto-empresa="'+esc(ocupante.id_empresa)+'">'+esc(ocupante.nombre_empresa)+'</a>' : null)+
              // Solo los que tienen dato: la mayoría de los ocupantes entró
              // al sistema con el nombre y nada más, y una grilla de seis
              // guiones no informa nada.
              itemsConDato([
                ["Actividad", situacionDe(ocupante)],
                ["Representante", ocupante && ocupante.contacto_nombre],
                ["Cargo", ocupante && ocupante.cargo],
                ["Rubro", ocupante && ocupante.rubro],
                ["Desde", ocup.fecha_desde]
              ])+
            '</div>'+
            (ocupante && tieneContacto(ocupante)
              ? '<div class="contact-list" style="margin-top:10px">'+filasContacto(ocupante)+'</div>'
              : '<p class="view-empty" style="margin-top:8px">El origen no trae datos institucionales propios de '+
                esc(ocupante?ocupante.nombre_empresa:"la empresa ocupante")+'.</p>')+
            (ocup.observacion?'<p class="view-empty" style="margin-top:8px">'+esc(ocup.observacion)+'</p>':'')+
          '</div>'
        : '')+

      // Un lote marcado "Alquilada" sin ocupación cargada: el origen dice
      // que está alquilado pero no nombra a quién. Se señala, no se inventa
      // (34 lotes de Salta y 7 de Güemes están en ese estado y solo 16 y 4
      // traen el nombre del ocupante en la columna «Alquilada»).
      (!ocup && String(l.estado||"")==="Alquilada"
        ? '<div class="view-section revisar"><h3>A revisar</h3>'+
            '<p>El lote figura como <strong>Alquilada</strong> pero no tiene una empresa ocupante cargada. '+
            'El origen no la nombra; se puede asignar desde Editar, sin que cambie nada de la titularidad.</p>'+
          '</div>'
        : '')+

      (ocup && String(l.estado||"")!=="Alquilada"
        ? '<div class="view-section revisar"><h3>A revisar</h3>'+
            '<p>El lote tiene una empresa ocupante cargada, pero su estado es '+
            esc(l.estado||"Sin dato")+' y no <strong>Alquilada</strong>. Conviene que coincidan.</p>'+
          '</div>'
        : '')+

      // Un lote sin matrícula ni superficie se dibujaba como una fila de
      // guiones: fmtM2(null) ya devolvía "—" y no "0 m²", así que el total
      // nunca estuvo mal, pero nada distinguía "falta el dato" de "no
      // corresponde". Son 15 lotes de Salta sin superficie, 4 de ellos sin
      // matrícula tampoco. Se dice, no se completa a ojo.
      ((faltaMatricula || faltaSuperficie)
        ? '<div class="view-section revisar"><h3>A revisar</h3>'+
            '<p>Este lote no tiene '+
            (faltaMatricula && faltaSuperficie ? 'matrícula ni superficie'
              : (faltaMatricula ? 'matrícula' : 'superficie'))+
            ' en el archivo. Los guiones de arriba son dato faltante, no un lote vacío.</p>'+
          '</div>'
        : '')+

      (compartida.length
        ? '<div class="view-section revisar"><h3>A revisar</h3>'+
            '<p>'+(compartida.length===1
              ? 'La matrícula '
              : 'Estas matrículas del lote también están cargadas en otro lote con otro titular: ')+
            compartida.map(function(c){
              var ot = empresaPorId(c.lote.id_empresa);
              return esc(c.matricula)+', en <a href="#" data-goto-lote="'+esc(c.lote.id_lote)+'">'+esc(c.lote.id_lote)+'</a>'+(ot?' ('+esc(ot.nombre_empresa)+')':'');
            }).join("; ")+
            (compartida.length===1 ? ' también está cargada con otro titular.' : '.')+
            ' Puede ser que `ocupaciones` ya lo explique (titular de la matrícula ≠ empresa que ocupa el lote) — revisar antes de asumir que es un error de carga.</p>'+
          '</div>'
        : '')+

      '<div class="view-actions">'+
        '<button type="button" class="btn btn-outline btn-grow" id="btnEditLote">'+HeaderGlobal.icono("editar")+'Editar</button>'+
        '<button type="button" class="btn btn-danger btn-grow" id="btnDeleteViewLote">'+HeaderGlobal.icono("eliminar")+'Eliminar</button>'+
      '</div>';

    document.getElementById("xCloseViewLote").addEventListener("click", closeModal);
    document.getElementById("btnEditLote").addEventListener("click", function(){ state.modalMode="edit"; renderModal(); });
    document.getElementById("btnDeleteViewLote").addEventListener("click", onDeleteLote);
    modal.querySelectorAll("[data-goto-empresa]").forEach(function(a){
      a.addEventListener("click", function(ev){ ev.preventDefault(); openModal("empresa", a.getAttribute("data-goto-empresa")); });
    });
    modal.querySelectorAll("[data-goto-lote]").forEach(function(a){
      a.addEventListener("click", function(ev){ ev.preventDefault(); openModal("lote", a.getAttribute("data-goto-lote")); });
    });
  }

  function renderLoteEdit(l){
    var isNew = !l;
    // Solo empresas del parque que se está mirando: un lote de Salta no puede
    // tener como titular a una empresa instalada en Güemes.
    var empresasOpts = '<option value="">— Libre / sin empresa —</option>'+
      empresasDelParque().slice().sort(function(a,b){return String(a.nombre_empresa).localeCompare(String(b.nombre_empresa));}).map(function(e){
        return '<option value="'+esc(e.id_empresa)+'" '+(l&&l.id_empresa===e.id_empresa?"selected":"")+'>'+esc(e.nombre_empresa)+'</option>';
      }).join("");
    var estadoOpts = '<option value="">Sin dato</option>'+ESTADOS.map(function(est){
      return '<option value="'+esc(est)+'" '+(l&&l.estado===est?"selected":"")+'>'+esc(est)+'</option>';
    }).join("");

    // Ocupante por alquiler. Es un campo del VÍNCULO, no del lote: se guarda
    // en `ocupaciones` y no escribe una sola propiedad del lote ni del
    // titular. Por eso tampoco se ofrece en el alta (un lote nuevo no nace
    // alquilado) ni se puede elegir al propio titular: ocupar el lote del
    // que uno es titular no es una sublocación.
    var ocupActual = l ? ocupacionDeLote(l.id_lote) : null;
    var ocupanteOpts = '<option value="">— Sin ocupante / lo usa el titular —</option>'+
      empresasDelParque().filter(function(x){ return !l || x.id_empresa!==l.id_empresa; })
        .slice().sort(function(a,b){return String(a.nombre_empresa).localeCompare(String(b.nombre_empresa));})
        .map(function(x){
          var sel = ocupActual && ocupActual.id_empresa_ocupante===x.id_empresa ? "selected" : "";
          return '<option value="'+esc(x.id_empresa)+'" '+sel+'>'+esc(x.nombre_empresa)+'</option>';
        }).join("");

    modal.innerHTML =
      '<div class="modal-head"><h2>'+(isNew?"Nuevo lote":"Editar lote")+'</h2><button class="x-close" id="xCloseLote">&times;</button></div>'+
      '<form id="loteForm">'+
        '<div class="row2">'+field("manzana","Manzana","text",l,"9")+field("parcela","Parcela","text",l,"11")+'</div>'+
        '<div class="row2">'+field("superficie_m2","Superficie (m²)","number",l,"3000")+field("matricula","Matrícula","text",l,"12041")+'</div>'+
        '<div class="field"><label for="f_id_empresa">Empresa titular</label><select id="f_id_empresa" name="id_empresa">'+empresasOpts+'</select></div>'+
        field("propietario_matricula","Propietario de la matrícula","text",l,"Ente General de Parques...")+
        '<div class="row2">'+
          '<div class="field"><label for="f_estado">Estado</label><select id="f_estado" name="estado">'+estadoOpts+'</select></div>'+
          field("escritura","Escritura","text",l,"Si / No")+
        '</div>'+
        '<label class="field-check"><input type="checkbox" id="f_disponible" '+(l&&l.disponible?"checked":"")+'> Disponible para la venta (cartera comercial)</label>'+
        (isNew ? '' :
          '<div class="field"><label for="f_ocupante">Empresa ocupante (alquiler)</label>'+
          '<select id="f_ocupante" name="ocupante">'+ocupanteOpts+'</select>'+
          '<p class="field-nota">La titularidad, la matrícula, la superficie y la escritura no cambian: '+
          'quedan como están arriba. Esto solo registra quién ocupa el lote.</p></div>')+
        '<div class="modal-actions"><button type="submit" class="btn btn-primary btn-grow">'+HeaderGlobal.icono("guardar")+'Guardar</button>'+
        (isNew?'':'<button type="button" class="btn btn-secondary btn-grow" id="btnCancelEditLote">'+HeaderGlobal.icono("cancelar")+'Cancelar</button><button type="button" class="btn btn-danger btn-grow" id="btnDeleteLote">'+HeaderGlobal.icono("eliminar")+'Eliminar</button>')+'</div>'+
      '</form>';

    veil.hidden = false;
    document.getElementById("xCloseLote").addEventListener("click", closeModal);
    document.getElementById("loteForm").addEventListener("submit", onSaveLote);
    var delBtn = document.getElementById("btnDeleteLote");
    if(delBtn) delBtn.addEventListener("click", onDeleteLote);
    var cancelBtn = document.getElementById("btnCancelEditLote");
    if(cancelBtn) cancelBtn.addEventListener("click", function(){
      if(isNew){ closeModal(); } else { state.modalMode="view"; renderModal(); }
    });
  }

  function onSaveLote(ev){
    ev.preventDefault();
    var id = state.editingTipo==="lote" ? state.editingId : null;
    var existing = id ? state.lotes.find(function(x){return x.id_lote===id;}) : null;
    var isNew = !existing;
    var g = function(name){ var el=document.getElementById("f_"+name); return el?el.value:""; };

    var l = existing || {
      id_lote: siguienteId(state.lotes,"id_lote",prefijoDe(state.parqueActivo,"L")),
      id_parque: state.parqueActivo
    };
    l.manzana = g("manzana").trim();
    l.parcela = g("parcela").trim();
    l.superficie_m2 = g("superficie_m2") ? Number(g("superficie_m2")) : null;
    l.matricula = g("matricula").trim();
    l.id_empresa = g("id_empresa") || null;
    l.propietario_matricula = g("propietario_matricula").trim();
    l.estado = g("estado") || null;
    l.escritura = g("escritura").trim();
    l.disponible = document.getElementById("f_disponible").checked;

    // Después de los campos del lote y por separado: el ocupante no es uno
    // de ellos, va al vínculo. En el alta el select no existe (un lote nuevo
    // no nace alquilado), así que no se toca nada.
    var selOcupante = document.getElementById("f_ocupante");
    if(selOcupante) aplicarOcupante(l, selOcupante.value || "");

    if(isNew) state.lotes.push(l);
    state.editingTipo = "lote"; state.editingId = l.id_lote;
    save();
    closeModal();
    renderFiltros();
    renderComercial();
    renderEmpresas();

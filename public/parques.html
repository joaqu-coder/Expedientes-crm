  // ---- Ficha de empresa ----
  // Tres sub-tabs (Empresa / Lotes / Contacto) en vez de un solo scroll
  // largo: una empresa como ALIMENTOS SOFIA (E007) tiene 22 matrículas, y
  // meter eso junto con actividad, contacto y web en una sola vista vuelve
  // difícil encontrar un dato puntual. Mismo patrón que el mockup acordado
  // con el usuario (2026-10-13).
  function tituloYTitularDeLote(l, empresa){
    // "A nombre de quién está la propiedad": o es de EGPAIS (ente), o ya
    // está escriturada a la empresa. `escritura` viene del origen con
    // mayúsculas/espacios inconsistentes ("Si","si","No","no ","NO") y a
    // veces null — un null no se asume "No": sería inventar un dato que el
    // origen no tiene (ver nota de L048 en CLAUDE.md). Sin color (pedido
    // del usuario 2026-10-13): acá solo se devuelve el texto.
    // Con varias matrículas que no coinciden, esta fila no puede dar un
    // único Sí/No ni un único propietario sin inventar: manda a la ficha.
    var ms = matriculasDe(l);
    if(ms.length > 1){
      var escDist = valoresDistintos(ms, function(m){ return escrituraTexto(m.escritura); });
      var titDist = valoresDistintos(ms, titularDeMatricula);
      if(escDist || titDist) return {
        siNo: escDist ? "Según matrícula" : escrituraTexto(ms[0].escritura),
        propiedad: titDist ? "Según matrícula" : (titularDeMatricula(ms[0]) || "—")
      };
    }
    var e = String(l.escritura||"").trim();
    if(!e) return { siNo:"Sin dato", propiedad: l.propietario_matricula || "—" };
    if(/^s/i.test(e)) return { siNo:"Sí", propiedad: l.propietario_matricula || (empresa&&empresa.nombre_empresa) || "—" };
    return { siNo:"No", propiedad:"EGPAIS (Ente General de Parques y Áreas Industriales de Salta)" };
  }

      };
      var propios = lotes.length

              ? '<a href="#" data-goto-empresa="'+esc(t.id_empresa)+'">'+esc(t.nombre_empresa)+'</a>'

      panelHtml = (ocupados.length ? '<h4 class="lot-group">A su nombre ('+lotes.length+')</h4>' : '')+

    } else if(tab==="contacto"){

    } else {
      // Representante, Cargo, Rubro, Situación, en ese orden — título en

      // CUIT y Observación salieron de la ficha a pedido del usuario
      // (2026-10-19): los dos primeros ya no existen en los datos desde la
      // fusión de los exports normalizados, y la observación era ruido en
      // pantalla. La de los 15 ocupantes de alquiler sigue guardada en el

      panelHtml =

              '<p>Puede ser la misma razón social cargada dos veces: '+
              similares.map(function(s){ return '<a href="#" data-goto-empresa="'+esc(s.id_empresa)+'">'+esc(s.nombre_empresa)+'</a>'; }).join(", ")+

            '</div>'

        '<dl class="info-list">'+
          infoRow("Representante", e.contacto_nombre)+

          // que no se lea como un dato declarado en el registro.
          infoRow("Situación", situacionDe(e),
                  situacionEsDerivada(e) ? "según el estado de sus lotes" : null)+
        '</dl>';
    }

    modal.innerHTML =
      '<div class="modal-head"><button class="x-close" id="xCloseViewEmp">&times;</button></div>'+
      '<div class="view-head"><div class="tarjeta-row">'+
        '<div class="avatar lg">'+esc(iniciales(e.nombre_empresa))+'</div>'+
        '<div><div class="view-title">'+esc(e.nombre_empresa)+'</div>'+
        // La superficie es de los lotes a su nombre. Una empresa que solo
        // ocupa por alquiler no tiene superficie propia, así que decir
        // "0 m² totales" sería leerse como un registro vacío en vez de como
        // lo que es: una ocupante sin titularidad.
        '<div class="emp-m2-hero">'+resumenSuperficie(lotes, ocupados, totalM2)+'</div></div>'+
      '</div></div>'+
      tabsHtml+
      '<div id="empSubpanel">'+panelHtml+'</div>'+
      '<div class="view-actions">'+
        '<button type="button" class="btn btn-outline btn-grow" id="btnEditEmp">'+HeaderGlobal.icono("editar")+'Editar</button>'+
        '<button type="button" class="btn btn-danger btn-grow" id="btnDeleteViewEmp">'+HeaderGlobal.icono("eliminar")+'Eliminar</button>'+
      '</div>';

    document.getElementById("xCloseViewEmp").addEventListener("click", closeModal);
    document.getElementById("btnEditEmp").addEventListener("click", function(){ state.modalMode="edit"; renderModal(); });
    document.getElementById("btnDeleteViewEmp").addEventListener("click", onDeleteEmpresa);
    modal.querySelectorAll("[data-subtab]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.empresaSubTab = btn.getAttribute("data-subtab");
        renderEmpresaView(e);
      });
    });
    modal.querySelectorAll("[data-goto-lote]").forEach(function(a){
      a.addEventListener("click", function(ev){ ev.preventDefault(); openModal("lote", a.getAttribute("data-goto-lote")); });
    });
    modal.querySelectorAll("[data-goto-empresa]").forEach(function(a){
      a.addEventListener("click", function(ev){ ev.preventDefault(); openModal("empresa", a.getAttribute("data-goto-empresa")); });

    var existing = id ? empresaPorId(id) : null;
    var isNew = !existing;
    var g = function(name){ var el=document.getElementById("f_"+name); return el?el.value:""; };

    var e = existing || {
      id_empresa: siguienteId(state.empresas,"id_empresa",prefijoDe(state.parqueActivo,"E")),
      id_parque: state.parqueActivo
    };
    e.nombre_empresa = g("nombre_empresa").trim();
    e.rubro = g("rubro").trim();
    e.telefono = g("telefono").trim();
    e.contacto_nombre = g("contacto_nombre").trim();
    e.cargo = g("cargo").trim();
    e.situacion = g("situacion") || null;
    e.mail = g("mail").trim();
    e.ubicacion = g("ubicacion").trim();
    e.pagweb = g("pagweb").trim();
    e.instagram = g("instagram").trim();
    e.facebook = g("facebook").trim();
    e.linkedin = g("linkedin").trim();

    if(isNew) state.empresas.push(e);

  function onDeleteEmpresa(){
    if(!state.editingId || state.editingTipo!=="empresa") return;
    var id = state.editingId;
    state.empresas = state.empresas.filter(function(x){return x.id_empresa!==id;});
    state.eliminados.empresas.push(id);
    // Un lote cuya empresa se borró queda libre, nunca con una referencia colgada.
    state.lotes.forEach(function(l){ if(l.id_empresa===id) l.id_empresa=null; });
    // Lo mismo del lado del vínculo: sin la empresa ocupante la ocupación no
    // existe; si era la titular, el vínculo queda sin titular pero el
    // ocupante sigue estando donde está.
    state.ocupaciones = state.ocupaciones.filter(function(o){ return o.id_empresa_ocupante!==id; });
    state.ocupaciones.forEach(function(o){ if(o.id_empresa_titular===id) o.id_empresa_titular=null; });
    save(); closeModal(); renderEmpresas(); renderFiltros(); renderComercial();
  }

  function field(name,label,type,obj,placeholder){
    var val = obj ? (obj[name]==null?"":obj[name]) : "";
    return '<div class="field"><label for="f_'+name+'">'+esc(label)+'</label>'+
      '<input id="f_'+name+'" name="'+name+'" type="'+type+'" value="'+esc(val)+'" placeholder="'+esc(placeholder||"")+'"></div>';
  }

  // ---- Dashboard ----
  function renderDashboard(){
    var lotes = lotesDelParque();
    var empresas = empresasDelParque();
    var idsLote = {};
    lotes.forEach(function(l){ idsLote[l.id_lote] = true; });
    var totalSup = lotes.reduce(function(s,l){ return s + (Number(l.superficie_m2)||0); }, 0);
    var disponibles = lotes.filter(function(l){return l.disponible;});
    var supDisponible = disponibles.reduce(function(s,l){ return s + (Number(l.superficie_m2)||0); }, 0);
    var sublocados = state.ocupaciones.filter(function(o){ return o.vigente && idsLote[o.id_lote]; });
    // Lotes que figuran alquilados pero sin ocupante cargado: el origen dice
    // que están alquilados y no dice a quién. Se cuenta aparte en vez de
    // mezclarlo con los que sí tienen el vínculo armado — si no, el total de
    // alquilados queda bajo y parece un dato completo.
    var alquiladosSinOcupante = lotes.filter(function(l){
      return String(l.estado||"")==="Alquilada" && !ocupacionDeLote(l.id_lote);
    });

    document.getElementById("kpiGrid").innerHTML = [
      ["Lotes", lotes.length],
      ["Empresas", empresas.length],
      ["Superficie total", fmtM2(totalSup)],
      ["Disponibles", disponibles.length+" ("+fmtM2(supDisponible)+")"],
      ["Alquilados a un tercero", sublocados.length],
      ["Alquilados sin ocupante cargado", alquiladosSinOcupante.length]
    ].map(function(kv){
      return '<div class="kpi-card"><div class="n">'+kv[1]+'</div><div class="l">'+esc(kv[0])+'</div></div>';
    }).join("");

    renderBarras("dashEstados", lotesPorEstado(lotes), function(k){
      return k==="Sin dato" ? "var(--muted)" : "var(--"+claseEstado(k)+")";
    });

    renderBarras("dashEscrituracion", lotesPorEscritura(lotes), function(k){
      return k==="Escriturada" ? "var(--c2)" : k==="No escriturada" ? "var(--warn)" : "var(--muted)";
    });

    var ranking = empresas.map(function(e){
      var sup = lotesDeEmpresa(e.id_empresa).reduce(function(s,l){ return s+(Number(l.superficie_m2)||0); }, 0);
      return { label: e.nombre_empresa, n: sup };
    }).filter(function(r){ return r.n>0; }).sort(function(a,b){ return b.n-a.n; }).slice(0,8);
    renderBarras("dashRankingEmpresas", ranking, function(){ return "var(--c1)"; }, fmtM2);

    var porRubro = {};
    empresas.forEach(function(e){ var k=e.rubro||"Sin rubro"; porRubro[k]=(porRubro[k]||0)+1; });
    renderBarras("dashRubros", Object.keys(porRubro).map(function(k){ return {label:k, n:porRubro[k]}; }), function(k){
      return k==="Sin rubro" ? "var(--muted)" : "var(--c4)";
    });
  }

  // {label,n} -> fila con barra proporcional al máximo del propio grupo.
  // fmt formatea el valor mostrado (por defecto el número tal cual); color
  // recibe la etiqueta y devuelve el color de la barra.
  function lotesPorEstado(lotes){
    var porEstado = {};
    lotes.forEach(function(l){ var k=l.estado||"Sin dato"; porEstado[k]=(porEstado[k]||0)+1; });
    return Object.keys(porEstado).map(function(k){ return {label:k, n:porEstado[k]}; });
  }
  function claseEscritura(v){
    var s = String(v||"").trim().toLowerCase();
    if(!s) return "Sin dato";
    if(s.charAt(0)==="s") return "Escriturada";
    if(s.charAt(0)==="n") return "No escriturada";
    return "Sin dato";
  }
  function lotesPorEscritura(lotes){
    var porEsc = {};
    lotes.forEach(function(l){ var k=claseEscritura(l.escritura); porEsc[k]=(porEsc[k]||0)+1; });
    return Object.keys(porEsc).map(function(k){ return {label:k, n:porEsc[k]}; });
  }
  function renderBarras(elId, filas, colorFn, fmtFn){
    filas = filas.slice().sort(function(a,b){ return b.n-a.n; });
    var max = Math.max.apply(null, filas.map(function(f){return f.n;}).concat([1]));
    document.getElementById(elId).innerHTML = filas.length ? filas.map(function(f){
      return '<div class="barra-row"><div class="barra-label">'+esc(f.label)+'</div>'+
        '<div class="barra-track"><div class="barra-fill" style="width:'+Math.round(f.n/max*100)+'%;background:'+colorFn(f.label)+'"></div></div>'+
        '<div class="barra-val">'+esc(fmtFn ? fmtFn(f.n) : f.n)+'</div></div>';
    }).join("") : '<div class="view-empty">Sin datos.</div>';
  }

  // ---- Tabs / routing ----
  // Default = Empresas (ya no hay una pestaña "Lotes" suelta).
  var tabEmpresas = document.getElementById("tabEmpresas"), tabComercial = document.getElementById("tabComercial"), tabDash = document.getElementById("tabDash");
  var viewEmpresas = document.getElementById("viewEmpresas"), viewComercial = document.getElementById("viewComercial"), viewDash = document.getElementById("viewDash");

  // "Análisis" en stand by (pedido del usuario, 2026-10-19): los KPIs de hoy
  // mezclan cosas que no se usan para decidir nada y hacen ruido. No se borró
  // nada — renderDashboard() y su marcado quedan intactos; esta constante
  // oculta la pestaña y manda #dashboard a Empresas. Para volver a
  // encenderla, una vez acordados los KPIs: poner false acá.
  var DASH_STANDBY = true;
  tabDash.hidden = DASH_STANDBY;
  function vistaDeHash(h){
    if(h==="#comercial") return "comercial";
    if(h==="#dashboard" && !DASH_STANDBY) return "dashboard";
    return "empresas";
  }
  function showView(name, desdeHash){
    var isComercial = name==="comercial", isDash = name==="dashboard" && !DASH_STANDBY;
    var isEmpresas = !isComercial && !isDash;
    viewEmpresas.hidden = !isEmpresas;
    viewComercial.hidden = !isComercial;
    viewDash.hidden = !isDash;
    tabEmpresas.classList.toggle("active", isEmpresas);
    tabComercial.classList.toggle("active", isComercial);
    tabDash.classList.toggle("active", isDash);
    tabEmpresas.setAttribute("aria-selected", String(isEmpresas));
    tabComercial.setAttribute("aria-selected", String(isComercial));
    tabDash.setAttribute("aria-selected", String(isDash));
    // La búsqueda va debajo del título, arriba de las pestañas: muestra la de
    // la vista activa. El Análisis no tiene buscador.
    document.querySelector('[data-buscador="empresas"]').hidden = !isEmpresas;
    document.querySelector('[data-buscador="comercial"]').hidden = !isComercial;
    if(isDash) renderDashboard();
    if(desdeHash) return;
    var destino = isComercial ? "#comercial" : isDash ? "#dashboard" : "#empresas";
    if(location.hash !== destino) location.hash = destino;
  }
  tabEmpresas.addEventListener("click", function(){ showView("empresas"); });
  tabComercial.addEventListener("click", function(){ showView("comercial"); });
  tabDash.addEventListener("click", function(){ showView("dashboard"); });
  window.addEventListener("hashchange", function(){
    showView(vistaDeHash(location.hash), true);
  });


  // Header común a las 4 apps (título + ⋮) y botón flotante de alta.
  HeaderGlobal.init({
    titulo: "Parques",
    accion: { etiqueta: "Nuevo lote", onClick: function(){ openModal("lote", null); } },
    menu: [
      { etiqueta: "Actualizar datos", onClick: function(){ bajarCambiosIniciales(); } }
    ]
  });

  renderParqueSwitch();
  renderFiltros();
  renderComercial();
  renderEmpresas();
  showView(vistaDeHash(location.hash), true);
  bajarCambiosIniciales();

  // Sin que nadie tenga que tocar nada: al volver a la pestaña (si no hay un
  // modal abierto) se trae lo último, y al recuperar la red se sube lo pendiente.
  var ultimoRefrescoParques = Date.now();
  document.addEventListener("visibilitychange", function(){
    if(document.hidden || !veil.hidden) return;
    if(Date.now() - ultimoRefrescoParques < 30000) return;
    ultimoRefrescoParques = Date.now();
    bajarCambiosIniciales();
  });
  window.addEventListener("online", function(){
    if(haySyncPendiente()) programarSubida(0); else bajarCambiosIniciales();
  });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>

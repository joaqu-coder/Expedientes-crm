<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Parques — EGPAIS">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parques">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Parques — EGPAIS</title>
<script>
// Aplicado antes del primer paint para no parpadear a oscuro si el usuario ya lo eligió.
(function(){
  var saved = localStorage.getItem("parques_crm_theme_v1");
  if(saved==="dark") document.documentElement.setAttribute("data-theme","dark");
})();
</script>
<style>
/* Misma paleta/tipografía que las otras tres apps: mismo acento índigo,
   misma escala de grises, fuente del sistema en toda la app. */
:root{
  --bg:#f9fafb; --surface:#ffffff; --surface-2:#f3f4f6; --border:#e5e7eb;
  --fg:#1f2937; --muted:#6b7280; --accent:#667eea; --accent-fg:#ffffff;
  --danger:#a1392c; --danger-bg:#f7e2dd;
  --warn:#a8650f; --warn-bg:#fbead0;
  --c1:#667eea; --c1-bg:#e7e9fb;
  --c2:#2f7a3c; --c2-bg:#e4f3e5;
  --c3:#a8650f; --c3-bg:#fbead0;
  --c4:#b05a1a; --c4-bg:#fbe9d8;
  --c5:#746d57; --c5-bg:#e8e5d9;
  color-scheme: light;
  --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono","Courier New",monospace;
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1d1d1d; --surface-2:#262625; --border:#38372f;
  --fg:#efece2; --muted:#a39d87; --accent:#667eea; --accent-fg:#ffffff;
  --danger:#d26a5c; --danger-bg:#301e1b;
  --warn:#e8a33d; --warn-bg:#2d2311;
  --c1:#8f9ff2; --c1-bg:#242a4d;
  --c2:#5fae6b; --c2-bg:#1b2a1c;
  --c3:#e8a33d; --c3-bg:#2d2311;
  --c4:#e3833f; --c4-bg:#2c2111;
  --c5:#8d8674; --c5-bg:#262520;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);margin:0;padding-inline:16px;padding-top:20px;padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px));-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.volver{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);text-decoration:none;margin-bottom:12px}
.volver:hover{color:var(--fg)}

/* Barra de navegación inferior fija, presente en las 5 páginas del hub —
   mismo concepto que la barra de pestañas de WhatsApp (ícono + etiqueta,
   plana, sin cajas ni sombra), con la app actual marcada con color y un
   fondo sutil detrás del ícono. Queda siempre visible al cambiar de
   sección o hacer scroll (position:fixed), por eso el body le deja
   84px de aire abajo. */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:15}
.nav-item{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px 8px;text-decoration:none;color:var(--muted);transition:color .15s ease}
.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav-icon{width:26px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background-color .15s ease}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.01em;line-height:1.2}
.nav-item.active{color:var(--accent)}
.nav-item.active .nav-icon{background:color-mix(in srgb, var(--accent) 16%, transparent)}

.sticky-top{position:sticky;top:0;background:var(--bg);z-index:10;padding-top:2px;margin-bottom:4px}

.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.page-header .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.page-header h1{font-size:21px;font-weight:700;margin-top:4px}
.page-header-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn-new{background:var(--accent);color:var(--accent-fg);border:none;border-radius:8px;padding:10px 16px;font-weight:600;font-size:14px;white-space:nowrap}
.btn-new:hover{filter:brightness(1.08)}
.btn-theme{background:var(--surface);border:1px solid var(--border);color:var(--fg);border-radius:8px;width:38px;height:38px;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.btn-theme:hover{border-color:var(--accent)}

/* Barra de filtros superior, mismo lenguaje que la barra inferior: chips
   redondeados en vez del subrayado de antes, scroll horizontal si no
   entran todos — mismo concepto que los chips de "Todos/No leídos" de
   WhatsApp. Medidas ajustadas a la referencia que pasó el usuario (Meta no
   publica las suyas, son valores de implementación razonables): 38px de
   alto, radio a pastilla (resuelve ~19px con este alto), 14px horizontal,
   8px entre chips, texto 14px peso normal. El activo es un fondo SUAVE
   (tinte del acento, no el color sólido) con texto en el color de acento —
   no texto blanco sobre un bloque de color. */
/* El padding vertical no es estético: el contenedor scrollea en horizontal y
   overflow-x:auto también recorta en vertical, así que sin estos 4px el área
   táctil extendida del chip (.tab::after, 44px) queda cortada y el borde del
   chip deja de responder al toque. */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;height:38px;background:var(--surface-2);border:none;color:var(--fg);font-size:14px;font-weight:400;padding:0 14px;border-radius:999px;white-space:nowrap;transition:background-color .15s ease,color .15s ease}
.tab:hover{background:color-mix(in srgb, var(--accent) 8%, var(--surface-2))}
.tab.active{background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent)}
/* Contador integrado junto al nombre del filtro ("Empresas 55"), en
   seminegrita para distinguirlo del texto del filtro (peso normal). No va
   en "Análisis": no es un listado, no tiene una cantidad que mostrar. */
.tab .count{font-weight:600;margin-left:4px}
/* El chip mide 38px, pero en pantalla táctil su objetivo de toque se extiende
   a los 44px que piden las guías de iOS/Android sin agrandar lo que se ve
   (mismo recurso en seguimiento.html y proyectos.html). */
@media (pointer: coarse){
  .tab{position:relative}
  .tab::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:44px}
}
.view[hidden]{display:none}

/* ---- Toolbar ---- */
.toolbar-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:20px;display:flex;flex-direction:column;gap:12px}
.toolbar-card select,.toolbar-card input[type=search]{background:var(--surface-2);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:13px}
.toolbar-search input[type=search]{width:100%}
.toolbar-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar-filters select{flex:1 1 150px}
.toolbar-check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}

/* ---- Listado de tarjetas ---- */
.lista{display:flex;flex-direction:column;gap:8px}
.tarjeta{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;cursor:pointer;text-align:left;width:100%}
.tarjeta:hover{border-color:var(--accent)}
.tarjeta-row{display:flex;align-items:center;gap:10px;min-width:0}
.tarjeta-main{min-width:0}

/* Avatar con iniciales: no hay logos reales cargados, así que es texto,
   no una imagen. Mismo color de acento que el resto de la suite. */
.avatar{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--c1-bg);color:var(--c1);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:var(--font-display)}
.avatar.lg{width:44px;height:44px;font-size:15px}

/* Bloque "a revisar": inconsistencia conocida del dato de origen (Excel de
   Güemes), no un error de la app — ámbar, no rojo. */
.view-section.revisar{background:var(--warn-bg);border:1px solid var(--warn);border-radius:10px;padding:11px 12px;margin-top:14px}
.view-section.revisar h3{color:var(--warn)}
.view-section.revisar p{font-size:12.5px;line-height:1.5;margin:0 0 6px}
.view-section.revisar p:last-child{margin-bottom:0}
.view-section.revisar a{color:inherit;font-weight:600}
.tarjeta-title{font-size:15px;font-weight:700}
.tarjeta-sub{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.tarjeta-count{font-size:12px;color:var(--muted);margin-bottom:12px;font-variant-numeric:tabular-nums}
.tarjeta-aside{flex:0 0 auto;display:flex;align-items:center;gap:6px;flex-direction:column;align-items:flex-end}
.empty-state{padding:30px 14px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:10px}

.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border-radius:6px;padding:3px 8px;white-space:nowrap}

/* ---- Modal ---- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:40px}
@media (min-width:640px){.veil{align-items:center}}
.veil[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:18px}
@media (min-width:640px){.modal{border-radius:14px}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.modal-head h2{font-size:17px}
.x-close{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:4px;min-width:44px;min-height:44px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface-2);border:1px solid var(--border);color:var(--fg);border-radius:7px;padding:9px 10px;font-size:16px;font-family:inherit;width:100%}
.field textarea{resize:vertical;min-height:70px}
.field-check{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}

.modal-actions{display:flex;gap:8px;margin-top:16px}
.btn-primary{flex:1;background:var(--accent);color:var(--accent-fg);border:none;border-radius:8px;padding:11px;font-weight:600;font-size:14px;min-height:44px}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:11px 14px;font-size:14px;min-height:44px}
.btn-danger{background:none;border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:11px 14px;font-size:13px;min-height:44px}
.btn-edit{background:none;border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:11px 14px;font-size:14px;min-height:44px}

/* ---- Modal: vista de lectura ---- */
.view-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.view-title{font-size:16px;font-weight:700}
.view-sub{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.view-section{margin-top:14px;padding-top:13px;border-top:1px solid var(--border)}
.view-section h3{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;font-weight:700}
.view-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px}
.view-item label{display:block;color:var(--muted);font-size:12px}
.view-item .v{margin-top:1px;font-size:13.5px;font-weight:600}
.view-item .v a{color:inherit}
.view-empty{font-size:12.5px;color:var(--muted)}
.view-actions{display:flex;gap:8px;margin-top:16px}
.btn-view-action{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:none;border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:11px;font-weight:600;font-size:14px;min-height:44px}
.btn-view-action:hover{border-color:var(--muted)}

/* ---- Ficha de empresa: sub-tabs Empresa / Lotes / Contacto ----
   Mismo patrón visual que .tabs/.tab de arriba, pero escalado para vivir
   dentro del modal (más chico, sin sticky, con scroll horizontal en mobile
   si hace falta). */
.emp-m2-hero{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--accent)}
.subtabs{display:flex;gap:16px;border-bottom:1px solid var(--border);margin:12px 0 14px;overflow-x:auto}
.subtab{background:none;border:none;color:var(--muted);font-weight:600;font-size:13px;padding:8px 2px;margin:0;border-bottom:2px solid transparent;white-space:nowrap;min-height:40px}
.subtab.active{color:var(--fg);border-bottom-color:var(--accent)}

/* ---- Ficha de empresa: lista de lotes/matrículas (una empresa puede tener
   muchas: ALIMENTOS SOFIA, E007, tiene 22) — por eso lista scrolleable con
   fila por matrícula, no campos sueltos que no escalan. */
.lot-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden;max-height:380px;overflow-y:auto}
/* Lotes: más espaciado que el resto de las listas de la ficha (pedido
   explícito del usuario 2026-10-13) — más padding por fila y más separación
   entre la línea de ubicación y la de propiedad/escritura. */
.lot-row{padding:16px 14px;border-bottom:1px solid var(--border);font-size:13px}
.lot-row:last-child{border-bottom:none}
.lot-row:nth-child(even){background:var(--surface-2)}
.lot-row-main{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lot-row-main a{color:inherit;text-decoration:none;font-weight:600}
.lot-row-main a:hover{color:var(--accent)}
.lot-m2{flex:0 0 auto;font-weight:600;font-variant-numeric:tabular-nums}
.lot-row-sub{display:flex;justify-content:space-between;gap:14px;font-size:12.5px;margin-top:10px}
/* Mismo criterio tipográfico que el resto de la ficha: título en negrita,
   contenido en gris. */
.lot-field-label{font-weight:700;color:var(--fg)}
.lot-field-value{color:var(--muted)}
/* ---- Ficha de empresa: sub-tab Empresa — etiqueta en negrita, dato en
   gris (al revés del .view-item de arriba), en el orden pedido:
   Representante, Cargo, Rubro, Actividad, CUIT. */
.info-list{display:flex;flex-direction:column}
.info-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.info-row:last-child{border-bottom:none}
.info-row dt{font-weight:700;color:var(--fg);flex-shrink:0;margin:0}
.info-row dd{margin:0;font-weight:400;color:var(--muted);text-align:right}

/* ---- Ficha de empresa: sub-tab Contacto — fila con ícono + label + valor.
   Íconos SVG inline, todos en el mismo gris neutro (pedido explícito del
   usuario: "sin tanto color, todo gris", sin un color por red social). */
.contact-list{display:flex;flex-direction:column;gap:2px}
.contact-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);color:inherit;text-decoration:none}
.contact-row:last-child{border-bottom:none}
.contact-row:hover .contact-value{color:var(--accent)}
.contact-icon{flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted)}
.contact-icon svg{width:18px;height:18px}
.contact-body{min-width:0;display:flex;flex-direction:column;gap:1px}
/* Mismo criterio tipográfico que el resto de la ficha: título en negrita,
   contenido en gris (pedido explícito del usuario 2026-10-13). */
.contact-label{font-size:12px;font-weight:700;color:var(--fg)}
.contact-value{font-size:13.5px;font-weight:400;color:var(--muted);overflow-wrap:anywhere}

/* ---- Dashboard ---- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:22px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
.kpi-card .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi-card .l{font-size:12px;color:var(--muted);margin-top:2px}
.dash-section{margin-bottom:22px}
.dash-section h3{font-size:13px;font-weight:700;margin-bottom:10px}
.barra-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.barra-label{flex:0 0 120px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra-track{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.barra-fill{height:100%;border-radius:4px}
.barra-val{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--muted)}

/* ---- Indicador de sincronización ---- */
.sync-status{font-size:11.5px;color:var(--muted);white-space:nowrap}
.sync-status.offline{color:var(--danger)}
</style>
</head>
<body>

<div class="sticky-top">
<a class="volver" href="/index.html">&larr; Inicio</a>

<div class="page-header">
  <div>
    <div class="eyebrow">EGPAIS · Parques · Güemes</div>
    <h1>Parques</h1>
  </div>
  <div class="page-header-actions">
    <span class="sync-status" id="syncStatus">☁️ Sincronizado</span>
    <button class="btn-theme" id="btnTheme" aria-label="Cambiar a modo oscuro">🌙</button>
    <button class="btn-new" id="btnNew">+ Nuevo lote</button>
  </div>
</div>

<div class="tabs" role="tablist" aria-label="Vistas">
  <button class="tab" id="tabEmpresas" role="tab" aria-selected="true" aria-controls="viewEmpresas">Empresas</button>
  <button class="tab" id="tabComercial" role="tab" aria-selected="false" aria-controls="viewComercial">Comercial</button>
  <button class="tab" id="tabDash" role="tab" aria-selected="false" aria-controls="viewDash">Análisis</button>
</div>
</div>

<!-- ===== VISTA EMPRESAS ===== -->
<!-- Lo operativo por lote (estado, filtros de manzana, etc.) vive dentro
     de la ficha de cada empresa, en su sub-tab Lotes — ya no hay una
     pestaña "Lotes" suelta a este nivel. -->
<section class="view" id="viewEmpresas" role="tabpanel" aria-labelledby="tabEmpresas">
  <div class="toolbar-card">
    <div class="toolbar-search">
      <input type="search" id="searchEmpresas" placeholder="Buscar por empresa, rubro o contacto…">
    </div>
    <div class="toolbar-filters">
      <!-- En pausa a nivel de negocio hasta que haya una definición de
           estados de empresa (ver CLAUDE.md) — el control ya está, sin
           lógica todavía. -->
      <select id="filterEstadoEmpresas"><option value="">Todos los estados</option></select>
    </div>
  </div>
  <div class="tarjeta-count" id="empresasCount"></div>
  <div class="lista" id="empresasList"></div>
</section>

<!-- ===== VISTA COMERCIAL: lotes sin empresa — disponibles para la venta
     (ex "LIBRE: ...") y los pendientes de revisión ===== -->
<section class="view" id="viewComercial" role="tabpanel" aria-labelledby="tabComercial" hidden>
  <div class="toolbar-card">
    <div class="toolbar-search">
      <input type="search" id="searchComercial" placeholder="Buscar por lote, manzana, parcela o matrícula…">
    </div>
    <div class="toolbar-filters">
      <select id="filterEstadoComercial"><option value="">Todos los estados</option></select>
      <select id="filterManzanaComercial"><option value="">Todas las manzanas</option></select>
      <label class="toolbar-check"><input type="checkbox" id="filterDisponibleComercial"> Solo disponibles para la venta</label>
    </div>
  </div>
  <div class="tarjeta-count" id="comercialCount"></div>
  <div class="lista" id="comercialList"></div>
</section>

<!-- ===== VISTA DASHBOARD ===== -->
<section class="view" id="viewDash" role="tabpanel" aria-labelledby="tabDash" hidden>
  <div class="kpi-grid" id="kpiGrid"></div>
  <div class="dash-section">
    <h3>Lotes por estado</h3>
    <div id="dashEstados"></div>
  </div>
  <div class="dash-section">
    <h3>Escrituración</h3>
    <div id="dashEscrituracion"></div>
  </div>
  <div class="dash-section">
    <h3>Empresas por superficie ocupada</h3>
    <div id="dashRankingEmpresas"></div>
  </div>
  <div class="dash-section">
    <h3>Por rubro</h3>
    <div id="dashRubros"></div>
  </div>
</section>

<div class="veil" id="veil" hidden><div class="modal" id="modal"></div></div>

<script>
(function(){
  "use strict";

  var ESTADOS = ["Activa","Sin actividad","Alquilada","En construcción"];
  function claseEstado(estado){
    var i = ESTADOS.indexOf(estado);
    var n = (i===-1 ? 4 : i) % 5 + 1;
    return "c"+n;
  }

  var ICON_EDIT = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"></path></svg>';
  var ICON_TRASH = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>';

  // Íconos de la pestaña Contacto — mismo trazo gris neutro para los
  // cinco, sin un color propio por red (pedido explícito del usuario).
  var ICON_MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 5L2 7"></path></svg>';
  var ICON_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"></path></svg>';
  var ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>';
  var ICON_WEB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"></path></svg>';
  var ICON_IG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle></svg>';
  var ICON_LINKEDIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6Z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>';

  var STORAGE_KEY = "parques_crm_v1";

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtM2(n){
    if(n==null || n==="") return "—";
    return Number(n).toLocaleString("es-AR")+" m²";
  }

  // Links reales para la pestaña Contacto de la ficha de empresa: el dato
  // llega tal como lo tipeó alguien ("www.algo.com.ar", "@usuario"), así
  // que para que el click navegue de verdad hay que completar el esquema,
  // no usar el valor crudo como href.
  function webHref(v){
    if(!v) return "";
    return /^https?:\/\//i.test(v) ? v : "https://"+v;
  }
  function instagramHref(v){
    if(!v) return "";
    if(/^https?:\/\//i.test(v)) return v;
    return "https://instagram.com/"+v.replace(/^@/,"");
  }
  function mailtoHref(v){ return "mailto:"+v; }
  function telHref(v){ return "tel:"+v.replace(/[^+\d]/g,""); }
  // Algunos registros de origen traen más de una URL pegada en "linkedin"
  // separadas por " | " (incluso una de Instagram colada ahí) — no se
  // corrige el dato (se muestra tal cual), pero el link navega a la
  // primera URL de la lista, no a las dos juntas como un href roto.
  function linkedinHref(v){
    if(!v) return "";
    return webHref(String(v).split("|")[0].trim());
  }

  // Iniciales para el avatar: no hay logos cargados. Toma la primera letra
  // de hasta 2 palabras significativas (ignora S.A./S.R.L./LTDA y artículos).
  var PALABRAS_IGNORADAS = /^(s\.?a\.?|s\.?r\.?l\.?|ltda\.?|de|del|la|el|los|las|y)$/i;
  function iniciales(nombre){
    var palabras = String(nombre||"").trim().split(/\s+/).filter(function(w){
      return w && !PALABRAS_IGNORADAS.test(w);
    });
    if(!palabras.length) return "—";
    if(palabras.length===1) return palabras[0].slice(0,2).toUpperCase();
    return (palabras[0].charAt(0)+palabras[1].charAt(0)).toUpperCase();
  }

  // Normaliza un nombre de empresa para detectar posibles duplicados: sin
  // acentos, sin razón social (S.A./S.R.L.), sin puntuación.
  function normEmpresa(s){
    return String(s||"")
      .toUpperCase()
      .normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/\b(S\.?\s?A\.?|S\.?\s?R\.?\s?L\.?|LTDA\.?)\b/g,"")
      .replace(/[^A-Z0-9 ]/g,"")
      .replace(/\s+/g," ")
      .trim();
  }
  function empresasSimilares(e){
    var n = normEmpresa(e.nombre_empresa);
    if(!n) return [];
    return state.empresas.filter(function(o){
      if(o.id_empresa===e.id_empresa) return false;
      var on = normEmpresa(o.nombre_empresa);
      return !!on && (on===n || on.indexOf(n+" ")===0 || n.indexOf(on+" ")===0);
    });
  }

  // Lotes con la misma matrícula pero distinto titular: no necesariamente un
  // error de carga (puede ser un caso que `ocupaciones` ya explica), pero
  // vale la pena marcarlo para revisar antes de asumir cualquier cosa.
  function lotesConMatriculaCompartida(lote){
    if(!lote.matricula) return [];
    return state.lotes.filter(function(o){
      return o.id_lote!==lote.id_lote && o.matricula && o.matricula===lote.matricula && o.id_empresa!==lote.id_empresa;
    });
  }

  // IDs nuevos siguen el esquema del dato real (E001, L001…) en vez de un
  // uid random, para no mezclar dos estilos de id en la misma colección.
  function siguienteId(lista, campo, prefijo){
    var max = 0;
    lista.forEach(function(x){
      var m = /^[A-Za-z]+(\d+)/.exec(x[campo]||"");
      if(m) max = Math.max(max, parseInt(m[1],10));
    });
    var n = max+1;
    return prefijo + String(n).padStart(3,"0");
  }

  function vacio(){ return { parque:"Güemes", empresas:[], lotes:[], ocupaciones:[], reservas:[] }; }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return vacio();
      var data = JSON.parse(raw);
      if(!data || typeof data!=="object") return vacio();
      return {
        parque: data.parque || "Güemes",
        empresas: Array.isArray(data.empresas) ? data.empresas : [],
        lotes: Array.isArray(data.lotes) ? data.lotes : [],
        ocupaciones: Array.isArray(data.ocupaciones) ? data.ocupaciones : [],
        reservas: Array.isArray(data.reservas) ? data.reservas : []
      };
    }catch(e){ return vacio(); }
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    marcarPendiente();
  }

  // ---- Sync: GitHub-como-base-de-datos detrás del Worker (/api/sync-parques) ----
  var SYNC_ENDPOINT = "/api/sync-parques";
  var SYNC_PENDING_KEY = "parques_crm_sync_pendiente_v1";
  var syncTimer = null, syncEnProgreso = false;

  function marcarPendiente(){
    try{ localStorage.setItem(SYNC_PENDING_KEY, "1"); }catch(e){}
    setSyncStatus("pendiente");
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(subirCambios, 100);
  }
  function haySyncPendiente(){
    try{ return localStorage.getItem(SYNC_PENDING_KEY) === "1"; }catch(e){ return false; }
  }
  function setSyncStatus(s){
    var el = document.getElementById("syncStatus");
    if(!el) return;
    var map = {
      sincronizado: ["☁️ Sincronizado", ""],
      cargando: ["⏳ Cargando…", ""],
      pendiente: ["⏳ Sincronizando…", ""],
      subiendo: ["⏳ Sincronizando…", ""],
      offline: ["⚠️ Sin conexión", "offline"]
    };
    var m = map[s] || map.sincronizado;
    el.textContent = m[0];
    el.className = "sync-status "+m[1];
  }

  // Lo que se publica en el repo son los DATOS, no el estado de la pantalla.
  // `state` mezcla las dos cosas (filtros, búsqueda, qué modal está abierto),
  // y mandarlo entero hacía que terminara commiteado en parques.json lo que
  // alguien tenía tipeado en el buscador. La bajada ya tomaba solo estos
  // campos (ver bajarCambiosIniciales) y load() también: faltaba la simetría
  // de este lado.
  function datosParaSync(){
    return {
      parque: state.parque,
      empresas: state.empresas,
      lotes: state.lotes,
      ocupaciones: state.ocupaciones,
      reservas: state.reservas
    };
  }

  async function subirCambios(){
    if(syncEnProgreso || !haySyncPendiente()) return;
    syncEnProgreso = true;
    setSyncStatus("subiendo");
    try{
      var resp = await fetch(SYNC_ENDPOINT, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(datosParaSync())
      });
      if(!resp.ok) throw new Error("POST falló: "+resp.status);
      try{ localStorage.removeItem(SYNC_PENDING_KEY); }catch(e){}
      setSyncStatus("sincronizado");
    }catch(e){
      setSyncStatus("offline");
    }
    syncEnProgreso = false;
    if(haySyncPendiente()) subirCambios();
  }

  async function bajarCambiosIniciales(){
    if(haySyncPendiente()){
      subirCambios(); // no pisar trabajo local sin subir
      return;
    }
    setSyncStatus("cargando");
    try{
      var resp = await fetch(SYNC_ENDPOINT);
      if(!resp.ok) throw new Error("GET falló: "+resp.status);
      var datos = await resp.json();
      if(datos && (Array.isArray(datos.lotes) || Array.isArray(datos.empresas))){
        state.parque = datos.parque || "Güemes";
        state.empresas = Array.isArray(datos.empresas) ? datos.empresas : [];
        state.lotes = Array.isArray(datos.lotes) ? datos.lotes : [];
        state.ocupaciones = Array.isArray(datos.ocupaciones) ? datos.ocupaciones : [];
        state.reservas = Array.isArray(datos.reservas) ? datos.reservas : [];
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
        renderFiltros();
        renderComercial();
        renderEmpresas();
      }
      setSyncStatus("sincronizado");
    }catch(e){
      setSyncStatus("offline");
    }
  }

  var inicial = load();
  var state = Object.assign({
    editingTipo:null, editingId:null, modalMode:null,
    filterEstadoComercial:"", filterManzanaComercial:"", filterDisponibleComercial:false,
    searchComercial:"", searchEmpresas:""
  }, inicial);

  function empresaPorId(id){ return state.empresas.find(function(e){return e.id_empresa===id;}); }
  function lotesDeEmpresa(id){ return state.lotes.filter(function(l){return l.id_empresa===id;}); }
  function empresaTotalM2(id){
    return lotesDeEmpresa(id).reduce(function(acc,l){ return acc + (Number(l.superficie_m2)||0); }, 0);
  }
  function ocupacionDeLote(idLote){ return state.ocupaciones.find(function(o){return o.id_lote===idLote && o.vigente;}); }
  function nombreEmpresa(id){ var e=empresaPorId(id); return e ? e.nombre_empresa : null; }

  // ---- Filtros ----
  // "Comercial" = lotes sin empresa (disponibles para la venta + los pocos
  // pendientes de revisión); los filtros de estado/manzana se calculan solo
  // sobre ese universo, no sobre los 138 lotes totales.
  function lotesSinEmpresa(){ return state.lotes.filter(function(l){ return !l.id_empresa; }); }

  var selEstadoComercial = document.getElementById("filterEstadoComercial");
  var selManzanaComercial = document.getElementById("filterManzanaComercial");
  var chkDisponibleComercial = document.getElementById("filterDisponibleComercial");
  function renderFiltros(){
    var estadoActual = selEstadoComercial.value, manzanaActual = selManzanaComercial.value;
    var universo = lotesSinEmpresa();
    var estados = Array.from(new Set(universo.map(function(l){return l.estado;}).filter(Boolean)));
    selEstadoComercial.innerHTML = '<option value="">Todos los estados</option>'+
      estados.map(function(e){ return '<option value="'+esc(e)+'">'+esc(e)+'</option>'; }).join("");
    var manzanas = Array.from(new Set(universo.map(function(l){return l.manzana;}).filter(Boolean)))
      .sort(function(a,b){ return Number(a)-Number(b) || String(a).localeCompare(String(b)); });
    selManzanaComercial.innerHTML = '<option value="">Todas las manzanas</option>'+
      manzanas.map(function(m){ return '<option value="'+esc(m)+'">Manzana '+esc(m)+'</option>'; }).join("");
    selEstadoComercial.value = estadoActual; selManzanaComercial.value = manzanaActual;
  }
  selEstadoComercial.addEventListener("change", function(){ state.filterEstadoComercial=this.value; renderComercial(); });
  selManzanaComercial.addEventListener("change", function(){ state.filterManzanaComercial=this.value; renderComercial(); });
  chkDisponibleComercial.addEventListener("change", function(){ state.filterDisponibleComercial=this.checked; renderComercial(); });
  document.getElementById("searchComercial").addEventListener("input", function(){ state.searchComercial=this.value.toLowerCase(); renderComercial(); });
  document.getElementById("searchEmpresas").addEventListener("input", function(){ state.searchEmpresas=this.value.toLowerCase(); renderEmpresas(); });

  function comercialFiltrados(){
    return lotesSinEmpresa().filter(function(l){
      if(state.filterEstadoComercial && l.estado!==state.filterEstadoComercial) return false;
      if(state.filterManzanaComercial && l.manzana!==state.filterManzanaComercial) return false;
      if(state.filterDisponibleComercial && !l.disponible) return false;
      if(state.searchComercial){
        var blob = [l.id_lote,l.manzana,l.parcela,l.matricula].join(" ").toLowerCase();
        if(blob.indexOf(state.searchComercial)===-1) return false;
      }
      return true;
    });
  }
  function empresasFiltradas(){
    return state.empresas.filter(function(e){
      if(state.searchEmpresas){
        var blob = [e.nombre_empresa,e.rubro,e.actividad,e.contacto_nombre].join(" ").toLowerCase();
        if(blob.indexOf(state.searchEmpresas)===-1) return false;
      }
      return true;
    });
  }

  // ---- Listado: Comercial (lotes sin empresa) ----
  function renderComercial(){
    var cont = document.getElementById("comercialList");
    var cuenta = document.getElementById("comercialCount");
    var filtrados = comercialFiltrados().slice().sort(function(a,b){
      return (Number(a.manzana)||0)-(Number(b.manzana)||0) || String(a.id_lote).localeCompare(String(b.id_lote));
    });
    var total = lotesSinEmpresa().length;
    cuenta.textContent = !total ? ""
      : (filtrados.length===total ? total+" lotes" : filtrados.length+" de "+total+" lotes");
    // Contador en el chip de la pestaña (no en "Análisis": no es un listado,
    // no tiene una cantidad de ítems que mostrar).
    tabComercial.innerHTML = 'Comercial <span class="count">'+total+'</span>';
    if(!filtrados.length){
      cont.innerHTML = '<div class="empty-state">'+
        (total ? 'Sin lotes que coincidan con el filtro.' : 'No hay lotes sin empresa asignada.')+
        '</div>';
      return;
    }
    cont.innerHTML = filtrados.map(function(l){
      var sub = "Mz "+esc(l.manzana||"—")+" · Parcela "+esc(l.parcela||"—")+" · "+fmtM2(l.superficie_m2);
      var nombre = l.disponible ? "Disponible para la venta" : "Libre / pendiente de revisión";
      return '<button class="tarjeta" data-open-lote="'+esc(l.id_lote)+'">'+
        '<div class="tarjeta-main">'+
          '<div class="tarjeta-title">'+esc(l.id_lote)+' · '+esc(nombre)+'</div>'+
          '<div class="tarjeta-sub">'+sub+'</div>'+
        '</div>'+
        '<div class="tarjeta-aside">'+
          (l.estado?'<span class="badge" style="background:var(--'+claseEstado(l.estado)+'-bg);color:var(--'+claseEstado(l.estado)+')">'+esc(l.estado)+'</span>':'')+
          (l.disponible?'<span class="badge" style="background:var(--c2-bg);color:var(--c2)">en venta</span>':'')+
        '</div>'+
        '</button>';
    }).join("");
    cont.querySelectorAll("[data-open-lote]").forEach(function(btn){
      btn.addEventListener("click", function(){ openModal("lote", btn.getAttribute("data-open-lote")); });
    });
  }

  // ---- Listado: Empresas ----
  function renderEmpresas(){
    var cont = document.getElementById("empresasList");
    var cuenta = document.getElementById("empresasCount");
    var filtradas = empresasFiltradas().slice().sort(function(a,b){
      return String(a.nombre_empresa||"").localeCompare(String(b.nombre_empresa||""));
    });
    var total = state.empresas.length;
    cuenta.textContent = !total ? ""
      : (filtradas.length===total ? total+" empresas" : filtradas.length+" de "+total+" empresas");
    // Contador en el chip de la pestaña (no en "Análisis": no es un listado,
    // no tiene una cantidad de ítems que mostrar).
    tabEmpresas.innerHTML = 'Empresas <span class="count">'+total+'</span>';
    if(!filtradas.length){
      cont.innerHTML = '<div class="empty-state">'+
        (total ? 'Sin empresas que coincidan con el filtro.' : 'Todavía no hay empresas cargadas.')+
        '</div>';
      return;
    }
    cont.innerHTML = filtradas.map(function(e){
      var totalM2 = empresaTotalM2(e.id_empresa);
      var sub = [e.rubro, e.contacto_nombre].filter(Boolean).join(" · ");
      return '<button class="tarjeta" data-open-empresa="'+esc(e.id_empresa)+'">'+
        '<div class="tarjeta-row">'+
          '<div class="avatar">'+esc(iniciales(e.nombre_empresa))+'</div>'+
          '<div class="tarjeta-main">'+
            '<div class="tarjeta-title">'+esc(e.nombre_empresa)+'</div>'+
            '<div class="tarjeta-sub emp-m2-hero">'+fmtM2(totalM2)+' totales</div>'+
            (sub?'<div class="tarjeta-sub">'+esc(sub)+'</div>':'')+
          '</div>'+
        '</div>'+
        '</button>';
    }).join("");
    cont.querySelectorAll("[data-open-empresa]").forEach(function(btn){
      btn.addEventListener("click", function(){ openModal("empresa", btn.getAttribute("data-open-empresa")); });
    });
  }

  // ---- Modal ----
  var veil = document.getElementById("veil"), modal = document.getElementById("modal");
  document.getElementById("btnNew").addEventListener("click", function(){ openModal("lote", null); });
  veil.addEventListener("click", function(ev){ if(ev.target===veil) closeModal(); });

  function openModal(tipo, id){
    state.editingTipo = tipo;
    state.editingId = id;
    state.modalMode = id ? "view" : "edit";
    if(tipo==="empresa") state.empresaSubTab = "empresa";
    veil.hidden = false;
    renderModal();
  }
  function closeModal(){ veil.hidden = true; state.editingTipo=null; state.editingId = null; state.modalMode = null; }

  function renderModal(){
    if(state.editingTipo==="empresa"){
      var emp = state.editingId ? empresaPorId(state.editingId) : null;
      if(!emp || state.modalMode==="edit") renderEmpresaEdit(emp);
      else renderEmpresaView(emp);
    } else {
      var lote = state.editingId ? state.lotes.find(function(x){return x.id_lote===state.editingId;}) : null;
      if(!lote || state.modalMode==="edit") renderLoteEdit(lote);
      else renderLoteView(lote);
    }
  }

  function viewItem(label, html){
    return '<div class="view-item"><label>'+esc(label)+'</label><div class="v">'+(html || '<span class="view-empty">—</span>')+'</div></div>';
  }

  // Fila título-en-negrita/dato-en-gris para la pestaña Empresa de la
  // ficha (al revés de viewItem, que usa label chico arriba y valor en
  // negrita abajo) — pedido explícito del usuario 2026-10-13.
  function infoRow(label, valor){
    return '<div class="info-row"><dt>'+esc(label)+'</dt><dd>'+(valor?esc(valor):'<span class="view-empty">—</span>')+'</dd></div>';
  }

  // Fila ícono + label + valor para la pestaña Contacto. Si hay href, toda
  // la fila es un <a> real (mailto:/tel:/https:) — si no hay dato, la fila
  // ni se dibuja (nada que mostrar ni a dónde ir).
  function contactRow(icon, label, valor, href, targetBlank){
    if(!valor) return "";
    var tag = href ? 'a href="'+esc(href)+'"'+(targetBlank?' target="_blank" rel="noopener"':'') : 'div';
    var cierre = href ? 'a' : 'div';
    return '<'+tag+' class="contact-row">'+
      '<span class="contact-icon" aria-hidden="true">'+icon+'</span>'+
      '<div class="contact-body"><span class="contact-label">'+esc(label)+'</span>'+
      '<span class="contact-value">'+esc(valor)+'</span></div>'+
      '</'+cierre+'>';
  }

  // ---- Ficha de lote ----
  function renderLoteView(l){
    var titular = empresaPorId(l.id_empresa);
    var ocup = ocupacionDeLote(l.id_lote);
    var ocupante = ocup ? empresaPorId(ocup.id_empresa_ocupante) : null;

  // Tres sub-tabs (Empresa / Lotes / Contacto) en vez de un solo scroll
  // largo: una empresa como ALIMENTOS SOFIA (E007) tiene 22 matrículas, y
  // meter eso junto con actividad, contacto y web en una sola vista vuelve
  // difícil encontrar un dato puntual. Mismo patrón que el mockup acordado
  // con el usuario (2026-10-13).
  function tituloYTitularDeLote(l, empresa){
    // "A nombre de quién está la propiedad": o es de EGPAIS (ente), o ya
    // está escriturada a la empresa. `escritura` viene del origen con
    // mayúsculas/espacios inconsistentes ("Si","si","No","no ","NO") y a
    // veces null — un null no se asume "No": sería inventar un dato que el
    // origen no tiene (ver nota de L048 en CLAUDE.md). Sin color (pedido
    // del usuario 2026-10-13): acá solo se devuelve el texto.
    var e = String(l.escritura||"").trim();
    if(!e) return { siNo:"Sin dato", propiedad: l.propietario_matricula || "—" };
    if(/^s/i.test(e)) return { siNo:"Sí", propiedad: l.propietario_matricula || (empresa&&empresa.nombre_empresa) || "—" };
    return { siNo:"No", propiedad:"EGPAIS (Ente General de Parques y Áreas Industriales de Salta)" };
  }

  function renderDashboard(){
    var lotes = state.lotes;
    var totalSup = lotes.reduce(function(s,l){ return s + (Number(l.superficie_m2)||0); }, 0);
    var disponibles = lotes.filter(function(l){return l.disponible;});
    var supDisponible = disponibles.reduce(function(s,l){ return s + (Number(l.superficie_m2)||0); }, 0);

    document.getElementById("kpiGrid").innerHTML = [
      ["Lotes", lotes.length],
      ["Empresas", state.empresas.length],
      ["Superficie total", fmtM2(totalSup)],
      ["Disponibles", disponibles.length+" ("+fmtM2(supDisponible)+")"],
      ["Sublocados", state.ocupaciones.filter(function(o){return o.vigente;}).length]
    ].map(function(kv){
      return '<div class="kpi-card"><div class="n">'+kv[1]+'</div><div class="l">'+esc(kv[0])+'</div></div>';
    }).join("");

    renderBarras("dashEstados", lotesPorEstado(lotes), function(k){
      return k==="Sin dato" ? "var(--muted)" : "var(--"+claseEstado(k)+")";
    });

    renderBarras("dashEscrituracion", lotesPorEscritura(lotes), function(k){
      return k==="Escriturada" ? "var(--c2)" : k==="No escriturada" ? "var(--warn)" : "var(--muted)";
    });

    var ranking = state.empresas.map(function(e){
      var sup = lotesDeEmpresa(e.id_empresa).reduce(function(s,l){ return s+(Number(l.superficie_m2)||0); }, 0);
      return { label: e.nombre_empresa, n: sup };
    }).filter(function(r){ return r.n>0; }).sort(function(a,b){ return b.n-a.n; }).slice(0,8);
    renderBarras("dashRankingEmpresas", ranking, function(){ return "var(--c1)"; }, fmtM2);

    var porRubro = {};
    state.empresas.forEach(function(e){ var k=e.rubro||"Sin rubro"; porRubro[k]=(porRubro[k]||0)+1; });
    renderBarras("dashRubros", Object.keys(porRubro).map(function(k){ return {label:k, n:porRubro[k]}; }), function(k){
      return k==="Sin rubro" ? "var(--muted)" : "var(--c4)";
    });
  }

  // {label,n} -> fila con barra proporcional al máximo del propio grupo.
  // fmt formatea el valor mostrado (por defecto el número tal cual); color
  // recibe la etiqueta y devuelve el color de la barra.
  function lotesPorEstado(lotes){
    var porEstado = {};
    lotes.forEach(function(l){ var k=l.estado||"Sin dato"; porEstado[k]=(porEstado[k]||0)+1; });
    return Object.keys(porEstado).map(function(k){ return {label:k, n:porEstado[k]}; });
  }
  function claseEscritura(v){
    var s = String(v||"").trim().toLowerCase();
    if(!s) return "Sin dato";
    if(s.charAt(0)==="s") return "Escriturada";
    if(s.charAt(0)==="n") return "No escriturada";
    return "Sin dato";
  }
  function lotesPorEscritura(lotes){
    var porEsc = {};
    lotes.forEach(function(l){ var k=claseEscritura(l.escritura); porEsc[k]=(porEsc[k]||0)+1; });
    return Object.keys(porEsc).map(function(k){ return {label:k, n:porEsc[k]}; });
  }
  function renderBarras(elId, filas, colorFn, fmtFn){
    filas = filas.slice().sort(function(a,b){ return b.n-a.n; });
    var max = Math.max.apply(null, filas.map(function(f){return f.n;}).concat([1]));
    document.getElementById(elId).innerHTML = filas.length ? filas.map(function(f){
      return '<div class="barra-row"><div class="barra-label">'+esc(f.label)+'</div>'+
        '<div class="barra-track"><div class="barra-fill" style="width:'+Math.round(f.n/max*100)+'%;background:'+colorFn(f.label)+'"></div></div>'+
        '<div class="barra-val">'+esc(fmtFn ? fmtFn(f.n) : f.n)+'</div></div>';
    }).join("") : '<div class="view-empty">Sin datos.</div>';
  }

  // ---- Tabs / routing ----
  // Default = Empresas (ya no hay una pestaña "Lotes" suelta).
  var tabEmpresas = document.getElementById("tabEmpresas"), tabComercial = document.getElementById("tabComercial"), tabDash = document.getElementById("tabDash");
  var viewEmpresas = document.getElementById("viewEmpresas"), viewComercial = document.getElementById("viewComercial"), viewDash = document.getElementById("viewDash");
  function showView(name, desdeHash){
    var isComercial = name==="comercial", isDash = name==="dashboard";
    var isEmpresas = !isComercial && !isDash;
    viewEmpresas.hidden = !isEmpresas;
    viewComercial.hidden = !isComercial;
    viewDash.hidden = !isDash;
    tabEmpresas.classList.toggle("active", isEmpresas);
    tabComercial.classList.toggle("active", isComercial);
    tabDash.classList.toggle("active", isDash);
    tabEmpresas.setAttribute("aria-selected", String(isEmpresas));
    tabComercial.setAttribute("aria-selected", String(isComercial));
    tabDash.setAttribute("aria-selected", String(isDash));
    if(isDash) renderDashboard();
    if(desdeHash) return;
    var destino = isComercial ? "#comercial" : isDash ? "#dashboard" : "#empresas";
    if(location.hash !== destino) location.hash = destino;
  }
  tabEmpresas.addEventListener("click", function(){ showView("empresas"); });
  tabComercial.addEventListener("click", function(){ showView("comercial"); });
  tabDash.addEventListener("click", function(){ showView("dashboard"); });
  window.addEventListener("hashchange", function(){
    var h = location.hash;
    showView(h==="#comercial" ? "comercial" : h==="#dashboard" ? "dashboard" : "empresas", true);
  });

  // ---- Tema claro/oscuro ----
  var THEME_KEY = "parques_crm_theme_v1";
  var btnTheme = document.getElementById("btnTheme");
  function applyThemeButton(){
    var dark = document.documentElement.getAttribute("data-theme")==="dark";
    btnTheme.textContent = dark ? "☀️" : "🌙";
    btnTheme.setAttribute("aria-label", dark ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
  }
  btnTheme.addEventListener("click", function(){
    var dark = document.documentElement.getAttribute("data-theme")==="dark";
    if(dark){ document.documentElement.removeAttribute("data-theme"); localStorage.setItem(THEME_KEY,"light"); }
    else { document.documentElement.setAttribute("data-theme","dark"); localStorage.setItem(THEME_KEY,"dark"); }
    applyThemeButton();
  });
  applyThemeButton();

  renderFiltros();
  renderComercial();
  renderEmpresas();
  showView(location.hash==="#comercial" ? "comercial" : location.hash==="#dashboard" ? "dashboard" : "empresas", true);
  bajarCambiosIniciales();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>

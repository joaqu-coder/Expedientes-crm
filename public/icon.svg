<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Fondo blanco -->
  <rect width="192" height="192" fill="white"/>

  <!-- Engranaje EGPAIS - 8 dientes -->
  <g transform="translate(96, 80)">
    <!-- Diente arriba -->
    <path d="M -12 -45 L 12 -45 L 8 -20 L -8 -20 Z" fill="#5a8a8a"/>

    <!-- Diente arriba-derecha (45°) -->
    <path d="M 30 -30 L 40 -40 L 22 -22 L 12 -12 Z" fill="#5a8a8a"/>

    <!-- Diente derecha -->
    <path d="M 45 -12 L 45 12 L 20 8 L 20 -8 Z" fill="#5a8a8a"/>

    <!-- Diente abajo-derecha (45°) -->
    <path d="M 30 30 L 40 40 L 22 22 L 12 12 Z" fill="#5a8a8a"/>

    <!-- Diente abajo -->
    <path d="M -12 45 L 12 45 L 8 20 L -8 20 Z" fill="#5a8a8a"/>

    <!-- Diente abajo-izquierda (45°) -->
    <path d="M -30 30 L -40 40 L -22 22 L -12 12 Z" fill="#5a8a8a"/>

    <!-- Diente izquierda -->
    <path d="M -45 -12 L -45 12 L -20 8 L -20 -8 Z" fill="#5a8a8a"/>

    <!-- Diente arriba-izquierda (45°) -->
    <path d="M -30 -30 L -40 -40 L -22 -22 L -12 -12 Z" fill="#5a8a8a"/>

    <!-- Centro del engranaje - círculo -->
    <circle cx="0" cy="0" r="18" fill="white" stroke="#5a8a8a" stroke-width="2"/>

    <!-- Símbolo interior: pequeña fábrica/industria -->
    <!-- Línea 1 (vertical izquierda) -->
    <line x1="-6" y1="-8" x2="-6" y2="4" stroke="#5a8a8a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Línea 2 (vertical centro) -->
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#5a8a8a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Línea 3 (vertical derecha) -->
    <line x1="6" y1="-8" x2="6" y2="4" stroke="#5a8a8a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Zigzag/tejado (triángulo arriba) -->
    <path d="M -8 -10 L -3 -14 L 2 -10 L 7 -14 L 8 -10" fill="none" stroke="#5a8a8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

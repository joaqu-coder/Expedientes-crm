  <script src="/header.js"></script>
  <script>
    // ===== CONFIGURACIÓN =====
    // Iconos de las acciones de la tarjeta expandida (mismo trazo que Proyectos).

    const AREAS_DEFAULT = [
      "Jurídica",
      "Administración",
      "Operación",
      "Obras",
      "Promoción Industrial",
      "Intervención"
    ];

    const RESPONSABLES_DEFAULT = [
      "María García",
      "Juan López",
      "Carlos Rodríguez",
      "Ana Martínez",
      "Roberto Fernández",
      "Laura Sánchez",
      "Diego Fernández",
      "Patricia González"
    ];

    let AREAS = [...AREAS_DEFAULT];
    let RESPONSABLES = [...RESPONSABLES_DEFAULT];

    const PARQUES_DEFAULT = [
      "Parque Salta",
      "Güemes",
      "Rosario",
      "Mosconi",
      "Pichanal",
      "San Antonio",
      "Egpais"
    ];

    let PARQUES = [...PARQUES_DEFAULT];

    // Feriados argentinos 2024-2028. Viernes Santo y Carnaval salen de Pascua; los
    // trasladables (17/6, 17/8, 12/10, 20/11) siguen la Ley 27.399: martes o miércoles
    // pasan al lunes anterior, jueves o viernes al lunes siguiente. Los decretos que
    // agregan puentes turísticos o mueven un feriado por su cuenta NO están: hay que
    // sumarlos a mano cuando salen (pendiente de confirmar con el usuario, ver CLAUDE.md).
    // tests/ui.test.mjs recalcula Pascua y las reglas y falla si esta tabla se desvía.
    const FERIADOS = [
      "2024-01-01", "2024-02-12", "2024-02-13", "2024-03-24", "2024-03-29",
      "2024-04-02", "2024-05-01", "2024-05-25", "2024-06-17", "2024-06-20",
      "2024-07-09", "2024-07-25", "2024-08-17", "2024-10-12", "2024-11-18",
      "2024-12-08", "2024-12-25",
      "2025-01-01", "2025-03-03", "2025-03-04", "2025-03-24", "2025-04-02",
      "2025-04-18", "2025-05-01", "2025-05-25", "2025-06-16", "2025-06-20",
      "2025-07-09", "2025-07-25", "2025-08-17", "2025-10-12", "2025-11-24",
      "2025-12-08", "2025-12-25",
      "2026-01-01", "2026-02-16", "2026-02-17", "2026-03-24", "2026-04-02",
      "2026-04-03", "2026-05-01", "2026-05-25", "2026-06-15", "2026-06-20",
      "2026-07-09", "2026-07-25", "2026-08-17", "2026-10-12", "2026-11-23",
      "2026-12-08", "2026-12-25",
      "2027-01-01", "2027-02-08", "2027-02-09", "2027-03-24", "2027-03-26",
      "2027-04-02", "2027-05-01", "2027-05-25", "2027-06-20", "2027-06-21",
      "2027-07-09", "2027-07-25", "2027-08-16", "2027-10-11", "2027-11-20",
      "2027-12-08", "2027-12-25",
      "2028-01-01", "2028-02-28", "2028-02-29", "2028-03-24", "2028-04-02",
      "2028-04-14", "2028-05-01", "2028-05-25", "2028-06-17", "2028-06-20",
      "2028-07-09", "2028-07-25", "2028-08-21", "2028-10-16", "2028-11-20",
      "2028-12-08", "2028-12-25"
    ];

    // Tope del plazo en días hábiles (~4 años). Sin tope, un typo (3000000) hace que
    // calcularFechaFin recorra millones de días en cada render y la app queda colgada
    // en todos los dispositivos, porque el dato se sincroniza.
    const PLAZO_MAX_DIAS = 999;

    // ===== ESTADO =====
    let expedientes = [];
    let editandoId = null;
    let filtroArea = null;
    let pestanaActiva = 'activos';
    let busqueda = '';

    // Escapa texto para meterlo en innerHTML o en un atributo entre comillas.
    // Los datos vienen de un JSON compartido, así que nunca se interpolan crudos.
    function esc(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    // ===== MODALES: foco, Escape y trampa de Tab =====
    const OVERLAYS = ['alertOverlay', 'configOverlay', 'modalOverlay']; // del más al menos prioritario
    const focoPrevio = {};

    function overlayAbierto(id) {
      return getComputedStyle(document.getElementById(id)).display !== 'none';
    }

    function abrirOverlay(id, selectorFoco) {
      const overlay = document.getElementById(id);
      if (!overlayAbierto(id)) focoPrevio[id] = document.activeElement;
      if (id === 'alertOverlay') overlay.style.display = 'flex';
      else overlay.classList.add('active');

      const dialogo = overlay.querySelector('[role="dialog"], [role="alertdialog"]');
      dialogo.setAttribute('tabindex', '-1');
      // En pantallas táctiles enfocar un campo abre el teclado de golpe: se enfoca el diálogo.
      const objetivo = !matchMedia('(pointer: coarse)').matches && selectorFoco && overlay.querySelector(selectorFoco);
      (objetivo || dialogo).focus();
    }

    function cerrarOverlay(id) {
      const overlay = document.getElementById(id);
      if (id === 'alertOverlay') overlay.style.display = 'none';
      else overlay.classList.remove('active');

      // Devuelve el foco a donde estaba. Si ese elemento se redibujó (la lista se
      // renderiza de nuevo al guardar), lo busca por id de expediente.
      let previo = focoPrevio[id];
      delete focoPrevio[id];
      if (previo && !previo.isConnected && previo.dataset?.id) {
        previo = document.querySelector(`.expediente-card-new[data-id="${CSS.escape(previo.dataset.id)}"] .expediente-header-urgencia`);
      }
      if (previo && previo.isConnected && typeof previo.focus === 'function') previo.focus();
    }

    function cerrarSuperior() {
      const id = OVERLAYS.find(overlayAbierto);
      if (id === 'alertOverlay') cerrarAlert();
      else if (id === 'configOverlay') cerrarConfigModal();
      else if (id === 'modalOverlay') cerrarModal();
    }

    const SELECTOR_FOCO = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

    document.addEventListener('keydown', (e) => {
      const id = OVERLAYS.find(overlayAbierto);
      if (!id) return;

      if (e.key === 'Escape') {
        e.preventDefault();
        cerrarSuperior();
        return;
      }

      if (e.key === 'Tab') {
        const dialogo = document.getElementById(id).querySelector('[role="dialog"], [role="alertdialog"]');
        const foco = [...dialogo.querySelectorAll(SELECTOR_FOCO)].filter(el => el.getClientRects().length);
        if (!foco.length) { e.preventDefault(); return; }
        const primero = foco[0];
        const ultimo = foco[foco.length - 1];
        if (!dialogo.contains(document.activeElement)) {
          e.preventDefault();
          primero.focus();
        } else if (e.shiftKey && (document.activeElement === primero || document.activeElement === dialogo)) {
          e.preventDefault();
          ultimo.focus();
        } else if (!e.shiftKey && document.activeElement === ultimo) {
          e.preventDefault();
          primero.focus();
        }
      }
    });

    // ===== TOAST (con Deshacer) =====
    let toastTimer = null;
    let toastAccionActual = null;

    function ocultarToast() {
      clearTimeout(toastTimer);
      toastTimer = null;
      toastAccionActual = null;
      document.getElementById('toast').hidden = true;
    }

    function mostrarToast(mensaje, { etiqueta = 'Deshacer', accion = null, duracion = 6000 } = {}) {
      clearTimeout(toastTimer);
      toastAccionActual = accion;
      document.getElementById('toastMensaje').textContent = mensaje;
      const btn = document.getElementById('toastAccion');
      btn.textContent = etiqueta;
      btn.hidden = !accion;
      document.getElementById('toast').hidden = false;
      toastTimer = setTimeout(ocultarToast, duracion);
    }

    // ===== ALERTAS ELEGANTES =====
    function mostrarAlerta(titulo, mensaje) {
      document.getElementById('alertTitle').textContent = titulo;
      document.getElementById('alertMessage').textContent = mensaje;
      abrirOverlay('alertOverlay', '#alertBtn');
      document.getElementById('alertBtn').focus(); // en táctil también: es un solo botón, no abre teclado
    }

    function cerrarAlert() {
      cerrarOverlay('alertOverlay');
    }

    // ===== VALIDACIÓN EN TIEMPO REAL =====
    function validarNumeroExpediente(valor) {
      // Patrón: XXX-XXXXX/YYYY-ZZ (sin paréntesis)
      // Mesa (3 dígitos) - Número (1-6 dígitos) / Año (4 dígitos) - Sufijo (1-2 dígitos)
      // Ejemplos: 363-1254/2025-01, 363-125477/2026-0
      const patron = /^\d{3}\s*[-–—]\s*\d{1,6}\/\d{4}\s*[-–—]\s*\d{1,2}$/;
      return patron.test(valor);
    }

    // Deja solo dígitos, espacios, barra y guión (sin espacios al inicio), y unifica guiones medio/largo a normal.
    // Se filtra sobre el evento input (no keydown) para no bloquear Ctrl+V/Ctrl+C, el
    // teclado virtual de Android ni Backspace, y para limpiar lo que se pega desde Word/PDF.
    function sanitizarNumero(texto) {
      return texto.replace(/[–—]/g, '-').replace(/[^0-9\s\/-]/g, '').replace(/^\s+/, '');
    }

    function actualizarValidacionNumero(input) {
      const original = input.value;
      const limpio = sanitizarNumero(original);

      if (limpio !== original) {
        const pos = sanitizarNumero(original.slice(0, input.selectionStart ?? original.length)).length;
        input.value = limpio;
        input.setSelectionRange(pos, pos);
      }

      const valor = limpio.trim();
      input.classList.remove('invalid', 'valid');
      if (valor.length === 0) return; // Sin color si está vacío

      input.classList.add(validarNumeroExpediente(valor) ? 'valid' : 'invalid');
    }

    // ===== FUNCIONES DE CÁLCULO =====
    // Las fechas 'YYYY-MM-DD' se manejan SIEMPRE como fecha local. new Date('2026-10-02')
    // se interpreta como UTC y en Argentina (UTC-3) cae el día anterior, lo que corría
    // el fin de semana un día y daba plazos mal calculados.
    function parsearFecha(str) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(str || '');
      return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(str);
    }

    function fechaISO(fecha) {
      const y = fecha.getFullYear();
      const m = String(fecha.getMonth() + 1).padStart(2, '0');
      const d = String(fecha.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function esFinDeSemana(fecha) {
      const day = fecha.getDay();
      return day === 0 || day === 6;
    }

    function esFeriado(fecha) {
      return FERIADOS.includes(fechaISO(fecha));
    }

    function esHabil(fecha) {
      return !esFinDeSemana(fecha) && !esFeriado(fecha);
    }

    function calcularFechaFin(fechaInicio, diasPlazo) {
      let fecha = parsearFecha(fechaInicio);
      let diasContados = 0;
      diasPlazo = Math.min(diasPlazo, PLAZO_MAX_DIAS); // un dato viejo o ajeno sin tope no cuelga el render

      while (diasContados < diasPlazo) {
        fecha.setDate(fecha.getDate() + 1);
        if (esHabil(fecha)) diasContados++;
      }

      return fecha;
    }

    function hoyLocal() {
      const h = new Date();
      h.setHours(0, 0, 0, 0);
      return h;
    }

    // Días hábiles en el intervalo (desde, hasta].
    function diasHabilesEntre(desde, hasta) {
      let n = 0;
      const f = new Date(desde);
      while (f < hasta) {
        f.setDate(f.getDate() + 1);
        if (esHabil(f)) n++;
      }
      return n;
    }

    // Estado del plazo de un expediente. Distingue "vence hoy" de "vencido", que antes
    // se confundían (ambos daban 0 días).
    function calcularPlazo(fechaInicio, diasPlazo, hoy = hoyLocal()) {
      const fechaFin = calcularFechaFin(fechaInicio, diasPlazo);
      const vencido = fechaFin < hoy;
      return {
        fechaFin,
        vencido,
        venceHoy: fechaFin.getTime() === hoy.getTime(),
        diasRestantes: vencido ? 0 : diasHabilesEntre(hoy, fechaFin),
        diasVencido: vencido ? diasHabilesEntre(fechaFin, hoy) : 0
      };
    }

    function obtenerSemaforo(plazo) {
      if (plazo.vencido || plazo.venceHoy) return { color: "rojo", orden: 0 };
      if (plazo.diasRestantes <= 5) return { color: "naranja", orden: 1 };
      if (plazo.diasRestantes <= 15) return { color: "amarillo", orden: 2 };
      return { color: "verde", orden: 3 };
    }

    function textoPlazo(plazo) {
      if (plazo.vencido) {
        return plazo.diasVencido > 0 ? `Vencido hace ${plazo.diasVencido} d háb.` : 'Vencido';
      }
      if (plazo.venceHoy) return 'Vence hoy';
      return `${plazo.diasRestantes} d háb.`;
    }

    function formatearFechaCorta(fecha) {
      return fecha.toLocaleDateString('es-AR', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' })
        .replace(',', '');
    }

    // ===== SYNC (vía Worker propio, sin exponer token) =====
    let sincronizando = false;
    let ultimoSyncOk = null; // true/false/null (null = todavía no se intentó)

    // El estado de sincronización ya no ocupa un lugar fijo en el header:
    // cuando todo anda bien vive en el menú ⋮, y solo sale a la vista si falló,
    // que es cuando el dato le sirve a alguien (hay cambios sin subir).
    function actualizarIndicadorSync(estado) {
      ultimoSyncOk = estado;
      if (!window.HeaderGlobal) return;
      if (estado === true) {
        HeaderGlobal.setSync('Al día', 'ok', reintentarSync);
      } else if (estado === 'rechazado') {
        HeaderGlobal.setSync(
          'El servidor rechazó los datos. Tus cambios están guardados en este dispositivo, pero no se van a subir hasta que esto se corrija. Tocá para reintentar.',
          'error', reintentarSync);
      } else if (estado === false) {
        HeaderGlobal.setSync(
          'Sin conexión. Tus cambios están guardados en este dispositivo y se suben solos al volver la señal. Tocá para reintentar.',
          'error', reintentarSync);
      } else {
        HeaderGlobal.setSync('Sincronizando…', 'ok', reintentarSync);
      }
    }

    // ----- Base y fusión (concurrencia optimista, como Proyectos y Parques) -----
    // Cada dispositivo guarda el sha y el contenido que el servidor tenía la última
    // vez que lo leyó: la "base". Con ella se sabe qué cambió de cada lado,
    // expediente por expediente, y lo que hizo otro dispositivo no se pisa.
    const LS_BASE = 'expedientes_crm_base_v1';
    let syncBase = cargarBase();

    function cargarBase() {
      try {
        const v = JSON.parse(localStorage.getItem(LS_BASE));
        if (v && typeof v.sha === 'string' && v.datos && typeof v.datos === 'object') return v;
      } catch (e) { /* sin base: se trae primero */ }
      return { sha: null, datos: null };
    }

    function copiar(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }

    function guardarBase(sha, datos) {
      syncBase = { sha, datos: copiar(datos) };
      try { localStorage.setItem(LS_BASE, JSON.stringify(syncBase)); } catch (e) { /* se sigue en memoria */ }
    }

    // Comparación sin importar el orden de las claves: el servidor y este
    // dispositivo no las serializan igual, y eso no es un cambio.
    function canon(x) {
      if (Array.isArray(x)) return x.map(canon);
      if (x && typeof x === 'object') {
        const o = {};
        Object.keys(x).sort().forEach(k => { if (x[k] !== undefined) o[k] = canon(x[k]); });
        return o;
      }
      return x;
    }
    function mismo(a, b) { return JSON.stringify(canon(a)) === JSON.stringify(canon(b)); }

    function datosParaSync() {
      return { expedientes, areas: AREAS, responsables: RESPONSABLES, parques: PARQUES };
    }

    // Lo que llega del servidor, con los mismos valores por defecto que usa la app.
    function normalizarRemoto(datos) {
      return {
        expedientes: Array.isArray(datos.expedientes) ? datos.expedientes : [],
        areas: (datos.areas && datos.areas.length) ? datos.areas : [...AREAS_DEFAULT],
        responsables: (datos.responsables && datos.responsables.length) ? datos.responsables : [...RESPONSABLES_DEFAULT],
        parques: Array.isArray(datos.parques) ? datos.parques : [...PARQUES_DEFAULT] // sin la clave: servidor anterior
      };
    }

    // Listas de nombres (áreas, agentes, parques): lo que este dispositivo quitó
    // se quita, lo que agregó se suma, y el resto es lo del servidor.
    function fusionarLista(base, local, remoto) {
      const quitadas = (base || []).filter(x => !local.includes(x));
      const agregadas = local.filter(x => !(base || []).includes(x) && !remoto.includes(x));
      return remoto.filter(x => !quitadas.includes(x)).concat(agregadas);
    }

    // Un expediente cambiado de un solo lado gana ese cambio. Si cambió en los dos
    // y difiere, gana este dispositivo (y se cuenta). Las altas con el mismo id
    // se renumeran en la copia local para que ninguna se pierda.
    function fusionarExpedientes(base, local, remoto) {
      const indexar = lista => { const m = new Map(); (lista || []).forEach(e => { if (e && e.id != null) m.set(String(e.id), e); }); return m; };
      const B = indexar(base), R = indexar(remoto);
      const L = copiar(local || []);
      const usados = new Set([...B.keys(), ...R.keys(), ...L.map(e => String(e.id))]);
      L.forEach(e => {
        const id = String(e.id);
        if (B.has(id) || !R.has(id) || mismo(R.get(id), e)) return;
        let nuevo = Date.now();
        while (usados.has(String(nuevo))) nuevo++;
        usados.add(String(nuevo));
        e.id = String(nuevo);
      });
      const Lm = indexar(L);
      const claves = [...R.keys(), ...Lm.keys(), ...B.keys()].filter((k, i, a) => a.indexOf(k) === i);
      let conflictos = 0;
      const merged = [];
      claves.forEach(k => {
        const bk = B.get(k), lk = Lm.get(k), rk = R.get(k);
        const lCambio = !mismo(lk, bk), rCambio = !mismo(rk, bk);
        let elegido;
        if (lCambio && rCambio && !mismo(lk, rk)) { conflictos++; elegido = lk; }
        else if (lCambio) elegido = lk;
        else elegido = rk;
        if (elegido !== undefined) merged.push(elegido);
      });
      return { merged, conflictos };
    }

    function fusionar(base, local, remoto) {
      const b = base || { expedientes: [], areas: [], responsables: [], parques: [] };
      const ex = fusionarExpedientes(b.expedientes, local.expedientes, remoto.expedientes);
      return {
        conflictos: ex.conflictos,
        merged: {
          expedientes: ex.merged,
          areas: fusionarLista(b.areas, local.areas, remoto.areas),
          responsables: fusionarLista(b.responsables, local.responsables, remoto.responsables),
          parques: fusionarLista(b.parques, local.parques, remoto.parques)
        }
      };
    }

    // Adopta lo que tiene el servidor. Si hay cambios sin subir, los fusiona con
    // él (nunca los descarta). Devuelve true si todavía hay algo que subir.
    // `enSubida`: se llama en medio de una subida, así que lo local es por definición
    // algo por subir aunque localStorage no haya guardado la marca.
    function adoptarRemoto(datos, sha, enSubida = false) {
      const remoto = normalizarRemoto(datos);
      const pendientes = enSubida || syncPendiente || hayPendiente();
      let final = remoto;
      if (pendientes) {
        const f = fusionar(syncBase.datos, datosParaSync(), remoto);
        final = f.merged;
        if (f.conflictos) console.warn(`[sync] ${f.conflictos} expediente(s) editados en dos dispositivos: se conservó la versión de este dispositivo.`);
      }
      guardarBase(sha, remoto);
      expedientes = final.expedientes;
      AREAS = final.areas;
      RESPONSABLES = final.responsables;
      PARQUES = final.parques;
      guardarEnLS(false); // guarda local sin re-subir lo que acabamos de bajar
      renderizar();
      if (pendientes && mismo(final, remoto)) {
        // Nada que subir: lo local ya estaba en el servidor.
        syncPendiente = false;
        marcarPendiente(false);
        return false;
      }
      return pendientes;
    }

    async function traerRemoto() {
      const resp = await HeaderGlobal.fetchApi('/api/sync');
      if (!resp.ok) return null;
      const datos = await resp.json();
      return { datos, sha: (datos._meta && datos._meta.sha) || null };
    }

    async function subirAGitHub() {
      try {
        sincronizando = true;
        actualizarIndicadorSync(null);

        // Sin base no hay forma de detectar un choque: se trae primero. Si ni eso
        // se puede, no se sube a ciegas (pisaría lo de otro dispositivo).
        if (!syncBase.sha) {
          const r = await traerRemoto();
          if (!r) { actualizarIndicadorSync(false); return false; }
          if (!adoptarRemoto(r.datos, r.sha, true)) { actualizarIndicadorSync(true); return true; }
        }

        // 409: otro dispositivo guardó después de nuestra base. Se fusiona con lo que
        // hay y se vuelve a intentar sobre el sha nuevo.
        for (let intento = 0; intento < 3; intento++) {
          const enviado = copiar(datosParaSync());
          const cuerpo = Object.assign({}, enviado, { timestamp: new Date().toISOString() });
          if (syncBase.sha) cuerpo._baseSha = syncBase.sha;

          const resp = await HeaderGlobal.fetchApi('/api/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cuerpo)
          });

          if (resp.status === 409) {
            let choque = null;
            try { choque = await resp.json(); } catch (e) { /* sin contenido */ }
            if (!choque || !choque.actual || !Array.isArray(choque.actual.expedientes)) throw new Error('Conflicto sin contenido para fusionar');
            const quedaAlgo = adoptarRemoto(choque.actual, (choque.actual._meta && choque.actual._meta.sha) || null, true);
            if (!quedaAlgo) { actualizarIndicadorSync(true); return true; }
            continue;
          }

          if (!resp.ok) {
            // Un 4xx (salvo clave, tiempo agotado o límite) es culpa del contenido o de la
            // configuración, no de la señal: decir «Sin conexión» manda a buscar donde no es.
            const rechazo = resp.status >= 400 && resp.status < 500 && ![401, 403, 408, 429].includes(resp.status);
            actualizarIndicadorSync(rechazo ? 'rechazado' : false);
            return false;
          }

          // Lo que el servidor tiene ahora es lo enviado: pasa a ser la base.
          let ack = null;
          try { ack = await resp.json(); } catch (e) { /* servidor anterior: sin sha */ }
          guardarBase(ack && ack.sha ? ack.sha : null, enviado);
          actualizarIndicadorSync(true);
          return true;
        }
        throw new Error('Demasiados conflictos seguidos con otro dispositivo');
      } catch (e) {
        console.error('Error al sincronizar:', e);
        actualizarIndicadorSync(false);
        return false;
      } finally {
        sincronizando = false;
      }
    }

    // Traer el servidor no depende de que no haya cambios locales: si los hay, se
    // fusionan. Así "Actualizar datos" y volver a la app siempre muestran lo último.
    async function descargarDesdeGitHub() {
      try {
        if (syncPromise) return false; // hay una subida en curso: ella deja todo al día
        const shaAntes = syncBase.sha;
        const r = await traerRemoto();
        if (!r) {
          actualizarIndicadorSync(false);
          return false;
        }
        // Si mientras bajaba empezó o terminó una subida, lo que bajó puede ser anterior.
        if (syncPromise || syncBase.sha !== shaAntes) return false;

        if (adoptarRemoto(r.datos, r.sha)) programarSincronizacion();
        else actualizarIndicadorSync(true);
        return true;
      } catch (e) {
        console.error('Error al descargar:', e);
        actualizarIndicadorSync(false);
        return false;
      }
    }

    // ===== ALMACENAMIENTO CON SYNC BATCHING =====
    // Los cambios se guardan en localStorage al instante y se suben en background.
    // 'syncPendiente' marca cambios locales que todavía no llegaron al servidor; se
    // persiste en localStorage para que sobreviva a un cierre de la app sin conexión.
    const LS_PENDIENTE = 'expedientes_crm_pendiente';
    let syncPendiente = false;
    let syncTimer = null;
    let syncPromise = null;

    function hayPendiente() {
      try { return localStorage.getItem(LS_PENDIENTE) === '1'; } catch (e) { return false; }
    }

    function marcarPendiente(valor) {
      try {
        if (valor) localStorage.setItem(LS_PENDIENTE, '1');
        else localStorage.removeItem(LS_PENDIENTE);
      } catch (e) { /* sin localStorage: se sigue en memoria */ }
    }

    function guardarEnLS(sincronizar = true) {
      try {
        localStorage.setItem('expedientes_crm_expedientes', JSON.stringify(expedientes));
        localStorage.setItem('expedientes_crm_areas', JSON.stringify(AREAS));
        localStorage.setItem('expedientes_crm_responsables', JSON.stringify(RESPONSABLES));
        localStorage.setItem('expedientes_crm_parques', JSON.stringify(PARQUES));
      } catch (e) {
        console.error('Error al guardar:', e);
      }

      // Respuesta local INSTANTÁNEA sin esperar a GitHub (cambios optimistas)
      if (sincronizar) programarSincronizacion();
    }

    function programarSincronizacion() {
      syncPendiente = true;
      marcarPendiente(true);
      // Si ya hay un sync en vuelo, su bucle levanta este cambio al terminar.
      if (syncPromise || syncTimer) return;
      syncTimer = setTimeout(() => { syncTimer = null; sincronizarEnBackground(); }, 100);
    }

    // Sube ya (sin esperar el batching) y devuelve true/false según el resultado real.
    function sincronizarAhora() {
      syncPendiente = true;
      marcarPendiente(true);
      if (syncTimer) { clearTimeout(syncTimer); syncTimer = null; }
      return sincronizarEnBackground();
    }

    function sincronizarEnBackground() {
      if (syncPromise) return syncPromise;
      syncPromise = (async () => {
        let ok = true;
        // Repite mientras lleguen cambios durante un POST: el último edit nunca se pierde.
        while (syncPendiente && ok) {
          syncPendiente = false;
          ok = await subirAGitHub(); // deja el indicador en ok/error según el resultado real
          if (!ok) syncPendiente = true; // sigue pendiente: reintenta con el próximo cambio o al volver la red
        }
        if (ok) marcarPendiente(false);
        return ok;
      })().finally(() => { syncPromise = null; });
      return syncPromise;
    }

    function cargarDesdeLS() {
      try {
        const datos = localStorage.getItem('expedientes_crm_expedientes');
        expedientes = datos ? JSON.parse(datos) : [];

        const areas = localStorage.getItem('expedientes_crm_areas');
        AREAS = areas ? JSON.parse(areas) : [...AREAS_DEFAULT];

        const responsables = localStorage.getItem('expedientes_crm_responsables');
        RESPONSABLES = responsables ? JSON.parse(responsables) : [...RESPONSABLES_DEFAULT];

        const parques = localStorage.getItem('expedientes_crm_parques');
        PARQUES = parques ? JSON.parse(parques) : [...PARQUES_DEFAULT];
      } catch (e) {
        console.error('Error al cargar:', e);
        expedientes = [];
        AREAS = [...AREAS_DEFAULT];
        RESPONSABLES = [...RESPONSABLES_DEFAULT];
        PARQUES = [...PARQUES_DEFAULT];
      }
    }

    function agregarArea(nombre) {
      if (nombre.trim() && !AREAS.includes(nombre)) {
        AREAS.push(nombre);
        guardarEnLS();
        renderizar();
        return true;
      }
      return false;
    }

    function eliminarArea(nombre) {
      const usos = expedientes.filter(e => e.area === nombre).length;
      if (usos > 0) {
        mostrarAlerta('No se puede eliminar', `El área "${nombre}" la usan ${usos} expediente${usos !== 1 ? 's' : ''} (activos o archivados). Reasignalos antes de eliminarla.`);
        return;
      }
      const indice = AREAS.indexOf(nombre);
      AREAS = AREAS.filter(a => a !== nombre);
      if (filtroArea === nombre) filtroArea = null; // si no, la lista queda filtrada por un chip que ya no existe
      guardarEnLS();
      renderizar();
      mostrarToast(`Área "${nombre}" eliminada`, { accion: () => {
        AREAS.splice(Math.min(indice, AREAS.length), 0, nombre);
        guardarEnLS();
        renderizar();
      } });
    }

    function agregarResponsable(nombre) {
      if (nombre.trim() && !RESPONSABLES.includes(nombre)) {
        RESPONSABLES.push(nombre);
        guardarEnLS();
        renderizar();
        return true;
      }
      return false;
    }

    function eliminarResponsable(nombre) {
      const usos = expedientes.filter(e => e.responsable === nombre).length;
      if (usos > 0) {
        mostrarAlerta('No se puede eliminar', `"${nombre}" es agente de ${usos} expediente${usos !== 1 ? 's' : ''} (activos o archivados). Reasignalos antes de eliminarlo.`);
        return;
      }
      const indice = RESPONSABLES.indexOf(nombre);
      RESPONSABLES = RESPONSABLES.filter(r => r !== nombre);
      guardarEnLS();
      renderizar();
      mostrarToast(`"${nombre}" eliminado`, { accion: () => {
        RESPONSABLES.splice(Math.min(indice, RESPONSABLES.length), 0, nombre);
        guardarEnLS();
        renderizar();
      } });
    }

    // ===== FUNCIONES DE UI =====
    // Opciones de un <select> de lista administrable. Si el expediente trae un valor que
    // ya no está en la lista (lo quitó otro dispositivo, o es un dato viejo), se agrega
    // como opción para que no se pierda en silencio al guardar.
    function opcionesSelect(lista, actual) {
      const fuera = actual && !lista.includes(actual)
        ? `<option value="${esc(actual)}" selected>${esc(actual)} (ya no está en la lista)</option>`
        : '';
      return fuera + lista.map(v => `<option value="${esc(v)}" ${actual === v ? 'selected' : ''}>${esc(v)}</option>`).join('');
    }

    function crearFormulario(expediente = null) {
      const html = `
        <div class="form-group">
          <label class="form-label" for="numero">Nro Expediente <span style="font-weight: 400; color: var(--text-muted);">(opcional)</span></label>
          <input type="text" class="form-input" id="numero" placeholder="363-1254/2025-01" value="${esc(expediente?.numero)}" autocomplete="off" data-ayuda="ayuda-numero" aria-describedby="ayuda-numero" pattern="\\d{3}\\s*-\\s*\\d{1,6}\\/\\d{4}\\s*-\\s*\\d{1,2}">
          <span class="form-help" id="ayuda-numero">Formato: 363-1254/2025-01. Podés pegarlo desde Word o PDF.</span>
        </div>

        <div class="form-group">
          <label class="form-label required" for="tema">Tema</label>
          <input type="text" class="form-input" id="tema" placeholder="Descripción breve del asunto" value="${esc(expediente?.tema)}" aria-required="true">
        </div>

        <div class="form-group">
          <label class="form-label required" for="parque">Tag</label>
          <select class="form-select" id="parque" aria-required="true">
            <option value="">Elegí un tag</option>
            ${opcionesSelect(PARQUES, expediente?.parque)}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label required" for="area">Área responsable</label>
          <select class="form-select" id="area" aria-required="true">
            <option value="">Seleccionar área...</option>
            ${opcionesSelect(AREAS, expediente?.area)}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label required" for="responsable">Agente</label>
          <select class="form-select" id="responsable" aria-required="true">
            <option value="">Seleccionar agente...</option>
            ${opcionesSelect(RESPONSABLES, expediente?.responsable)}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label required" for="fechaInicio">Fecha de Inicio</label>
          <input type="date" class="form-input" id="fechaInicio" value="${esc(expediente?.fechaInicio || fechaISO(new Date()))}" aria-required="true">
        </div>

        <div class="form-group">
          <label class="form-label required" for="diasPlazo">Plazo en Días Hábiles</label>
          <input type="number" class="form-input" id="diasPlazo" placeholder="30" value="${esc(expediente?.diasPlazo)}" min="1" max="${PLAZO_MAX_DIAS}" step="1" aria-required="true">
        </div>

        <div class="form-group">
          <label class="form-label">Fecha de Vencimiento</label>
          <div class="form-input" id="fechaVencimiento" role="status" aria-live="polite" style="background-color: var(--gray-100); padding: 10px; border-radius: 6px; cursor: default; user-select: none;">
            Completa Fecha de Inicio y Plazo
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="notas">Nueva nota (se agrega al historial)</label>
          <textarea class="form-textarea" id="notas" placeholder="Anotaciones sobre el expediente"></textarea>
        </div>

        ${expediente && expediente.intervenciones && expediente.intervenciones.length > 0 ? `
          <div class="notas-seccion">
            <div class="notas-header">Notas (${expediente.intervenciones.length})</div>
            <div class="notas-list">
              ${expediente.intervenciones.map(i => `
                <div class="nota-item">
                  <span class="nota-hora">${esc(i.hora)}</span>
                  <div class="nota-texto">${esc(i.texto)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}
      `;

      return html;
    }

    function renderizarConfigAreas() {
      const html = AREAS.map(area => `
        <div class="config-item">
          <span>${esc(area)}</span>
          <button type="button" data-nombre="${esc(area)}" onclick="eliminarArea(this.dataset.nombre)" aria-label="Eliminar área ${esc(area)}">✕</button>
        </div>
      `).join('');
      document.getElementById('areasConfigList').innerHTML = html || '<p style="color: var(--text-muted); font-size: 12px; text-align: center; padding: 20px 0;">No hay áreas</p>';
    }

    function renderizarConfigResponsables() {
      const html = RESPONSABLES.map(r => `
        <div class="config-item">
          <span>${esc(r)}</span>
          <button type="button" data-nombre="${esc(r)}" onclick="eliminarResponsable(this.dataset.nombre)" aria-label="Eliminar agente ${esc(r)}">✕</button>
        </div>
      `).join('');
      document.getElementById('responsablesConfigList').innerHTML = html || '<p style="color: var(--text-muted); font-size: 12px; text-align: center; padding: 20px 0;">No hay agentes</p>';
    }

    function agregarAreaDesdeInput() {
      const input = document.getElementById('inputArea');
      if (agregarArea(input.value)) {
        input.value = '';
        renderizarConfigAreas();
      } else if (input.value.trim()) {
        mostrarAlerta('ℹ️ Duplicada', 'El área ya existe');
      }
    }

    function agregarResponsableDesdeInput() {
      const input = document.getElementById('inputResponsable');
      if (agregarResponsable(input.value)) {
        input.value = '';
        renderizarConfigResponsables();
      } else if (input.value.trim()) {
        mostrarAlerta('ℹ️ Duplicado', 'El agente ya existe');
      }
    }

    function renderizarConfigParques() {
      const html = PARQUES.map(p => `
        <div class="config-item">
          <span>${esc(p)}</span>
          <button type="button" data-nombre="${esc(p)}" onclick="eliminarParque(this.dataset.nombre)" aria-label="Quitar parque ${esc(p)}">✕</button>
        </div>
      `).join('');
      document.getElementById('parquesConfigList').innerHTML = html || '<p style="color: var(--text-muted); font-size: 12px; text-align: center; padding: 20px 0;">No hay parques</p>';
    }

    function agregarParque(nombre) {
      const limpio = nombre.trim();
      if (limpio && !PARQUES.includes(limpio)) {
        PARQUES.push(limpio);
        guardarEnLS();
        renderizar();
        return true;
      }
      return false;
    }

    function agregarParqueDesdeInput() {
      const input = document.getElementById('inputParque');
      if (agregarParque(input.value)) {
        input.value = '';
        renderizarConfigParques();
      } else if (input.value.trim()) {
        mostrarAlerta('ℹ️ Duplicado', 'El parque ya existe');
      }
    }

    // Un parque asignado a algún expediente no se quita: si no, la tarjeta
    // quedaría con un tag que ya no figura en la lista.
    function eliminarParque(nombre) {
      const usos = expedientes.filter(e => e.parque === nombre).length;
      if (usos > 0) {
        mostrarAlerta('No se puede eliminar', `"${nombre}" está asignado a ${usos} expediente${usos !== 1 ? 's' : ''} (activos o archivados). Cambialos antes de quitarlo.`);
        return;
      }
      const indice = PARQUES.indexOf(nombre);
      PARQUES = PARQUES.filter(p => p !== nombre);
      guardarEnLS();
      renderizar();
      mostrarToast(`Parque "${nombre}" quitado`, { accion: () => {
        PARQUES.splice(Math.min(indice, PARQUES.length), 0, nombre);
        guardarEnLS();
        renderizar();
      } });
    }

    function estadoDe(exp) {
      return (exp.estado || 'activo') === 'archivado' ? 'archivados' : 'activos';
    }

    // Los contadores reflejan la pestaña visible: antes "Total" sumaba activos y
    // archivados y no coincidía con las tarjetas de la lista.
    function renderizarPanelAreas() {
      const enPestana = expedientes.filter(e => estadoDe(e) === pestanaActiva);

      const html = `
        <button class="area-btn ${filtroArea === null ? 'active' : ''}" data-area="" onclick="filtrarArea(this.dataset.area || null)">
          Total<span class="count">${enPestana.length}</span>
        </button>
        ${AREAS.map(area => `
          <button class="area-btn ${filtroArea === area ? 'active' : ''}" data-area="${esc(area)}" onclick="filtrarArea(this.dataset.area || null)">
            ${esc(area)}<span class="count">${enPestana.filter(e => e.area === area).length}</span>
          </button>
        `).join('')}
      `;

      document.getElementById('areaBotones').innerHTML = html;
    }

    function filtrarArea(area) {
      filtroArea = area;
      renderizar();
    }

    function cambiarPestana(pestana) {
      pestanaActiva = pestana;
      renderizar();
    }

    function actualizarPestanas() {
      const nombres = { activos: 'Activos', archivados: 'Archivados' };
      document.querySelectorAll('.pestana-btn').forEach(btn => {
        const p = btn.dataset.pestana;
        const cantidad = expedientes.filter(e => estadoDe(e) === p).length;
        btn.innerHTML = `${nombres[p]}<span class="count">${cantidad}</span>`;
        btn.classList.toggle('active', p === pestanaActiva);
        btn.setAttribute('aria-selected', String(p === pestanaActiva));
      });
    }

    function marcarResuelto(expedienteId) {
      const exp = expedientes.find(e => e.id === expedienteId);
      if (!exp) return;
      const previo = { estado: exp.estado, fechaResolucion: exp.fechaResolucion };

      exp.estado = 'archivado';
      exp.fechaResolucion = fechaISO(new Date());
      guardarEnLS(true);
      renderizar();
      mostrarToast('Expediente archivado', { accion: () => {
        // Se busca de nuevo: una descarga pudo reemplazar la lista mientras el aviso estaba a la vista.
        const actual = expedientes.find(e => e.id === expedienteId);
        if (!actual) return;
        actual.estado = previo.estado || 'activo';
        if (previo.fechaResolucion) actual.fechaResolucion = previo.fechaResolucion;
        else delete actual.fechaResolucion;
        guardarEnLS(true);
        renderizar();
      } });
    }

    function reabrirExpediente(expedienteId) {
      const exp = expedientes.find(e => e.id === expedienteId);
      if (!exp) return;
      const previo = { estado: exp.estado, fechaResolucion: exp.fechaResolucion };

      exp.estado = 'activo';
      delete exp.fechaResolucion;
      guardarEnLS(true);
      renderizar();
      mostrarToast('Expediente reabierto', { accion: () => {
        const actual = expedientes.find(e => e.id === expedienteId);
        if (!actual) return;
        actual.estado = previo.estado;
        if (previo.fechaResolucion) actual.fechaResolucion = previo.fechaResolucion;
        else delete actual.fechaResolucion;
        guardarEnLS(true);
        renderizar();
      } });
    }

    function sinTildes(texto) {
      return String(texto).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function filtrarBusqueda() {
      busqueda = document.getElementById('searchInput').value.toLowerCase().trim();
      renderizar();
    }

    function renderizar() {
      renderizarConfigAreas();
      renderizarConfigResponsables();
      renderizarConfigParques();
      renderizarPanelAreas();
      actualizarPestanas();

      let filtrados = expedientes;

      // Filtrar por pestaña (activos/archivados)
      const estadoFiltro = pestanaActiva === 'activos' ? 'activo' : 'archivado';
      filtrados = filtrados.filter(e => (e.estado || 'activo') === estadoFiltro);

      // Filtrar por área
      if (filtroArea) {
        filtrados = filtrados.filter(e => e.area === filtroArea);
      }

      // Filtrar por búsqueda (número, tema, tag, área, responsable), sin importar
      // mayúsculas ni tildes: «juridica» tiene que encontrar «Jurídica».
      if (busqueda) {
        const q = sinTildes(busqueda);
        filtrados = filtrados.filter(e =>
          [e.numero, e.tema, e.parque, e.area, e.responsable].some(v => v && sinTildes(v).includes(q))
        );
      }

      // El plazo se calcula una sola vez por expediente (no en cada comparación del sort).
      const hoy = hoyLocal();
      const items = filtrados.map(exp => ({
        exp,
        plazo: calcularPlazo(exp.fechaInicio, exp.diasPlazo, hoy)
      }));

      if (pestanaActiva === 'archivados') {
        // Más recientemente resueltos primero
        items.sort((a, b) => (b.exp.fechaResolucion || '').localeCompare(a.exp.fechaResolucion || ''));
      } else {
        // Vencidos primero (el más atrasado arriba), luego por fecha de vencimiento
        items.sort((a, b) => a.plazo.fechaFin - b.plazo.fechaFin);
      }

      const html = items.map(({ exp, plazo }) => {
        const archivado = pestanaActiva === 'archivados';
        const clase = archivado ? 'archivado' : obtenerSemaforo(plazo).color;
        const titulo = archivado
          ? `Resuelto el ${exp.fechaResolucion ? formatearFechaCorta(parsearFecha(exp.fechaResolucion)) : '—'}`
          : textoPlazo(plazo);
        const expandId = `exp-expand-${exp.id}`;
        const notas = exp.intervenciones || [];
        const abierto = expandidos.has(exp.id);

        return `
          <div class="expediente-card-new ${clase}" data-id="${esc(exp.id)}">
            <button type="button" class="expediente-header-urgencia ${clase}" data-target="${esc(expandId)}" aria-expanded="${abierto}" aria-controls="${esc(expandId)}" onclick="alternarExpediente(this)">
              <span class="expediente-urgencia-title">
                <span class="expediente-urgencia-tema" style="display:block">${esc(exp.tema)}</span>
                <span class="expediente-urgencia-label" style="display:block">${exp.numero ? esc(exp.numero) : 'Sin expediente'}</span>
                ${exp.parque ? `<span class="expediente-parque-tag">${esc(exp.parque)}</span>` : ''}
                <strong class="expediente-urgencia-dias" style="display:block">${esc(titulo)}</strong>
              </span>
              <span class="expediente-expand-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </span>
            </button>

            <div id="${esc(expandId)}" class="expediente-expanded-content${abierto ? ' expanded' : ''}">
              <div class="expediente-expanded-dates">
                <div><span class="label">Área responsable:</span><span>${esc(exp.area)}</span></div>
                <div><span class="label">Agente:</span><span>${esc(exp.responsable)}</span></div>
                <div><span class="label">Inicio:</span><span>${esc(formatearFechaCorta(parsearFecha(exp.fechaInicio)))}</span></div>
                ${archivado ? '' : `<div><span class="label">Vence:</span><span>${esc(formatearFechaCorta(plazo.fechaFin))}</span></div>`}
              </div>

              <div class="notas-seccion">
                <div class="notas-header">Notas${notas.length ? ` (${notas.length})` : ''}</div>
                ${notas.length ? `<div class="notas-list">${notas.map(i => `
                  <div class="nota-item">
                    <span class="nota-hora">${esc(i.hora)}</span>
                    <div class="nota-texto">${esc(i.texto)}</div>
                  </div>`).join('')}</div>` : '<div class="notas-empty">Sin notas aún</div>'}
              </div>

              <div class="expediente-actions">
                ${archivado
                  ? `<button class="btn btn-secondary btn-grow" data-id="${esc(exp.id)}" onclick="reabrirExpediente(this.dataset.id)">${HeaderGlobal.icono('reabrir')} Reabrir</button>`
                  : `<button class="btn btn-success btn-grow" data-id="${esc(exp.id)}" onclick="marcarResuelto(this.dataset.id)">${HeaderGlobal.icono('resolver')} Resolver</button>`
                }
                <button class="btn btn-outline btn-grow" data-id="${esc(exp.id)}" onclick="abrirEditar(this.dataset.id)">${HeaderGlobal.icono('editar')} Editar</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('expedientesList').innerHTML = html || `<p style="padding: 16px; text-align: center; color: var(--text-muted);">${esc(mensajeVacio())}</p>`;
    }

    const expandidos = new Set();

    function alternarExpediente(btn) {
      const abierto = btn.getAttribute('aria-expanded') === 'true';
      const id = btn.closest('.expediente-card-new').dataset.id;
      if (abierto) expandidos.delete(id); else expandidos.add(id);
      btn.setAttribute('aria-expanded', String(!abierto));
      document.getElementById(btn.dataset.target).classList.toggle('expanded', !abierto);
    }

    function mensajeVacio() {
      if (busqueda) return `Sin resultados para «${busqueda}»`;
      if (filtroArea) return `No hay expedientes ${pestanaActiva === 'archivados' ? 'archivados' : 'activos'} en ${filtroArea}`;
      return pestanaActiva === 'archivados'
        ? 'Todavía no hay expedientes archivados'
        : 'No hay expedientes activos. Tocá + para cargar uno.';
    }

    function actualizarFechaVencimiento() {
      const fechaInicio = document.getElementById('fechaInicio')?.value;
      const plazoEscrito = (document.getElementById('diasPlazo')?.value || '').trim();
      const diasPlazo = /^\d{1,4}$/.test(plazoEscrito) ? parseInt(plazoEscrito, 10) : 0;

      if (!fechaInicio || diasPlazo < 1 || diasPlazo > PLAZO_MAX_DIAS) {
        document.getElementById('fechaVencimiento').textContent = 'Completa Fecha de Inicio y Plazo';
        return;
      }

      const fechaFin = calcularFechaFin(fechaInicio, diasPlazo);
      const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const fechaFormato = fechaFin.toLocaleDateString('es-AR', opciones);
      const plazo = calcularPlazo(fechaInicio, diasPlazo);
      const estado = plazo.vencido ? textoPlazo(plazo).toLowerCase()
        : plazo.venceHoy ? 'vence hoy'
        : `${plazo.diasRestantes} día${plazo.diasRestantes !== 1 ? 's' : ''} hábil${plazo.diasRestantes !== 1 ? 'es' : ''} restante${plazo.diasRestantes !== 1 ? 's' : ''}`;

      document.getElementById('fechaVencimiento').textContent = `${fechaFormato} (${estado})`;
    }

    // Errores en línea: se marcan el campo y el mensaje, y se limpian apenas el usuario corrige.
    const CAMPOS_FORM = ['numero', 'tema', 'parque', 'area', 'responsable', 'fechaInicio', 'diasPlazo'];

    function mostrarErrorCampo(id, mensaje) {
      const input = document.getElementById(id);
      if (!input) return;
      input.classList.remove('valid');
      input.classList.add('invalid');
      input.setAttribute('aria-invalid', 'true');
      let err = document.getElementById('error-' + id);
      if (!err) {
        err = document.createElement('span');
        err.className = 'form-error';
        err.id = 'error-' + id;
        err.setAttribute('role', 'alert');
        input.insertAdjacentElement('afterend', err);
      }
      err.textContent = mensaje;
      input.setAttribute('aria-describedby', ['error-' + id, input.dataset.ayuda].filter(Boolean).join(' '));
    }

    function limpiarErrorCampo(id) {
      const input = document.getElementById(id);
      if (!input) return;
      input.classList.remove('invalid');
      input.removeAttribute('aria-invalid');
      document.getElementById('error-' + id)?.remove();
      if (input.dataset.ayuda) input.setAttribute('aria-describedby', input.dataset.ayuda);
      else input.removeAttribute('aria-describedby');
    }

    function enlazarFormulario() {
      const inputNumero = document.getElementById('numero');
      inputNumero.addEventListener('input', (e) => { limpiarErrorCampo('numero'); actualizarValidacionNumero(e.target); });
      inputNumero.addEventListener('blur', (e) => actualizarValidacionNumero(e.target));

      CAMPOS_FORM.filter(id => id !== 'numero').forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('input', () => limpiarErrorCampo(id));
        el.addEventListener('change', () => limpiarErrorCampo(id));
      });

      // Cálculo de vencimiento en tiempo real
      document.getElementById('fechaInicio').addEventListener('change', actualizarFechaVencimiento);
      document.getElementById('diasPlazo').addEventListener('input', actualizarFechaVencimiento);
    }

    function abrirNuevo() {
      editandoId = null;
      document.getElementById('modalTitle').textContent = 'Nuevo Expediente';
      document.getElementById('btnEliminar').classList.add('hidden');

      document.getElementById('formularioModal').innerHTML = crearFormulario();
      enlazarFormulario();

      abrirOverlay('modalOverlay', '#numero');
    }

    function abrirEditar(id) {
      const exp = expedientes.find(e => e.id === id);
      if (!exp) return;
      editandoId = id;

      document.getElementById('modalTitle').textContent = `Editar: ${exp.numero || 'sin número'}`;
      document.getElementById('btnEliminar').classList.remove('hidden');

      document.getElementById('formularioModal').innerHTML = crearFormulario(exp);
      enlazarFormulario();
      actualizarValidacionNumero(document.getElementById('numero'));
      actualizarFechaVencimiento(); // Mostrar el cálculo inicial

      abrirOverlay('modalOverlay', '#tema');
    }

    function cerrarModal() {
      cerrarOverlay('modalOverlay');
      editandoId = null;
    }

    function guardarExpediente() {
      const numero = document.getElementById('numero').value.trim();
      const tema = document.getElementById('tema').value.trim();
      const area = document.getElementById('area').value;
      const responsable = document.getElementById('responsable').value;
      const parque = document.getElementById('parque').value;
      const fechaInicio = document.getElementById('fechaInicio').value;
      const diasPlazoTexto = document.getElementById('diasPlazo').value.trim();
      // Solo enteros en dígitos: parseInt('1e2') daba 1 y parseInt('2.5') daba 2 sin avisar.
      const diasPlazo = /^\d{1,4}$/.test(diasPlazoTexto) ? parseInt(diasPlazoTexto, 10) : NaN;
      const notas = document.getElementById('notas').value.trim();

      CAMPOS_FORM.forEach(limpiarErrorCampo);

      // El número es opcional, pero si se ingresó tiene que ser correcto.
      const errores = [
        [numero && !validarNumeroExpediente(numero), 'numero', 'El número no tiene el formato esperado (mesa-número/año-sufijo)'],
        [!tema, 'tema', 'Escribí el tema del expediente'],
        [!parque, 'parque', 'Elegí un tag'],
        [!area, 'area', 'Elegí un área'],
        [!responsable, 'responsable', 'Elegí un responsable'],
        [!fechaInicio, 'fechaInicio', 'Indicá la fecha de inicio'],
        [!(diasPlazo >= 1 && diasPlazo <= PLAZO_MAX_DIAS), 'diasPlazo', `Indicá el plazo en días hábiles, un entero entre 1 y ${PLAZO_MAX_DIAS}`]
      ].filter(([falla]) => falla);

      if (errores.length) {
        errores.forEach(([, id, mensaje]) => mostrarErrorCampo(id, mensaje));
        document.getElementById(errores[0][1]).focus();
        return;
      }

      let exp;

      if (editandoId) {
        exp = expedientes.find(e => e.id === editandoId);
        if (!exp) {
          cerrarModal();
          mostrarAlerta('Expediente no encontrado', 'Este expediente ya no existe: lo eliminaron desde otro dispositivo. Los cambios de este formulario no se guardaron.');
          return;
        }

        exp.numero = numero;
        exp.tema = tema;
        exp.area = area;
        exp.responsable = responsable;
        exp.parque = parque;
        exp.fechaInicio = fechaInicio;
        exp.diasPlazo = diasPlazo;
      } else {
        exp = {
          id: idNuevo(),
          numero,
          tema,
          area,
          responsable,
          parque,
          fechaInicio,
          diasPlazo,
          estado: 'activo',
          intervenciones: []
        };
        expedientes.push(exp);
      }

      if (notas) {
        const ahora = new Date();
        const hh = String(ahora.getHours()).padStart(2, '0');
        const mm = String(ahora.getMinutes()).padStart(2, '0');
        const dd = String(ahora.getDate()).padStart(2, '0');
        const mo = String(ahora.getMonth() + 1).padStart(2, '0');

        exp.intervenciones = exp.intervenciones || [];
        exp.intervenciones.push({
          hora: `${dd}/${mo}/${ahora.getFullYear()} ${hh}:${mm}`,
          texto: notas
        });
      }

      guardarEnLS();
      renderizar();
      cerrarModal();
    }

    // Dos altas en el mismo milisegundo (o un reloj retrasado) no pueden compartir id.
    function idNuevo() {
      let n = Date.now();
      while (expedientes.some(e => String(e.id) === String(n))) n++;
      return String(n);
    }

    function eliminarExpediente() {
      const indice = expedientes.findIndex(e => e.id === editandoId);
      if (indice === -1) return;
      const [eliminado] = expedientes.splice(indice, 1);

      guardarEnLS();
      renderizar();
      cerrarModal();
      mostrarToast('Expediente eliminado', { accion: () => {
        expedientes.splice(Math.min(indice, expedientes.length), 0, eliminado);
        guardarEnLS();
        renderizar();
      } });
    }

    // ===== FUNCIONES CONFIG MODAL =====
    function abrirConfigModal() {
      abrirOverlay('configOverlay', '#inputArea');
    }

    function cerrarConfigModal() {
      cerrarOverlay('configOverlay');
    }

    // ===== EVENTOS =====
    document.getElementById('modalClose').addEventListener('click', cerrarModal);
    document.getElementById('btnCancelar').addEventListener('click', cerrarModal);
    document.getElementById('btnGuardar').addEventListener('click', guardarExpediente);
    document.getElementById('btnEliminar').addEventListener('click', eliminarExpediente);

    // Los iconos de estos tres salen del juego compartido (header.js), igual
    // que en las otras apps. Se ponen desde acá y no en el HTML porque el
    // SVG se define una sola vez para las cuatro pantallas.
    [['btnGuardar','guardar','Guardar'],
     ['btnCancelar','cancelar','Cancelar'],
     ['btnEliminar','eliminar','Eliminar']].forEach(([id, ico, texto]) => {
      document.getElementById(id).innerHTML = HeaderGlobal.icono(ico) + texto;
    });
    document.getElementById('formularioModal').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
        e.preventDefault();
        guardarExpediente();
      }
    });


    // Config Modal Events (se abre desde el menú ⋮ del header común)
    document.getElementById('configClose').addEventListener('click', cerrarConfigModal);

    document.getElementById('configOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('configOverlay')) {
        cerrarConfigModal();
      }
    });

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalOverlay')) {
        cerrarModal();
      }
    });

    // ===== INICIALIZACIÓN =====
    (async () => {
      cargarDesdeLS();
      renderizar(); // Mostrar lo local de inmediato, sin esperar la red

      // Cambios hechos sin conexión: primero subirlos; si no se puede, conservar lo local
      // en lugar de pisarlo con lo que hay en el servidor.
      if (hayPendiente() && !(await sincronizarAhora())) return;

      await descargarDesdeGitHub(); // Trae cambios de otros dispositivos
    })();

    window.addEventListener('online', () => {
      if (hayPendiente()) sincronizarAhora();
    });

    // Trae los cambios de otro dispositivo al volver a la app, sin tener que recargar.
    // Se limita a una vez cada 10s y no toca nada mientras se edita un expediente.
    let ultimaDescarga = Date.now();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (Date.now() - ultimaDescarga < 10000) return;
      if (overlayAbierto('modalOverlay')) return;
      ultimaDescarga = Date.now();
      if (hayPendiente()) sincronizarAhora();
      else descargarDesdeGitHub();
    });

    // Tocar el indicador fuerza una sincronización (útil si quedó en "Sin conexión").
    async function reintentarSync() {
      ultimaDescarga = Date.now();
      if (hayPendiente() && !(await sincronizarAhora())) return;
      await descargarDesdeGitHub();
    }

    document.getElementById('toastAccion').addEventListener('click', () => {
      const accion = toastAccionActual;
      ocultarToast();
      if (accion) accion();
    });

    // Cerrar popup de alerta al clickear afuera (Escape lo maneja el handler de modales)
    document.getElementById('alertOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('alertOverlay')) {
        cerrarAlert();
      }
    });

    // Header común a las 4 apps (título + ⋮) y botón flotante de alta.
    // La configuración, que antes era un engranaje suelto en el header, vive
    // ahora en el menú ⋮ junto con el estado de sincronización.
    HeaderGlobal.init({
      titulo: 'Seguimiento',
      accion: { etiqueta: 'Nuevo expediente', onClick: abrirNuevo },
      menu: [
        { etiqueta: 'Áreas y agentes', onClick: abrirConfigModal },
        { etiqueta: 'Actualizar datos', onClick: reintentarSync }
      ]
    });

    // PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>

<div class="veil" id="veil" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Ficha de expediente"></div></div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span class="toast-mensaje" id="toastMensaje"></span>
  <button type="button" class="toast-accion" id="toastAccion" hidden>Deshacer</button>
</div>

<script src="/header.js"></script>
<script src="/confirmar-cambios.js"></script>
<script>
(function(){
  "use strict";

  var PARQUES = ["Salta","Güemes","Rosario","Mosconi","Pichanal","SAC","Olacapato","Salar de Pocitos"];
  var PARQUE_COLOR = {Salta:"--s1",Güemes:"--s2",Rosario:"--s3",Mosconi:"--s4",Pichanal:"--s5",SAC:"--s6",
                      Olacapato:"--s7","Salar de Pocitos":"--s8"};
  var RUBROS = ["Manufactura","Servicios","Acopio","Logística","Química","Alimenticia",
                "Metalmecánica","Metalúrgica","Comercio","Construcción","Textil",
                "Materiales de construcción","Maderera","Plástica","Otro"];
  var SITUACIONES = [
    {id:"Sin_tratamiento", label:"Sin tratamiento"},
    {id:"En_tratamiento",  label:"En tratamiento"},
    {id:"Adjudicada",      label:"Adjudicada"},
    {id:"Desestimada",     label:"Desestimada"}
  ];
  var SIN_PARQUE = "(sin parque)";
  function colorParque(p){
    return PARQUE_COLOR[p] ? "var("+PARQUE_COLOR[p]+")" : "var(--idle)";
  }

  var STORAGE_KEY = "cartas_intencion_parques_v3";
  var BORRADOS_KEY = "cartas_intencion_borrados_v1";
  var PLAZO_KEY = "cartas_intencion_plazo_v1";
  var UMBRAL_KEY = "cartas_intencion_umbrales_v1";
  var SYNC_AT_KEY = "cartas_intencion_ultima_sync_v1";
  // Umbrales del semáforo, en días hábiles RESTANTES del plazo estimado.
  // Son configurables desde el dashboard (sección Urgencias) y viajan en
  // datos.json: nada de esto está hardcodeado en el cálculo.
  var UMBRAL_DEFAULT = {alerta:30, critico:15};
  // Archivado automático: Sin tratamiento sin ningún movimiento (nota, edición
  // o cambio de situación) en 6 meses hábiles se archiva solo, para que deje
  // de inflar el semáforo de Urgencias con expedientes que de hecho nadie va
  // a tratar. 6 meses hábiles ≈ 22 días hábiles/mes × 6.
  // En_tratamiento NO entra, aunque pase el umbral: significa que alguien lo
  // está trabajando activamente (puede ser por teléfono o en persona, sin que
  // quede una nota en la app), y archivarlo solo por falta de nota sería
  // sacarle de encima algo que sigue en curso. Adjudicada/Desestimada tampoco:
  // ya están resueltas y no corren plazo.
  // Se puede "Rescatar" desde la pestaña Archivo (o editando el expediente):
  // vuelve al flujo normal y el reloj arranca de nuevo desde ese momento.
  var UMBRAL_ARCHIVO_DIAS_HABILES = 132;
  var SIT_BADGE = {Adjudicada:"b-ok", En_tratamiento:"b-warn",
                   Sin_tratamiento:"b-idle", Desestimada:"b-danger"};

  // Feriados nacionales (+ Güemes, 17/6, feriado en Salta) 2025-2026.
  //
  // IMPORTANTE: esta tabla tiene fecha de vencimiento. Los feriados
  // trasladables y los puentes turísticos los fija el gobierno por decreto
  // cada año, así que no se pueden calcular: hay que cargarlos a mano.
  //
  // El código ya NO asume que un año sin cargar no tiene feriados. Cuando un
  // vencimiento cae más allá del último año cargado, el plazo se marca como
  // estimado (con ~) en vez de darse por exacto. Antes, un expediente que
  // vencía en 2027 se calculaba como si 2027 no tuviera ningún feriado, lo
  // que adelantaba la fecha y disparaba urgencias falsas sin avisar.
  //
  // Para extender: agregá el año al array y listo, el aviso desaparece solo.
  var FERIADOS = [
    "2025-01-01","2025-03-03","2025-03-04","2025-03-24","2025-04-02","2025-04-18",
    "2025-05-01","2025-05-25","2025-06-17","2025-06-20","2025-07-09","2025-08-17",
    "2025-10-12","2025-11-24","2025-12-08","2025-12-25",
    "2026-01-01","2026-02-16","2026-02-17","2026-03-24","2026-04-02","2026-04-17",
    "2026-05-01","2026-05-25","2026-06-17","2026-06-20","2026-07-09","2026-08-17",
    "2026-10-12","2026-11-20","2026-12-08","2026-12-25"
  ];

  // Último año cubierto por la tabla, derivado de los datos: no hay que
  // acordarse de actualizar una constante aparte al agregar un año.
  var FERIADOS_HASTA_ANIO = FERIADOS.reduce(function(max, f){
    var a = parseInt(f.slice(0,4), 10);
    return a > max ? a : max;
  }, 0);
  // La tabla tampoco empieza en el año 0: hay expedientes de 2013 cuya
  // ventana de plazo cae entera antes del primer año cargado, con el mismo
  // sesgo optimista que un vencimiento en el futuro sin cargar.
  var FERIADOS_DESDE_ANIO = FERIADOS.reduce(function(min, f){
    var a = parseInt(f.slice(0,4), 10);
    return (min === 0 || a < min) ? a : min;
  }, 0);

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function horaLocal(){
    var ahora = new Date();
    var hh = String(ahora.getHours()).padStart(2,'0');
    var mm = String(ahora.getMinutes()).padStart(2,'0');
    var dd = String(ahora.getDate()).padStart(2,'0');
    var mo = String(ahora.getMonth()+1).padStart(2,'0');
    return dd+"/"+mo+"/"+ahora.getFullYear()+" "+hh+":"+mm;
  }

  // "dd/mm/aaaa hh:mm" -> "aaaa-mm-dd hh:mm". Ordenar el texto original es
  // ordenar por día y mes antes que por año ("20/12/2025" > "15/01/2026").
  function claveFechaHora(s){
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?: (\d{1,2}:\d{2}))?/.exec(String(s||"").trim());
    if(!m) return "";
    return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0")+" "+(m[4]||"00:00");
  }
  // Estricta a propósito. La versión anterior aceptaba "31/02/2026" y devolvía
  // el 3 de marzo sin avisar, y "99/99/9999" daba el año 10007. Como
  // fecha_inicio es la entrada de la que depende TODO el semáforo, una fecha
  // corrida en silencio es un plazo mal calculado en silencio.
  function parseFechaLocal(ddmmaaaa){
    var txt = String(ddmmaaaa||"").trim();
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(txt);
    if(!m) return null;
    var dia = parseInt(m[1],10), mes = parseInt(m[2],10), anio = parseInt(m[3],10);
    if(mes < 1 || mes > 12 || dia < 1 || dia > 31) return null;
    if(anio < 1900 || anio > 2200) return null;
    var d = new Date(anio, mes-1, dia);
    // Si el Date se corrió (31/02 -> 03/03), los componentes no coinciden.
    if(d.getFullYear()!==anio || d.getMonth()!==mes-1 || d.getDate()!==dia) return null;
    return d;
  }

  function fechaISO(d){
    var mo = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return d.getFullYear()+"-"+mo+"-"+dd;
  }

  // El campo de fecha es el mismo calendario nativo que Expediente (yyyy-mm-dd).
  // El dato se guarda como dd/mm/aaaa: se convierte por texto, sin pasar por Date,
  // para que la fecha no se corra de día según la zona horaria.
  function ddmmaaaaAIso(s){
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s||"").trim());
    if(!m) return "";
    return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  }
  function isoADdmmaaaa(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||"").trim());
    return m ? m[3]+"/"+m[2]+"/"+m[1] : "";
  }
  // Alta nueva: arranca con la fecha de hoy, igual que Expediente.
  function fechaField(e){
    var iso = e ? ddmmaaaaAIso(e.fecha_inicio) : fechaISO(new Date());
    return '<div class="field" data-campo="fecha_inicio"><label for="f_fecha_inicio">Fecha de inicio<span class="req" aria-hidden="true">*</span></label>'+
      '<input id="f_fecha_inicio" name="fecha_inicio" type="date" aria-required="true" value="'+esc(iso)+'"></div>';
  }

  function hoyLocal(){
    var h = new Date();
    h.setHours(0,0,0,0);
    return h;
  }

  function uid(){ return "exp_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  // ---- Semáforo: plazo administrativo estimado, contado en días hábiles ----
  function esFinDeSemana(f){ var d=f.getDay(); return d===0||d===6; }
  function esFeriado(f){ return FERIADOS.indexOf(fechaISO(f))!==-1; }
  function esHabil(f){ return !esFinDeSemana(f) && !esFeriado(f); }

  // Tope duro: el input de plazo no tiene max, así que un 999999999 pegado de
  // casualidad hacía ~1.450.000.000 iteraciones y congelaba la pestaña.
  var PLAZO_MAX_DIAS = 3650; // 10 años hábiles, de sobra para un trámite

  function calcularFechaFin(fechaInicioLocal, diasPlazo){
    var fecha = new Date(fechaInicioLocal.getTime());
    var contados = 0;
    var tope = Math.min(diasPlazo, PLAZO_MAX_DIAS);
    while(contados < tope){
      fecha.setDate(fecha.getDate()+1);
      if(esHabil(fecha)) contados++;
    }
    return fecha;
  }

  // Número de día (UTC) de una fecha local, para contar sin arrastrar horas.
  function serialDe(f){ return Date.UTC(f.getFullYear(), f.getMonth(), f.getDate())/86400000; }
  // Feriados que caen en día de semana (los que caen sábado/domingo no restan nada).
  var FERIADOS_HABILES = (function(){
    var out = {};
    FERIADOS.forEach(function(iso){
      var q = iso.split("-");
      var ser = Date.UTC(+q[0], +q[1]-1, +q[2])/86400000;
      var dow = (ser+4)%7; // 1970-01-01 fue jueves -> 0=domingo
      if(dow!==0 && dow!==6) out[ser] = 1;
    });
    return out;
  })();
  // Días hábiles en el intervalo (a, b]. Aritmético, no día a día: hay
  // expedientes de 2013 y el bucle costaba miles de vueltas por expediente.
  function diasHabilesEntre(a,b){
    var s1 = serialDe(a), s2 = serialDe(b);
    if(s2 <= s1) return 0;
    var n = s2-s1;
    var habiles = Math.floor(n/7)*5;
    for(var i = Math.floor(n/7)*7+1; i<=n; i++){
      var dow = (s1+i+4)%7;
      if(dow!==0 && dow!==6) habiles++;
    }
    for(var k in FERIADOS_HABILES){
      var f = +k;
      if(f>s1 && f<=s2) habiles--;
    }
    return habiles;
  }

  function calcularPlazo(fechaInicioStr, diasPlazo){
    var inicio = parseFechaLocal(fechaInicioStr);
    if(!inicio) return null;
    inicio.setHours(0,0,0,0);
    var hoy = hoyLocal();
    var fechaFin = calcularFechaFin(inicio, diasPlazo);
    var vencido = fechaFin < hoy;
    // Si el cálculo pisa años sin feriados cargados, el resultado es una
    // estimación optimista (faltan feriados = la fecha sale antes de tiempo).
    // Pasa de los dos lados: un vencimiento más allá del último año cargado,
    // o un expediente que arrancó antes del primero.
    var estimado = fechaFin.getFullYear() > FERIADOS_HASTA_ANIO ||
                   inicio.getFullYear() < FERIADOS_DESDE_ANIO;
    return {
      fechaFin: fechaFin,
      vencido: vencido,
      estimado: estimado,
      venceHoy: fechaFin.getTime()===hoy.getTime(),
      diasRestantes: vencido ? 0 : diasHabilesEntre(hoy, fechaFin),
      diasVencido: vencido ? diasHabilesEntre(fechaFin, hoy) : 0
    };
  }

  function obtenerSemaforo(plazo, umbrales){
    if(plazo.vencido || plazo.venceHoy) return {color:"rojo", orden:0};
    if(plazo.diasRestantes<=umbrales.critico) return {color:"naranja", orden:1};
    if(plazo.diasRestantes<=umbrales.alerta) return {color:"amarillo", orden:2};
    return {color:"verde", orden:3};
  }

  function textoPlazo(plazo){
    var t;
    if(plazo.vencido) t = plazo.diasVencido>0 ? "Vencido hace "+plazo.diasVencido+" d háb." : "Vencido";
    else if(plazo.venceHoy) t = "Vence hoy";
    else t = plazo.diasRestantes+" d háb.";
    return plazo.estimado ? "~"+t : t;
  }

  function avisoEstimado(plazo){
    if(!plazo.estimado) return "";
    return "Estimado: el cálculo pisa años sin feriados cargados (la tabla va de "+
           FERIADOS_DESDE_ANIO+" a "+FERIADOS_HASTA_ANIO+
           "). Faltan feriados, así que la fecha real es igual o posterior a esta.";
  }

  // Única fuente del semáforo: lee el plazo y los umbrales configurados.
  // Devuelve null cuando no se puede calcular (ya resuelto o sin fecha_inicio).
  function urgenciaDe(e){
    if(e.situacion==="Adjudicada" || e.situacion==="Desestimada" || e.archivado) return null; // ya resuelto o archivado, no aplica
    var plazo = calcularPlazo(e.fecha_inicio, state.plazoDias);
    if(!plazo) return null;
    var sem = obtenerSemaforo(plazo, state.umbrales);
    return {color:sem.color, orden:sem.orden, texto:textoPlazo(plazo),
            plazo:plazo, estimado:plazo.estimado, aviso:avisoEstimado(plazo)};
  }

  // Sin tratamiento sin movimiento hace UMBRAL_ARCHIVO_DIAS_HABILES días
  // hábiles se archiva solo. En_tratamiento queda afuera a propósito: "en
  // tratamiento" significa que alguien lo está trabajando, aunque no haya
  // quedado una nota nueva en la app. Se corre al cargar y cada vez que
  // llegan datos nuevos del servidor (no solo al guardar): si nadie abre la
  // app en meses, el archivado igual se aplica la próxima vez que alguien
  // entre, contado contra la fecha de ese momento — no hace falta un cron en
  // el Worker.
  function aplicarArchivadoAutomatico(){
    var hoy = hoyLocal();
    var huboCambios = false;
    state.expedientes.forEach(function(e){
      if(e.archivado) return;
      if(e.situacion!=="Sin_tratamiento") return;
      var mov = parseFechaLocal((e.fecha_ultimo_movimiento||"").split(" ")[0]);
      if(!mov) return;
      if(diasHabilesEntre(mov, hoy) < UMBRAL_ARCHIVO_DIAS_HABILES) return;
      e.archivado = true;
      e.fecha_archivado = horaLocal();
      e.intervenciones = e.intervenciones || [];
      e.intervenciones.push({
        hora: horaLocal(),
        texto: "Archivado automáticamente: superó los 6 meses hábiles sin tratamiento.",
        tipo: "sistema"
      });
      huboCambios = true;
    });
    if(huboCambios) save();
    return huboCambios;
  }

  // Sin datos de ejemplo: si no hay nada local, la lista arranca vacía y la
  // carga real llega del Worker (/api/sync-cartas -> cartas-intencion.json).
  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      var data = JSON.parse(raw);
      return Array.isArray(data) ? data.map(migrarParque) : [];
    }catch(e){ return []; }
  }

  // RDLF pasó a llamarse Rosario (2026-10-20). Se corrige al leer: un dispositivo
  // con la versión vieja en localStorage, o una respuesta del servidor que todavía
  // trae el nombre anterior, no deja un parque que la lista no reconoce.
  function migrarParque(e){
    if(e && e.parque_industrial === "RDLF") e.parque_industrial = "Rosario";
    return e;
  }

  function persistirLocal(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.expedientes)); }catch(e){}
    try{ localStorage.setItem(BORRADOS_KEY, JSON.stringify(state.eliminados)); }catch(e){}
  }

  // ---- Fusión de dos versiones de los datos ----
  // Hace falta porque dos dispositivos pueden escribir sobre la misma base.
  // Antes el último POST pisaba el archivo entero y el trabajo del otro
  // desaparecía sin aviso.
  var LAPIDA_DIAS = 90;

  function cargarBorrados(){
    try{
      var v = JSON.parse(localStorage.getItem(BORRADOS_KEY));
      return Array.isArray(v) ? podarBorrados(v) : [];
    }catch(e){ return []; }
  }
  // Las lápidas no se guardan para siempre: después de 90 días el expediente
  // ya no está en ninguna copia viva y la marca solo ocuparía lugar.
  function podarBorrados(lista){
    var corte = Date.now() - LAPIDA_DIAS*86400000;
    return (lista||[]).filter(function(t){
      return t && t.id && !isNaN(Date.parse(t.en)) && Date.parse(t.en) > corte;
    });
  }
  // Instante del último cambio de un expediente. Los importados de la
  // planilla no tienen marca: cuentan como los más viejos, así que cualquier
  // copia editada les gana.
  function marcaDe(e){
    if(e && e.actualizado_en){
      var t = Date.parse(e.actualizado_en);
      if(!isNaN(t)) return t;
    }
    return 0;
  }

  function fusionar(remoto, local){
    var porId = {};
    (remoto.expedientes||[]).forEach(function(e){ if(e && e.id) porId[e.id] = migrarParque(e); });
    (local.expedientes||[]).forEach(function(e){
      if(!e || !e.id) return;
      var prev = porId[e.id];
      // Sin previo es un alta nuestra; con previo gana el más reciente.
      if(!prev || marcaDe(e) >= marcaDe(prev)) porId[e.id] = migrarParque(e);
    });

    // Las lápidas de los dos lados, quedándose con la más nueva por id.
    var tumbas = {};
    podarBorrados((remoto.eliminados||[]).concat(local.eliminados||[])).forEach(function(t){
      var ya = tumbas[t.id];
      if(!ya || Date.parse(t.en) > Date.parse(ya.en)) tumbas[t.id] = t;
    });
    // Una lápida borra el expediente salvo que alguien lo haya vuelto a
    // editar DESPUÉS de borrarlo (reaparición deliberada).
    Object.keys(tumbas).forEach(function(id){
      var e = porId[id];
      if(e && marcaDe(e) <= Date.parse(tumbas[id].en)) delete porId[id];
    });

    return {
      expedientes: Object.keys(porId).map(function(k){ return porId[k]; }),
      eliminados: Object.keys(tumbas).map(function(k){ return tumbas[k]; })
    };
  }

  // Salir de la demo: los ejemplos que el usuario no tocó se van, y queda
  // marcado para que no vuelvan en la próxima carga.
  function save(){
    persistirLocal();
    marcarPendiente();
  }
  function loadPlazo(){
    try{ var v = parseInt(localStorage.getItem(PLAZO_KEY),10); return (v>0) ? v : 90; }
    catch(e){ return 90; }
  }
  // Plazo y umbrales son configuración: viajan en cada POST, así que un
  // dispositivo con el valor viejo lo volvería a subir. `configSucia` marca
  // que este dispositivo cambió la configuración y todavía no la subió; mientras
  // esté puesto, lo remoto no la pisa (ver adoptarConfigRemota).
  var configSucia = false;
  function savePlazo(v){
    try{ localStorage.setItem(PLAZO_KEY, String(v)); }catch(e){}
    configSucia = true;
    marcarPendiente();
  }
  function loadUmbrales(){
    try{
      var raw = JSON.parse(localStorage.getItem(UMBRAL_KEY));
      return normalizarUmbrales(raw);
    }catch(e){ return {alerta:UMBRAL_DEFAULT.alerta, critico:UMBRAL_DEFAULT.critico}; }
  }
  function normalizarUmbrales(raw){
    var a = raw ? parseInt(raw.alerta,10) : NaN;
    var c = raw ? parseInt(raw.critico,10) : NaN;
    if(isNaN(a) || a<0) a = UMBRAL_DEFAULT.alerta;
    if(isNaN(c) || c<0) c = UMBRAL_DEFAULT.critico;
    if(c>a) a = c; // alerta nunca puede ser más exigente que crítico
    return {alerta:a, critico:c};
  }
  function saveUmbrales(u){
    try{ localStorage.setItem(UMBRAL_KEY, JSON.stringify(u)); }catch(e){}
    configSucia = true;
    marcarPendiente();
  }
  // Adopta el plazo y los umbrales del servidor, salvo que este dispositivo
  // tenga cambios de configuración sin subir (en ese caso gana lo local, que es
  // lo último que el usuario eligió). Antes, el camino del 409 y la primera
  // subida fusionaban expedientes pero no la configuración: un POST con el
  // plazo viejo lo revertía en el servidor.
  function adoptarConfigRemota(datos){
    if(configSucia || !datos) return false;
    var cambio = false;
    var p = Number(datos.plazoDias);
    if(Number.isFinite(p) && p>0 && p!==state.plazoDias){
      state.plazoDias = p;
      try{ localStorage.setItem(PLAZO_KEY, String(p)); }catch(e){}
      cambio = true;
    }
    if(datos.umbrales){
      var u = normalizarUmbrales(datos.umbrales);
      if(u.alerta !== state.umbrales.alerta || u.critico !== state.umbrales.critico){
        state.umbrales = u;
        try{ localStorage.setItem(UMBRAL_KEY, JSON.stringify(u)); }catch(e){}
        cambio = true;
      }
    }
    return cambio;
  }

  // ---- Sync: GitHub-como-base-de-datos detrás del Worker (/api/sync-cartas) ----
  // Guardado local SIEMPRE instantáneo (ya ocurrió arriba, en save()/savePlazo()).
  // La subida real va en background, debounced, y nunca bloquea al usuario.
  var SYNC_PENDING_KEY = "cartas_intencion_sync_pendiente_v2";
  var syncTimer = null, syncEnProgreso = false;
  // Cuenta cada cambio local. Sirve para saber, al terminar un POST, si algo
  // se guardó mientras volaba: en ese caso la marca de pendiente no se borra.
  var cambiosSeq = 0;
  // true cuando ya leímos del servidor y sabemos sobre qué versión escribimos.
  // Sin eso, el POST va con _baseSha null y el Worker no puede detectar un
  // choque: la copia de este dispositivo pisa lo que otro cargó.
  var baseConocida = false;

  // Backoff exponencial. Antes el catch dejaba SYNC_PENDING_KEY en "1" y al
  // final llamaba a subirCambios() de nuevo sin delay: mientras el POST
  // fallara, era un bucle cerrado martillando la red. Ahora cada fallo espera
  // el doble que el anterior, con techo de 60s.
  var DEBOUNCE_MS = 1500;
  var BACKOFF_BASE_MS = 2000;
  var BACKOFF_MAX_MS = 60000;
  var fallosSeguidos = 0;
  var errorPermanente = false; // 4xx: reintentar no lo va a arreglar

  function proximoBackoff(){
    return Math.min(BACKOFF_BASE_MS * Math.pow(2, fallosSeguidos - 1), BACKOFF_MAX_MS);
  }

  function marcarPendiente(){
    cambiosSeq++;
    try{ localStorage.setItem(SYNC_PENDING_KEY, "1"); }catch(e){}
    errorPermanente = false; // hay datos nuevos: vale volver a intentar
    setSyncStatus("pendiente");
    programarSubida(DEBOUNCE_MS);
  }
  function programarSubida(ms){
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){ syncTimer = null; subirCambios(); }, ms);
  }
  function haySyncPendiente(){
    try{ return localStorage.getItem(SYNC_PENDING_KEY) === "1"; }catch(e){ return false; }
  }

  // ---- Estado visible de la sincronización ----
  var alerta = document.getElementById("alertaSync");
  var alertaTitulo = document.getElementById("alertaTitulo");
  var alertaDetalle = document.getElementById("alertaDetalle");

  function setSyncStatus(s, detalle){
    var map = {
      sincronizado: "Al día",
      cargando:     "Cargando…",
      pendiente:    "Hay cambios sin subir",
      subiendo:     "Subiendo cambios…",
      offline:      "Sin conexión",
      error:        "Error de sincronización"
    };
    // Siempre "ok" para el header: esta app ya muestra su propia alerta
    // detallada cuando algo falla, y dos avisos del mismo problema sobran.
    if(window.HeaderGlobal) HeaderGlobal.setSync(map[s] || map.sincronizado, "ok");
    if(s === "error" || s === "offline"){ mostrarAlerta(s, detalle); }
    else { ocultarAlerta(); }
    actualizarSyncBar(); // la fecha de última sync vive arriba del dashboard
  }

  // Momento del último ida y vuelta exitoso con el Worker. Lo muestra el
  // dashboard arriba de todo: sin esto no hay forma de saber qué tan vieja
  // es la foto que estás mirando.
  function marcarSyncOk(){
    try{ localStorage.setItem(SYNC_AT_KEY, new Date().toISOString()); }catch(e){}
  }

  function mostrarAlerta(tipo, detalle){
    if(!alerta) return;
    var SE_REINTENTA = "Tus cambios están guardados en este dispositivo y se van a subir solos cuando se restablezca.";
    var NO_SE_REINTENTA = "Tus cambios están guardados en este dispositivo, pero no se van a subir hasta que esto se corrija.";
    var cola = errorPermanente ? NO_SE_REINTENTA : SE_REINTENTA;
    var cuerpo = detalle ? (detalle.replace(/\s*$/, "").replace(/([^.!?])$/, "$1.") + " ") : "";
    if(tipo === "offline"){
      alertaTitulo.textContent = "Sin conexión — los cambios no se subieron";
    } else {
      alertaTitulo.textContent = errorPermanente
        ? "La sincronización está rechazando los datos"
        : "La sincronización está fallando";
    }
    alertaDetalle.textContent = cuerpo + cola;
    alerta.hidden = false;
  }
  function ocultarAlerta(){ if(alerta) alerta.hidden = true; }

  // El Worker devuelve {error, detalle, hint} en JSON. Antes se descartaba y
  // todo fallo se veía igual: "Sin conexión".
  async function leerError(resp){
    var partes = [];
    try{
      var cuerpo = await resp.json();
      if(cuerpo && cuerpo.error) partes.push(cuerpo.error);
      if(cuerpo && cuerpo.detalle) partes.push(cuerpo.detalle);
      else if(cuerpo && cuerpo.hint) partes.push(cuerpo.hint);
    }catch(e){}
    if(!partes.length) partes.push("El servidor respondió "+resp.status+".");
    return partes.join(" — ");
  }

  // Lee el servidor y fusiona lo local con lo remoto ANTES de subir. Lo que
  // hay en localStorage puede ser una copia vieja (la app se abrió sin red,
  // o quedó una marca de sesión anterior): subirla tal cual pisaría cargas
  // hechas en otro dispositivo. La fusión conserva lo más reciente de cada
  // lado, igual que el 409.
  async function tomarBase(){
    var resp = await HeaderGlobal.fetchApi("/api/sync-cartas");
    if(!resp.ok) throw new Error(await leerError(resp));
    var remoto = await resp.json();
    if(!remoto || !Array.isArray(remoto.expedientes)){
      throw new Error("El servidor devolvió datos con una forma inesperada.");
    }
    var existe = !(remoto._meta && remoto._meta.existe === false);
    if(existe){
      var fus = fusionar(remoto, {expedientes: state.expedientes, eliminados: state.eliminados});
      state.expedientes = fus.expedientes;
      state.eliminados = fus.eliminados;
      adoptarConfigRemota(remoto);
      persistirLocal();
      renderList();
    }
    state.baseSha = (remoto._meta && remoto._meta.sha) || null;
    ultimaVersion = state.baseSha;
    baseConocida = true;
  }

  async function subirCambios(){
    if(syncEnProgreso || !haySyncPendiente() || errorPermanente) return;
    syncEnProgreso = true;
    setSyncStatus("subiendo");
    var seqEnviado = cambiosSeq; // lo que este POST realmente lleva
    try{
      if(!baseConocida) await tomarBase();
      var resp = await HeaderGlobal.fetchApi("/api/sync-cartas", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          expedientes: state.expedientes, plazoDias: state.plazoDias,
          umbrales: state.umbrales, eliminados: state.eliminados,
          _baseSha: state.baseSha
        })
      });

      // 409: otro dispositivo escribió sobre la misma base. No es un error
      // del usuario ni algo que reintentar igual: se fusiona con lo que hay
      // y se vuelve a mandar sobre el sha nuevo.
      if(resp.status === 409){
        var choque = null;
        try{ choque = await resp.json(); }catch(e){}
        var remoto = choque && choque.actual;
        if(remoto && Array.isArray(remoto.expedientes)){
          var fus = fusionar(remoto, {expedientes: state.expedientes, eliminados: state.eliminados});
          state.expedientes = fus.expedientes;
          state.eliminados = fus.eliminados;
          adoptarConfigRemota(remoto);
          state.baseSha = remoto._meta ? remoto._meta.sha : null;
          ultimaVersion = state.baseSha;
          persistirLocal();
          renderList();
          if(!viewDash.hidden) renderDashboard();
          console.warn("[sync] conflicto resuelto por fusión; reintentando sobre el sha nuevo");
          syncEnProgreso = false;
          programarSubida(0); // la bandera de pendiente sigue puesta
          return;
        }
        throw new Error("Conflicto con otro dispositivo y no se pudo fusionar. Recargá la página.");
      }

      if(!resp.ok){
        var msg = await leerError(resp);
        // 4xx (salvo 429) es culpa del payload o de la configuración:
        // reintentar en loop no lo arregla y oculta el problema.
        if(resp.status >= 400 && resp.status < 500 && resp.status !== 429){
          errorPermanente = true;
        }
        throw new Error(msg);
      }
      // El Worker devuelve el sha nuevo del archivo y el commit que lo
      // creó. Guardar los dos evita el viaje de vuelta: sin el sha el
      // siguiente POST chocaría contra nuestra propia escritura, y sin el
      // commit el polling se bajaría lo que acabamos de subir.
      try{
        var ok = await resp.json();
        if(ok && ok.sha){ state.baseSha = ok.sha; ultimaVersion = ok.sha; }
      }catch(e){}
      // Solo se limpia si nada cambió durante el vuelo. Antes se borraba
      // siempre: la carga hecha mientras subía quedaba sin marca, nunca se
      // enviaba, y la siguiente descarga la pisaba en el dispositivo.
      if(cambiosSeq === seqEnviado){
        try{ localStorage.removeItem(SYNC_PENDING_KEY); }catch(e){}
        configSucia = false; // lo que se mandó era todo lo que había
      }
      fallosSeguidos = 0;
      marcarSyncOk();
      setSyncStatus(haySyncPendiente() ? "pendiente" : "sincronizado");
    }catch(e){
      fallosSeguidos++;
      var sinRed = (typeof navigator !== "undefined" && navigator.onLine === false);
      setSyncStatus(sinRed ? "offline" : "error", String(e.message || e));
      if(!errorPermanente){
        var espera = proximoBackoff();
        console.warn("[sync] intento "+fallosSeguidos+" falló; reintento en "+(espera/1000)+"s:", e.message||e);
        programarSubida(espera);
      } else {
        console.error("[sync] error permanente, no se reintenta:", e.message||e);
      }
      syncEnProgreso = false;
      return;
    }
    syncEnProgreso = false;
    // Llegó algo nuevo mientras el POST estaba en vuelo: lo mandamos, pero
    // agendado, no por recursión inmediata.
    if(haySyncPendiente()) programarSubida(DEBOUNCE_MS);
  }

  async function bajarCambiosIniciales(){
    if(haySyncPendiente()){
      // hay cambios locales sin subir: los subimos primero, nunca pisamos trabajo no sincronizado
      programarSubida(0);
      return;
    }
    setSyncStatus("cargando");
    try{
      var resp = await HeaderGlobal.fetchApi("/api/sync-cartas");
      if(!resp.ok) throw new Error(await leerError(resp));
      var datos = await resp.json();
      if(!datos || !Array.isArray(datos.expedientes)){
        throw new Error("El servidor devolvió datos con una forma inesperada.");
      }

      // Durante la espera del GET pudo haber una edición local. Antes la
      // respuesta pisaba el estado en memoria y en localStorage mientras la
      // bandera de pendiente seguía puesta: la edición se perdía y lo que se
      // subía era la versión remota sin ella. Ahora se fusiona lo remoto con lo
      // local (igual que el 409) y se sube sobre el sha nuevo.
      if(haySyncPendiente()){
        var fusAhora = fusionar(datos, {expedientes: state.expedientes, eliminados: state.eliminados});
        state.expedientes = fusAhora.expedientes;
        state.eliminados = fusAhora.eliminados;
        adoptarConfigRemota(datos);
        state.baseSha = (datos._meta && datos._meta.sha) || null;
        ultimaVersion = state.baseSha;
        baseConocida = true;
        persistirLocal();
        renderList();
        programarSubida(0);
        return;
      }

      // plazoDias se adopta por su cuenta. Antes estaba anidado dentro del if
      // de expedientes, así que cambiar solo el plazo nunca llegaba a otro
      // dispositivo.
      var cambio = false;
      var plazoRemoto = Number(datos.plazoDias);
      if(Number.isFinite(plazoRemoto) && plazoRemoto > 0 && plazoRemoto !== state.plazoDias){
        state.plazoDias = plazoRemoto;
        try{ localStorage.setItem(PLAZO_KEY, String(state.plazoDias)); }catch(e){}
        cambio = true;
      }

      // Los umbrales viajan igual que el plazo: por su cuenta, fuera del if
      // de expedientes, para que cambiar solo la configuración del semáforo
      // llegue a los demás dispositivos.
      if(datos.umbrales){
        var uRemotos = normalizarUmbrales(datos.umbrales);
        if(uRemotos.alerta !== state.umbrales.alerta || uRemotos.critico !== state.umbrales.critico){
          state.umbrales = uRemotos;
          try{ localStorage.setItem(UMBRAL_KEY, JSON.stringify(state.umbrales)); }catch(e){}
          cambio = true;
        }
      }

      // Si datos.json existe, el repo es la fuente de verdad — incluso con
      // cero expedientes. Antes un repo vacío se ignoraba y la demo local
      // sobrevivía para después subirse.
      var repoInicializado = !(datos._meta && datos._meta.existe === false);
      if(repoInicializado){
        state.expedientes = (datos.expedientes||[]).map(migrarParque);
        state.eliminados = podarBorrados(datos.eliminados);
        persistirLocal();
        cambio = true;
      }
      // El sha sobre el que quedamos trabajando: es lo que el próximo POST
      // devuelve para que el Worker detecte si alguien escribió en el medio.
      // El sha sobre el que quedamos trabajando, y a la vez la versión que
      // el sondeo va a comparar: /api/version-cartas devuelve exactamente este
      // mismo número, así que no hace falta ninguna lectura de referencia.
      state.baseSha = (datos._meta && datos._meta.sha) || null;
      ultimaVersion = state.baseSha;
      baseConocida = true;

      // Re-chequear el archivado automático contra los datos recién bajados:
      // si otro dispositivo cargó este expediente hace rato y nadie abrió la
      // app desde entonces, el umbral se cumple contra la fecha de HOY, no
      // contra cuando se sincronizó por última vez.
      if(aplicarArchivadoAutomatico()) cambio = true;

      if(cambio){
        renderList();
        if(!viewArchivo.hidden) renderArchivo();
      }
      fallosSeguidos = 0;
      marcarSyncOk();
      setSyncStatus("sincronizado");
      if(!viewDash.hidden) renderDashboard();
    }catch(e){
      fallosSeguidos++;
      var sinRed = (typeof navigator !== "undefined" && navigator.onLine === false);
      setSyncStatus(sinRed ? "offline" : "error", String(e.message || e));
      console.warn("[sync] no se pudieron bajar los datos:", e.message||e);
    }
  }

  // Los datos solo se bajaban al abrir la app, asi que los cambios hechos en
  // otro dispositivo no aparecian hasta recargar entera — mientras el cartel
  // decia "Sincronizado". Ahora tambien se refresca al volver a la pestaña.
  var ultimoRefresco = Date.now();
  var REFRESCO_MIN_MS = 30000;
  function refrescarSiCorresponde(){
    if(document.hidden) return;
    if(!veil.hidden) return;                 // modal abierto: no le muevas el piso
    if(haySyncPendiente()) return;
    if(Date.now() - ultimoRefresco < REFRESCO_MIN_MS) return;
    ultimoRefresco = Date.now();
    bajarCambiosIniciales();
    cargarDevueltos();
  }
  document.addEventListener("visibilitychange", function(){
    refrescarSiCorresponde();
    // Volver a la pestaña no debería esperar hasta 25 s para notar un cambio.
    if(!document.hidden) programarPoll(1000);
  });
  window.addEventListener("focus", refrescarSiCorresponde);

  // ---- Sondeo de versión: lo más parecido a tiempo real sin infraestructura ----
  // /api/version-cartas devuelve solo el sha del último commit que tocó datos.json
  // (~2 KB), así que preguntarlo seguido sale barato. Recién cuando cambia se
  // baja el archivo. Antes los cambios de otro dispositivo no aparecían hasta
  // cambiar de pestaña o recargar.
  var POLL_MS = 25000;
  var ultimaVersion = null;
  var pollTimer = null;

  function programarPoll(ms){
    if(pollTimer) clearTimeout(pollTimer);
    pollTimer = setTimeout(function(){ pollTimer = null; sondearVersion(); }, ms==null?POLL_MS:ms);
  }

  async function sondearVersion(){
    // Las mismas guardas que el refresco al volver a la pestaña: no se le
    // mueve el piso a alguien que está escribiendo, y lo nuestro sube antes
    // de traer lo de afuera.
    var puede = !document.hidden && veil.hidden && !haySyncPendiente() && !syncEnProgreso;
    if(puede){
      try{
        var r = await HeaderGlobal.fetchApi("/api/version-cartas");
        if(r.ok){
          var v = await r.json();
          // Se compara contra el sha de lo que REALMENTE tenemos cargado, no
          // contra una referencia tomada al vuelo. Si no sabemos qué tenemos
          // (ultimaVersion null), bajamos: es más barato que quedarse viejo.
          if(v && v.version && v.version !== ultimaVersion){
            ultimoRefresco = Date.now();
            await bajarCambiosIniciales();   // alguien más escribió
          }
        }
      }catch(e){ /* sin red: el próximo ciclo reintenta */ }
    }
    programarPoll();
  }

  function reintentarAhora(){
    errorPermanente = false;
    fallosSeguidos = 0;
    if(haySyncPendiente()) programarSubida(0);
    else bajarCambiosIniciales();
  }
  var btnReintentar = document.getElementById("alertaReintentar");
  if(btnReintentar) btnReintentar.addEventListener("click", reintentarAhora);

  // Volvió la red: no esperamos el backoff completo.
  if(typeof window !== "undefined" && window.addEventListener){
    window.addEventListener("online", function(){
      if(haySyncPendiente()){ fallosSeguidos = 0; programarSubida(0); }
    });
  }

  var state = {
    expedientes: load(), editingId: null, modalMode: null,
    filterParque:"", filterRubro:"", filterSituacion:"", filterPlazo:"", search:"",
    plazoDias: loadPlazo(), umbrales: loadUmbrales(),
    eliminados: cargarBorrados(), baseSha: null,
    // dashboard: sección activa, rankings desplegados y panel de detalle abierto
    dashSection: "resumen", verTodos: {}, drill: null, drillEmpresa: null, metricas: null
  };

  // ---- Tabs / routing ----
  var tabList = document.getElementById("tabList"), tabDash = document.getElementById("tabDash"), tabArchivo = document.getElementById("tabArchivo");
  var viewList = document.getElementById("viewList"), viewDash = document.getElementById("viewDash"), viewArchivo = document.getElementById("viewArchivo");
  var vistaActual = "list";
  function vistaDeHash(h){ return h==="#dashboard" ? "dashboard" : h==="#archivo" ? "archivo" : "list"; }
  function hashDeVista(name){ return name==="dashboard" ? "#dashboard" : name==="archivo" ? "#archivo" : "#listado"; }
  function showView(name, desdeHash){
    var isDash = name==="dashboard", isArchivo = name==="archivo";
    vistaActual = name;
    viewList.hidden = isDash || isArchivo;
    viewArchivo.hidden = !isArchivo;
    viewDash.hidden = !isDash;
    tabList.classList.toggle("active", !isDash && !isArchivo);
    tabArchivo.classList.toggle("active", isArchivo);
    tabDash.classList.toggle("active", isDash);
    tabList.setAttribute("aria-selected", String(!isDash && !isArchivo));
    tabArchivo.setAttribute("aria-selected", String(isArchivo));
    tabDash.setAttribute("aria-selected", String(isDash));
    document.getElementById("busquedaListado").hidden = isDash;
    if(isDash) renderDashboard();
    if(isArchivo) renderArchivo();
    if(desdeHash) return; // vino del hash: no lo reescribas, sería un bucle
    var destino = hashDeVista(name);
    if(location.hash !== destino) location.hash = destino;
  }
  tabList.addEventListener("click", function(){ showView("list"); });
  tabArchivo.addEventListener("click", function(){ showView("archivo"); });
  tabDash.addEventListener("click", function(){ showView("dashboard"); });

  // Sin esto, el botón "atrás" del navegador cambiaba la URL y dejaba la
  // vista como estaba.
  // Con la ficha abierta, el atrás no puede cambiar la vista a ciegas: pasa
  // por la misma pregunta que la ×. Si se elige «Seguir editando», el hash
  // vuelve a la vista que se ve (si no, la URL y la pantalla no coinciden).
  window.addEventListener("hashchange", function(){
    var vista = vistaDeHash(location.hash);
    if(vista === vistaActual) return;
    if(veil.hidden){ showView(vista, true); return; }
    intentarSalir(function(){ closeModal(); showView(vista, true); }, {
      alGuardar: function(){ showView(vista, true); },
      alSeguir: function(){ location.hash = hashDeVista(vistaActual); }
    });
  });

  // ---- Filtros ----
  // Los filtros avanzados viven en un panel desplegable. Cerrado, el botón
  // muestra cuántos están puestos, así no se pierde un filtro activo.
  var filtrosToggle = document.getElementById("filtrosToggle");
  var filtrosPanel = document.getElementById("filtrosPanel");
  function abrirFiltros(abrir){
    filtrosPanel.hidden = !abrir;
    filtrosToggle.setAttribute("aria-expanded", String(abrir));
    filtrosToggle.classList.toggle("active", abrir);
  }
  function pintarFiltrosActivos(){
    var n = [state.filterParque, state.filterRubro, state.filterSituacion, state.filterPlazo].filter(Boolean).length;
    var marca = document.getElementById("filtrosN");
    marca.hidden = !n;
    marca.textContent = n;
  }
  filtrosToggle.addEventListener("click", function(){ abrirFiltros(filtrosPanel.hidden); });

  var selParque = document.getElementById("filterParque");
  PARQUES.forEach(function(p){ var o=document.createElement("option"); o.value=p; o.textContent=p; selParque.appendChild(o); });
  var selRubro = document.getElementById("filterRubro");
  RUBROS.forEach(function(r){ var o=document.createElement("option"); o.value=r; o.textContent=r; selRubro.appendChild(o); });
  selParque.addEventListener("change", function(){ state.filterParque=this.value; renderList(); });
  selRubro.addEventListener("change", function(){ state.filterRubro=this.value; renderList(); });
  document.getElementById("filterSituacion").addEventListener("change", function(){ state.filterSituacion=this.value; renderList(); });
  document.getElementById("filterPlazo").addEventListener("change", function(){ state.filterPlazo=this.value; renderList(); });
  document.getElementById("search").addEventListener("input", function(){
    state.search=this.value.toLowerCase();
    // Filtra la pestaña que se ve. La otra se rearma al abrirse (showView).
    if(vistaActual==="archivo") renderArchivo(); else renderList();
  });

  // Mismo criterio para el listado y el archivo: nombre, actividad, número
  // y representante. Concatenar directo metía la cadena "undefined" en el
  // blob cuando faltaba un campo, así que buscar "undefined" matcheaba
  // registros incompletos.
  function coincideBusqueda(e){
    if(!state.search) return true;
    var blob = [e.nombre_empresa, e.actividad_empresa, e.nro_expediente, e.representante_nombre]
      .filter(Boolean).join(" ").toLowerCase();
    return blob.indexOf(state.search)!==-1;
  }

  function expedientesFiltrados(){
    return state.expedientes.filter(function(e){
      if(e.archivado) return false; // viven en la pestaña Archivo, no acá
      if(state.filterParque && e.parque_industrial!==state.filterParque) return false;
      if(state.filterRubro && e.rubro!==state.filterRubro) return false;
      if(state.filterSituacion && e.situacion!==state.filterSituacion) return false;
      if(state.filterPlazo){
        // "sinfecha" son los que todavía corren plazo pero no se les puede
        // calcular: hoy estaban invisibles, no salían en ninguna vista.
        var resuelto = e.situacion==="Adjudicada" || e.situacion==="Desestimada";
        var u = urgenciaDe(e);
        if(state.filterPlazo==="sinfecha"){
          if(resuelto || u) return false;
        } else if(!u || u.color!==state.filterPlazo){
          return false;
        }
      }
      return coincideBusqueda(e);
    });
  }

  // Número más chico = más urgente. Rojo: días vencidos en negativo, así que
  // el más vencido queda primero.
  function claveDentroDeColor(u){
    if(!u) return 0;
    return u.plazo.vencido ? -u.plazo.diasVencido : u.plazo.diasRestantes;
  }

  // ---- Listado (tarjetas: frente = nro + empresa, el resto al abrir) ----
  function renderList(){
    var cont = document.getElementById("expList");
    var filtrados = expedientesFiltrados().map(function(e){
      return {e:e, urg: urgenciaDe(e)};
    });

    var cuenta = document.getElementById("listCount");
    // No cuenta los archivados: viven en su propia pestaña, no son parte de
    // "este listado" ni para el total ni para "N de M".
    var totalActivos = state.expedientes.filter(function(e){return !e.archivado;}).length;
    if(cuenta){
      var hayFiltro = !!(state.filterParque || state.filterRubro || state.filterSituacion ||
                         state.filterPlazo || state.search);
      cuenta.textContent = !totalActivos ? ""
        : hayFiltro ? (filtrados.length + " de " + totalActivos + " expediente" + (totalActivos===1?"":"s"))
                    : (totalActivos + " expediente" + (totalActivos===1?"":"s"));
    }
    pintarFiltrosActivos();
    // Contador en el chip de cada pestaña (no en "Análisis": no es un
    // listado, no tiene una cantidad de ítems que mostrar). El de Archivo
    // se actualiza acá, no en renderArchivo(), porque esa función solo
    // corre cuando la pestaña está visible (listado grande, render diferido)
    // y el chip tiene que reflejar el total aunque no se haya visitado.
    tabList.innerHTML = 'Listado <span class="count">'+totalActivos+'</span>';
    var totalArchivados = state.expedientes.filter(function(e){ return e.archivado; }).length;
    tabArchivo.innerHTML = 'Archivo <span class="count">'+totalArchivados+'</span>';
    // Dentro de cada color, lo más urgente primero: en rojo, el que más días
    // hábiles lleva vencido; en los demás, el que menos días le quedan. Sin
    // esto el rojo mezclaba un vencido hace un mes con uno de hace seis años.
    filtrados.sort(function(a,b){
      var oa = a.urg ? a.urg.orden : 9, ob = b.urg ? b.urg.orden : 9;
      return (oa - ob) || (claveDentroDeColor(a.urg) - claveDentroDeColor(b.urg));
    });
    if(!filtrados.length){
      var vacio = totalActivos
        ? "Sin expedientes que coincidan con el filtro."
        : "Todavía no hay expedientes cargados. Tocá « + Nuevo Proyecto » para empezar.";
      cont.innerHTML = '<div class="empty-state">'+esc(vacio)+'</div>';
      return;
    }
    cont.innerHTML = filtrados.map(function(x){ return expCardHtml(x.e, x.urg); }).join("");
  }

  // ---- Archivo: Sin tratamiento sin movimiento en 6 meses hábiles
  // (aplicarArchivadoAutomatico). Ordenado por fecha de archivado, más
  // reciente primero — igual criterio que "Archivados" en Seguimiento.
  function renderArchivo(){
    var cont = document.getElementById("archivoList");
    var total = state.expedientes.filter(function(e){ return e.archivado; }).length;
    var lista = state.expedientes.filter(function(e){ return e.archivado && coincideBusqueda(e); });
    lista.sort(function(a,b){ return claveFechaHora(b.fecha_archivado).localeCompare(claveFechaHora(a.fecha_archivado)); });

    // Con búsqueda puesta, "N de M" como en el listado: se ve cuánto quedó.
    var cuenta = document.getElementById("archivoCount");
    if(cuenta){
      var palabras = "expediente" + (total===1?"":"s") + " archivado" + (total===1?"":"s");
      cuenta.textContent = !total ? ""
        : state.search ? (lista.length + " de " + total + " " + palabras)
        : (total + " " + palabras);
    }
    if(!lista.length){
      cont.innerHTML = '<div class="empty-state">'+ (total && state.search
        ? 'Ningún expediente archivado coincide con la búsqueda.'
        : 'No hay expedientes archivados. Sin tratamiento se archiva solo a los 6 meses hábiles sin ningún movimiento.') +
        '</div>';
      return;
    }
    cont.innerHTML = lista.map(function(e){
      return expCardHtml(e, null, "Archivado el "+((e.fecha_archivado||"").split(" ")[0]));
    }).join("");
  }

  // La misma tarjeta del listado se reutiliza en los detalles del dashboard.
  // subExtra es una línea opcional (p.ej. el vencimiento en el semáforo).
  // Orden fijo: empresa, N° de expediente, vencimiento (y situación), y al pie
  // el parque y el rubro.
  // Orden fijo: empresa, N° de expediente, parque · rubro, situación y, al
  // final, el vencimiento (con el detalle que trae el dashboard, si lo hay).
  function expCardHtml(e, urg, subExtra){
    var sub = [e.parque_industrial, e.rubro].filter(Boolean).join(" · ");
    return '<button class="exp-card" data-open="'+esc(e.id)+'">'+
      '<div class="exp-card-main">'+
        '<div class="exp-card-empresa">'+esc(e.nombre_empresa||"(sin nombre de empresa)")+'</div>'+
        '<div class="exp-card-exp">'+esc(e.nro_expediente||"s/n")+'</div>'+
        (sub?'<div class="exp-card-sub">'+esc(sub)+'</div>':'')+
        '<div class="exp-estado">'+
          '<span class="exp-sit '+(SIT_BADGE[e.situacion]||"b-idle")+'">'+esc(labelSituacion(e.situacion))+'</span>'+
        '</div>'+
        (urg?'<div class="exp-estado">'+
          '<span class="exp-plazo c-'+urg.color+'"'+(urg.aviso?' title="'+esc(urg.aviso)+'"':'')+
          '><i class="exp-dot"></i>'+esc(urg.texto)+'</span>'+
        '</div>':'')+
        (devueltoDe(e)?'<div class="exp-card-sub">'+esc(leyendaDevuelto(devueltoDe(e)))+'</div>':'')+
        (subExtra?'<div class="exp-card-sub">'+esc(subExtra)+'</div>':'')+
      '</div>'+
      '</button>';
  }

  // Un solo handler para todas las tarjetas, estén en el listado o en un
  // panel de detalle del dashboard.
  document.addEventListener("click", function(ev){
    var card = ev.target.closest && ev.target.closest("[data-open]");
    if(card) openModal(card.getAttribute("data-open"));
  });

  // ======================= DASHBOARD =======================
  // Regla de la vista: cada cifra se calcula UNA sola vez, acá, en
  // calcularMetricas(). Las secciones solo leen de state.metricas; si una
  // necesita un número de otra (p.ej. la tasa general como línea de
  // referencia por parque) lo referencia, no lo vuelve a calcular.

  var DASH_SECCIONES = [
    {id:"resumen",   label:"Resumen"},
    {id:"situacion", label:"Situación"},
    {id:"parques",   label:"Parques"},
    {id:"rubros",    label:"Rubros"},
    {id:"urgencias", label:"Urgencias"}
  ];
  var TOP_N = 5;           // rankings: top 5 + "Ver todos"
  var MUESTRA_CHICA = 5;   // menos de 5 expedientes: no comparable de igual a igual
  var TOP_URGENTES = 10;

  function nf(n){ return Number(n||0).toLocaleString("es-AR"); }
  function nfm2(n){ return Math.round(Number(n)||0).toLocaleString("es-AR")+" m²"; }
  function pct1(fr){
    return (fr*100).toLocaleString("es-AR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
  }
  function pct0(fr){
    return (fr*100).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0})+"%";
  }
  function claveEmpresa(nombre){
    return String(nombre||"").trim().toLowerCase().replace(/\s+/g," ").replace(/\.$/,"");
  }
  function tieneSuperficie(e){
    var v = e.superficie_solicitada_m2;
    if(v==="" || v==null) return false;
    var n = Number(v);
    return !isNaN(n) && n>0;
  }

  function calcularMetricas(){
    var list = state.expedientes;
    var m = {
      total: list.length,
      porSituacion: {}, otraSituacion: 0, adjudicadas: 0, tasaGeneral: 0,
      m2: {suma:0, conDato:0, sinDato:0},
      empresas: {distintas:0, conVarias:0, cartasDeRepetidas:0, sinNombre:0},
      parques: [], rubros: [], empresasIdx: {},
      porAnio: {}, anios: [], ordenParques: [],
      urg: {items:[], conteo:{rojo:0,naranja:0,amarillo:0,verde:0}, sinFecha:0, noAplica:0},
      sinParque: 0, sinRubro: 0, sinFechaAnual: 0, anualAproximado: 0, ultimoMovimiento: null
    };
    SITUACIONES.forEach(function(s){ m.porSituacion[s.id] = 0; });

    var porParque = {}, porRubro = {}, empresas = {};

    list.forEach(function(e){
      // -- situación --
      if(m.porSituacion[e.situacion]!=null) m.porSituacion[e.situacion]++;
      else m.otraSituacion++;
      var esAdj = e.situacion==="Adjudicada";
      if(esAdj) m.adjudicadas++;

      // -- superficie: vacío NO es cero. Se excluye de la suma y se cuenta aparte --
      var conSup = tieneSuperficie(e);
      var sup = conSup ? Number(e.superficie_solicitada_m2) : 0;
      if(conSup){ m.m2.suma += sup; m.m2.conDato++; } else { m.m2.sinDato++; }

      // -- parque --
      var p = e.parque_industrial || SIN_PARQUE;
      if(!e.parque_industrial) m.sinParque++;
      if(!porParque[p]) porParque[p] = {nombre:p, solicitudes:0, adjudicadas:0, m2:0, m2ConDato:0, m2SinDato:0};
      var sp = porParque[p];
      sp.solicitudes++;
      if(esAdj) sp.adjudicadas++;
      if(conSup){ sp.m2 += sup; sp.m2ConDato++; } else { sp.m2SinDato++; }

      // -- rubro --
      var r = e.rubro || "(sin rubro)";
      if(!e.rubro) m.sinRubro++;
      if(!porRubro[r]) porRubro[r] = {nombre:r, solicitudes:0, claves:{}};
      porRubro[r].solicitudes++;

      // -- empresa: la misma empresa puede presentar más de una carta --
      var clave = claveEmpresa(e.nombre_empresa);
      if(clave){
        porRubro[r].claves[clave] = 1;
        if(!empresas[clave]) empresas[clave] = {nombre:e.nombre_empresa, cartas:[]};
        empresas[clave].cartas.push(e);
      } else {
        m.empresas.sinNombre++;
      }

      // -- año de presentación (evolución por parque) --
      // Si no hay fecha_inicio, se cae a anio_inicio_expediente, que viene de
      // la planilla y lo tienen los 24 expedientes sin fecha. Antes ese campo
      // no se usaba en ningún lado y esos 24 desaparecían del gráfico.
      var d = parseFechaLocal(e.fecha_inicio);
      var anio = null, aproximado = false;
      if(d){
        anio = d.getFullYear();
      } else if(/^\d{4}$/.test(String(e.anio_inicio_expediente||""))){
        anio = parseInt(e.anio_inicio_expediente, 10);
        aproximado = true;
      }
      if(anio !== null){
        m.porAnio[anio] = m.porAnio[anio] || {};
        m.porAnio[anio][p] = (m.porAnio[anio][p]||0) + 1;
        if(aproximado) m.anualAproximado++;
      } else {
        m.sinFechaAnual++; // ni fecha ni año: el gráfico lo declara
      }

      var mov = parseFechaLocal((e.fecha_ultimo_movimiento||"").split(" ")[0]);
      if(mov && (!m.ultimoMovimiento || mov>m.ultimoMovimiento)) m.ultimoMovimiento = mov;

      // -- semáforo: solo expedientes que todavía corren plazo --
      if(e.situacion==="Adjudicada" || e.situacion==="Desestimada"){
        m.urg.noAplica++;
      } else {
        var u = urgenciaDe(e);
        if(u){ m.urg.items.push({e:e, urg:u}); m.urg.conteo[u.color]++; }
        else m.urg.sinFecha++; // sin fecha_inicio cargada: no se puede calcular
      }
    });

    m.tasaGeneral = m.total ? m.adjudicadas/m.total : 0;

    m.parques = Object.keys(porParque).map(function(k){
      var p = porParque[k];
      p.tasa = p.solicitudes ? p.adjudicadas/p.solicitudes : 0;
      p.muestraChica = p.solicitudes < MUESTRA_CHICA;
      return p;
    });

    m.rubros = Object.keys(porRubro).map(function(k){
      var r = porRubro[k];
      return {nombre:r.nombre, solicitudes:r.solicitudes,
              empresas:Object.keys(r.claves).length, claves:Object.keys(r.claves)};
    }).sort(function(a,b){
      return b.solicitudes-a.solicitudes || a.nombre.localeCompare(b.nombre,"es");
    });

    m.empresasIdx = empresas;
    var claves = Object.keys(empresas);
    m.empresas.distintas = claves.length;
    claves.forEach(function(c){
      if(empresas[c].cartas.length>1){
        m.empresas.conVarias++;
        m.empresas.cartasDeRepetidas += empresas[c].cartas.length;
      }
    });

    m.anios = Object.keys(m.porAnio).sort();
    // orden de apilado/leyenda: los parques conocidos primero, en su orden fijo
    m.ordenParques = PARQUES.concat(Object.keys(porParque).filter(function(p){
      return PARQUES.indexOf(p)===-1;
    }));

    m.urg.items.sort(function(a,b){
      if(a.urg.orden!==b.urg.orden) return a.urg.orden-b.urg.orden;
      var pa = a.urg.plazo, pb = b.urg.plazo;
      if(pa.vencido && pb.vencido) return pb.diasVencido-pa.diasVencido;
      return pa.diasRestantes-pb.diasRestantes;
    });

    return m;
  }

  // ---- Piezas reutilizables ----
  function tile(num, label, hint, cls){
    return '<div class="tile"><div class="num '+(cls||"")+'">'+esc(num)+'</div>'+
      '<div class="label">'+esc(label)+'</div>'+
      (hint?'<div class="hint">'+hint+'</div>':'')+'</div>';
  }
  function src(html){ return '<p class="src">'+html+'</p>'; }
  function note(html, plain){ return '<div class="note'+(plain?" plain":"")+'">'+html+'</div>'; }

  // Fila de métrica. opts: {max, color, valor, sub, foot, drill, sel, chica, ref}
  function mrow(nombre, opts){
    var max = opts.max || 1;
    var ancho = Math.max(2, Math.round((opts.magnitud/max)*100));
    var tag = opts.chica ? '<span class="tag-chica">muestra chica</span>' : '';
    var refLn = (opts.ref!=null)
      ? '<div class="mrow-ref" style="left:'+Math.min(100,Math.max(0,(opts.ref/max)*100))+'%"></div>' : '';
    var inner =
      '<div class="mrow-top">'+
        '<span class="mrow-name">'+esc(nombre)+tag+'</span>'+
        '<span class="mrow-val">'+opts.valor+'</span>'+
      '</div>'+
      '<div class="mrow-track"><div class="mrow-fill" style="width:'+ancho+'%'+
        (opts.color?';background:'+opts.color:'')+'"></div>'+refLn+'</div>'+
      (opts.foot?'<div class="mrow-foot">'+opts.foot+'</div>':'');
    var cls = "mrow"+(opts.chica?" chica":"")+(opts.sel?" sel":"");
    if(opts.drill){
      return '<button type="button" class="'+cls+'" data-drill="'+esc(opts.drill[0])+'" '+
        'data-valor="'+esc(opts.drill[1])+'">'+inner+'</button>';
    }
    return '<div class="'+cls+'">'+inner+'</div>';
  }

  function verTodos(key, totalFilas){
    if(totalFilas<=TOP_N) return "";
    var abierto = !!state.verTodos[key];
    return '<button type="button" class="ver-todos" data-vertodos="'+esc(key)+'">'+
      (abierto ? "Ver solo el top "+TOP_N : "Ver todos ("+totalFilas+")")+'</button>';
  }
  function recorte(key, filas){
    return state.verTodos[key] ? filas : filas.slice(0, TOP_N);
  }

  // ---- Panel de detalle: reutiliza la tarjeta del listado principal ----
  function drillPanel(titulo, items, vacio){
    return '<div class="drill">'+
      '<div class="drill-head"><h4>'+esc(titulo)+' <span class="n">'+items.length+' expediente'+(items.length===1?"":"s")+'</span></h4>'+
      '<button type="button" class="drill-close" data-drillclose="1">Cerrar</button></div>'+
      (items.length
        ? '<div class="drill-scroll"><div class="exp-list">'+items.map(function(e){
            return expCardHtml(e, urgenciaDe(e));
          }).join("")+'</div></div>'
        : '<div class="empty-state">'+esc(vacio||"Sin expedientes.")+'</div>')+
      '</div>';
  }
  function drillActivo(tipo, valor){
    return state.drill && state.drill.tipo===tipo && state.drill.valor===valor;
  }

  // ---- Secciones ----
  function secResumen(m){
    var tileM2 = m.m2.conDato
      ? tile(nfm2(m.m2.suma), "Superficie total solicitada",
          'Suma de <b>superficie_solicitada_m2</b> sobre los <b>'+m.m2.conDato+'</b> expedientes que tienen el dato cargado.',
          "sm")
      : tile("Sin datos", "Superficie total solicitada",
          'Ningún expediente tiene <b>superficie_solicitada_m2</b> cargada.', "na");

    var html = '<div class="summary">'+
      tile(nf(m.total), "Cartas ingresadas",
        'Una fila por expediente en <b>datos.json</b>, sin filtros.')+
      tile(nf(m.adjudicadas), "Adjudicadas",
        'Expedientes con <b>situación = Adjudicada</b>.')+
      tile(pct1(m.tasaGeneral), "Tasa de adjudicación",
        'Adjudicadas / cartas ingresadas = <b>'+m.adjudicadas+'/'+m.total+'</b>. Es el promedio general que la sección <b>Parques</b> usa como línea de referencia.', "sm")+
      tileM2+
      tile(nf(m.empresas.distintas), "Empresas distintas",
        'Valores distintos de <b>nombre_empresa</b> (ignorando mayúsculas, espacios y el punto final).')+
      '</div>';

    if(m.m2.sinDato){
      html += note('<b>Superficie incompleta:</b> '+m.m2.sinDato+' de '+m.total+
        ' expedientes no tienen <b>superficie_solicitada_m2</b> cargada. Quedan fuera de la suma — no se cuentan como 0, así que el total real es mayor al que se muestra.');
    }
    if(m.empresas.conVarias){
      html += note('<b>Hay menos empresas que cartas:</b> '+m.empresas.conVarias+
        ' empresas presentaron más de una carta de intención ('+m.empresas.cartasDeRepetidas+
        ' cartas entre ellas). Por eso '+m.total+' cartas dan '+m.empresas.distintas+
        ' empresas distintas: no es una inconsistencia.', true);
    }
    if(m.empresas.sinNombre){
      html += note('<b>'+m.empresas.sinNombre+'</b> expediente'+(m.empresas.sinNombre===1?'':'s')+
        ' sin <b>nombre_empresa</b>: no entra'+(m.empresas.sinNombre===1?'':'n')+' en el conteo de empresas distintas.');
    }
    html += src('<b>Alcance:</b> todos los expedientes cargados, sin aplicar los filtros del listado. '+
      'Las cifras se recalculan en cada carga de esta pantalla a partir de los datos sincronizados.');
    return '<div class="dash-section"><div class="dash-section-head"><h2>Resumen general</h2></div>'+html+'</div>';
  }

  function secSituacion(m){
    var filas = SITUACIONES.map(function(s){
      return {id:s.id, label:s.label, n:m.porSituacion[s.id]};
    }).sort(function(a,b){ return b.n-a.n; });
    var max = Math.max.apply(null, filas.map(function(f){return f.n;}).concat([1]));
    var SIT_COLOR = {Adjudicada:"var(--ok)", En_tratamiento:"var(--warn)",
                     Sin_tratamiento:"var(--idle)", Desestimada:"var(--danger)"};

    var body = filas.map(function(f){
      return mrow(f.label, {
        magnitud: f.n, max: max, color: SIT_COLOR[f.id],
        valor: nf(f.n)+' <span class="sub">'+(m.total?pct1(f.n/m.total):"0%")+'</span>',
        drill: ["situacion", f.id], sel: drillActivo("situacion", f.id)
      });
    }).join("");

    var card = '<div class="chart-card">'+
      '<h3>Distribución por situación</h3>'+
      '<div class="chart-sub">Tocá un estado para ver sus expedientes.</div>'+
      body+
      (m.otraSituacion?note('<b>'+m.otraSituacion+'</b> expediente'+(m.otraSituacion===1?'':'s')+
        ' con un valor de situación fuera de la lista: no entra'+(m.otraSituacion===1?'':'n')+' en ninguna barra.'):"")+
      src('<b>Campo:</b> situación. <b>%:</b> sobre las '+m.total+' cartas ingresadas (ver Resumen). '+
          '<b>Desestimada</b> salió del import de la planilla (DESESTIMADO) y, igual que Adjudicada, no corre plazo en el semáforo.')+
      (drillSituacion(m))+
      '</div>';
    return '<div class="dash-section"><div class="dash-section-head"><h2>Por situación</h2></div>'+
      '<div class="dash-grid single">'+card+'</div></div>';
  }

  function drillSituacion(m){
    if(!state.drill || state.drill.tipo!=="situacion") return "";
    var id = state.drill.valor;
    var items = state.expedientes.filter(function(e){ return e.situacion===id; });
    return drillPanel(labelSituacion(id), items);
  }

  function secParques(m){
    var html = '<div class="dash-grid">';

    // --- 1. Tasa de adjudicación por parque: el hallazgo que motiva la vista ---
    var porTasa = m.parques.slice().sort(function(a,b){
      return b.tasa-a.tasa || b.solicitudes-a.solicitudes;
    });
    var grandes = porTasa.filter(function(p){ return !p.muestraChica; });
    var verTodasTasas = !!state.verTodos.tasaParque;
    var filasTasa = verTodasTasas ? porTasa : grandes;
    var maxTasa = Math.max.apply(null, porTasa.map(function(p){return p.tasa;}).concat([m.tasaGeneral, 0.05]));
    var ejeTasa = Math.min(1, Math.ceil((maxTasa*100+5)/5)*5/100); // escala redondeada a 5%

    html += '<div class="chart-card wide">'+
      '<h3>Tasa de adjudicación por parque</h3>'+
      '<div class="chart-sub">Qué parque está convirtiendo mejor las cartas de intención en adjudicaciones. '+
        'Ordenado de mayor a menor tasa.</div>'+
      '<div class="axis-max">escala 0 – '+pct0(ejeTasa)+'</div>'+
      (filasTasa.length ? filasTasa.map(function(p){
        return mrow(p.nombre, {
          magnitud: p.tasa, max: ejeTasa, ref: m.tasaGeneral,
          color: colorParque(p.nombre), chica: p.muestraChica,
          valor: pct1(p.tasa)+' <span class="sub">— '+p.adjudicadas+'/'+p.solicitudes+'</span>',
          foot: p.muestraChica
            ? 'Solo '+p.solicitudes+(p.solicitudes===1?' expediente':' expedientes')+
              ': la tasa no es comparable con un parque de 50+ casos.'
            : "",
          drill: ["parque", p.nombre], sel: drillActivo("parque", p.nombre)
        });
      }).join("") : '<div class="chart-sub">Sin parques con '+MUESTRA_CHICA+' expedientes o más.</div>')+
      '<div class="ref-note"><i></i>Línea de referencia: promedio general '+pct1(m.tasaGeneral)+
        ' ('+m.adjudicadas+'/'+m.total+')</div>'+
      (porTasa.length>grandes.length
        ? '<button type="button" class="ver-todos" data-vertodos="tasaParque">'+
          (verTodasTasas
            ? 'Ocultar los '+(porTasa.length-grandes.length)+' parques con menos de '+MUESTRA_CHICA+' expedientes'
            : 'Ver todos ('+porTasa.length+', incluye '+(porTasa.length-grandes.length)+' de muestra chica)')+'</button>'
        : "")+
      src('<b>Cálculo:</b> expedientes con situación = Adjudicada sobre el total de expedientes del parque. '+
          '<b>Promedio general:</b> el mismo número de la tasa del Resumen. '+
          'Los parques con menos de '+MUESTRA_CHICA+' expedientes se marcan como muestra chica y se ocultan por defecto.')+
      '</div>';

    // --- 2. Solicitudes por parque ---
    var porSol = m.parques.slice().sort(function(a,b){ return b.solicitudes-a.solicitudes; });
    var maxSol = Math.max.apply(null, porSol.map(function(p){return p.solicitudes;}).concat([1]));
    html += '<div class="chart-card">'+
      '<h3>Solicitudes por parque</h3>'+
      '<div class="chart-sub">Cartas de intención presentadas. Tocá un parque para ver sus expedientes.</div>'+
      recorte("solParque", porSol).map(function(p){
        return mrow(p.nombre, {
          magnitud: p.solicitudes, max: maxSol, color: colorParque(p.nombre),
          valor: nf(p.solicitudes)+' <span class="sub">'+(m.total?pct1(p.solicitudes/m.total):"0%")+'</span>',
          drill: ["parque", p.nombre], sel: drillActivo("parque", p.nombre)
        });
      }).join("")+
      verTodos("solParque", porSol.length)+
      src('<b>Campo:</b> parque_industrial. <b>%:</b> sobre las '+m.total+' cartas ingresadas.')+
      '</div>';

    // --- 3. Superficie por parque ---
    var porM2 = m.parques.slice().sort(function(a,b){ return b.m2-a.m2; });
    var maxM2 = Math.max.apply(null, porM2.map(function(p){return p.m2;}).concat([1]));
    var sinM2Total = m.parques.reduce(function(a,p){ return a+p.m2SinDato; }, 0);
    html += '<div class="chart-card">'+
      '<h3>Superficie solicitada por parque</h3>'+
      '<div class="chart-sub">m² sumados solo sobre los expedientes que tienen el dato cargado.</div>'+
      recorte("m2Parque", porM2).map(function(p){
        return mrow(p.nombre, {
          magnitud: p.m2, max: maxM2, color: colorParque(p.nombre),
          valor: p.m2ConDato ? nfm2(p.m2) : '<span class="sub">sin datos</span>',
          foot: p.m2SinDato ? p.m2SinDato+' de '+p.solicitudes+
          (p.solicitudes===1?' expediente':' expedientes')+' sin superficie cargada' : "",
          drill: ["parque", p.nombre], sel: drillActivo("parque", p.nombre)
        });

      verTodos("m2Parque", porM2.length)+
      (sinM2Total?note('<b>'+sinM2Total+'</b> expedientes sin superficie cargada quedan fuera de estas sumas. Los totales por parque son pisos, no valores cerrados.'):"")+
      src('<b>Campo:</b> superficie_solicitada_m2, agrupado por parque_industrial. '+
          'Suma total y expedientes sin dato: ver Resumen.')+

    // --- 4. Evolución anual ---
    html += '<div class="chart-card wide">'+
      '<h3>Solicitudes por año</h3>'+
      '<div class="chart-sub">Cartas presentadas por año y parque: sirve para ver qué parque está creciendo y cuál se frenó.</div>'+
      '<svg id="chartAnual" viewBox="0 0 560 260" class="chart-svg"></svg>'+
      '<div class="legend" id="legendAnual"></div>'+
      src('<b>Campo:</b> año de <b>fecha_inicio</b> (fecha de presentación). '+
          'Cuando falta, se usa <b>anio_inicio_expediente</b> y la leyenda lo declara. '+
          'Solo quedan fuera los que no tienen ninguno de los dos.')+
      '</div>';

    html += '</div>';

    if(state.drill && state.drill.tipo==="parque"){
      var nombre = state.drill.valor;
      var items = state.expedientes.filter(function(e){
        return (e.parque_industrial||SIN_PARQUE)===nombre;
      });
      html += drillPanel("Parque "+nombre, items);
    }
    return '<div class="dash-section"><div class="dash-section-head"><h2>Por parque industrial</h2></div>'+html+'</div>';
  }

  function secRubros(m){

    var card = '<div class="chart-card">'+
      '<h3>Rubros por volumen</h3>'+
      '<div class="chart-sub">Ordenado por cantidad de cartas. Tocá un rubro para ver sus empresas.</div>'+

  function drillRubro(m){
    if(!state.drill || state.drill.tipo!=="rubro") return "";
    var nombre = state.drill.valor;
    var rubro = m.rubros.find(function(r){ return r.nombre===nombre; });
    if(!rubro) return "";
    var empresas = rubro.claves.map(function(c){
      return {clave:c, nombre:m.empresasIdx[c].nombre, cartas:m.empresasIdx[c].cartas.filter(function(e){
        return (e.rubro||"(sin rubro)")===nombre;
      })};
    }).sort(function(a,b){
      return b.cartas.length-a.cartas.length || a.nombre.localeCompare(b.nombre,"es");
    });

    return '<div class="drill">'+
      '<div class="drill-head"><h4>'+esc(nombre)+' <span class="n">'+empresas.length+' empresa'+(empresas.length===1?"":"s")+
        ' · '+rubro.solicitudes+' cartas</span></h4>'+
      '<button type="button" class="drill-close" data-drillclose="1">Cerrar</button></div>'+
      '<div class="drill-scroll"><div class="exp-list">'+empresas.map(function(em){
        var abierta = state.drillEmpresa===em.clave;
        var parques = em.cartas.map(function(e){return e.parque_industrial;})
          .filter(function(v,i,a){ return v && a.indexOf(v)===i; }).join(" · ");
        return '<button type="button" class="emp-row" data-empresa="'+esc(em.clave)+'">'+
            '<span style="min-width:0"><span class="nom">'+esc(em.nombre)+'</span>'+
            (parques?'<span class="met">'+esc(parques)+'</span>':'')+'</span>'+
            '<span class="badge b-idle">'+em.cartas.length+(em.cartas.length===1?" carta":" cartas")+'</span>'+
          '</button>'+
          (abierta ? '<div class="emp-sub"><div class="exp-list">'+em.cartas.map(function(e){
            return expCardHtml(e, urgenciaDe(e));
          }).join("")+'</div></div>' : '');
      }).join("")+'</div></div></div>';
  }

      '<div class="cfg-row"><label for="uCritico">Pasa a <b>crítico</b> (naranja) cuando quedan</label>'+

    return '<div class="dash-section"><div class="dash-section-head"><h2>Semáforo de urgencia</h2></div>'+
      cfg+'<div class="dash-grid single">'+card+'</div></div>';

  // ---- Render ----
  function fechaCorta(d){
    if(!d) return "—";
    return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
  }
  function fechaHoraCorta(d){
    return fechaCorta(d)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }

  function actualizarSyncBar(){
    var when = document.getElementById("dashSyncWhen");
    if(!when) return;
    var iso = null;
    try{ iso = localStorage.getItem(SYNC_AT_KEY); }catch(e){}
    var d = iso ? new Date(iso) : null;
    var ok = d && !isNaN(d.getTime());
    when.textContent = ok ? fechaHoraCorta(d) : "Todavía no sincronizó en este dispositivo";
    when.className = "v"+(ok?"":" stale");
    var aside = document.getElementById("dashSyncAside");
    if(aside){
      var pend = haySyncPendiente();
      aside.textContent = pend
        ? "Hay cambios locales sin subir todavía: los números de abajo ya los incluyen."
        : "Los datos salen de cartas-intencion.json en el repo, leído vía /api/sync-cartas.";
      aside.className = "aside"+(pend?" pend":"");
    }
  }

  function renderDashNav(m){
    var nav = document.getElementById("dashNav");
    nav.innerHTML = DASH_SECCIONES.map(function(s){
      var badge = (s.id==="urgencias" && m.urg.conteo.rojo)
        ? '<span class="pill-n">'+m.urg.conteo.rojo+'</span>' : '';
      return '<button type="button" data-sec="'+s.id+'" class="'+(state.dashSection===s.id?"active":"")+'">'+
        esc(s.label)+badge+'</button>';
    }).join("");
  }

  function renderDashboard(){
    var m = state.metricas = calcularMetricas();
    actualizarSyncBar();
    document.getElementById("dashUltMov").textContent = m.ultimoMovimiento
      ? "Último movimiento cargado en un expediente: "+fechaCorta(m.ultimoMovimiento)
      : "";
    renderDashNav(m);
    var body = document.getElementById("dashBody");
    if(state.dashSection==="situacion")      body.innerHTML = secSituacion(m);
    else if(state.dashSection==="parques")   body.innerHTML = secParques(m);
    else if(state.dashSection==="rubros")    body.innerHTML = secRubros(m);
    else if(state.dashSection==="urgencias") body.innerHTML = secUrgencias(m);
    else                                     body.innerHTML = secResumen(m);
    if(state.dashSection==="parques") renderAnual(m);
    if(state.dashSection==="urgencias") bindCfgUrgencias();
  }

  // Configuración del semáforo con Guardar y Cancelar: nada se aplica mientras
  // no se toque Guardar. Cancelar vuelve los campos a lo guardado.
  function bindCfgUrgencias(){
    var plazo = document.getElementById("uPlazo");
    var alerta = document.getElementById("uAlerta");
    var critico = document.getElementById("uCritico");
    if(!plazo) return;
    document.getElementById("cfgGuardar").addEventListener("click", function(){
      var p = parseInt(plazo.value,10);
      var a = parseInt(alerta.value,10);
      var c = parseInt(critico.value,10);
      if(!(p>0)) p = state.plazoDias;
      if(!(a>=0)) a = state.umbrales.alerta;
      if(!(c>=0)) c = state.umbrales.critico;
      if(c>a) a = c; // alerta nunca puede ser más exigente que crítico
      state.plazoDias = p;
      state.umbrales = {alerta:a, critico:c};
      savePlazo(p);
      saveUmbrales(state.umbrales);
      renderList();
      // el botón que disparó esto vive dentro de #dashBody: si lo reemplazamos
      // en el mismo handler, Chrome tira "node is no longer a child".
      setTimeout(renderDashboard, 0);
    });
    document.getElementById("cfgCancelar").addEventListener("click", function(){
      plazo.value = state.plazoDias;
      alerta.value = state.umbrales.alerta;
      critico.value = state.umbrales.critico;
    });
  }

  // ---- Clicks del dashboard (delegados: el cuerpo se re-renderiza entero) ----
  document.getElementById("dashNav").addEventListener("click", function(ev){
    var b = ev.target.closest("[data-sec]");
    if(!b) return;
    state.dashSection = b.getAttribute("data-sec");
    state.drill = null; state.drillEmpresa = null;
    renderDashboard();
  });

  document.getElementById("dashBody").addEventListener("click", function(ev){
    var t = ev.target;
    var vt = t.closest("[data-vertodos]");
    if(vt){
      var k = vt.getAttribute("data-vertodos");
      state.verTodos[k] = !state.verTodos[k];
      renderDashboard();
      return;
    }
    // Atajo del aviso de Urgencias: lleva al listado ya filtrado por los
    // expedientes a los que les falta la fecha, que es lo que hay que ir a
    // completar. Sin esto el aviso decía cuántos son y no dónde están.
    if(t.closest("[data-sinfecha]")){
      state.filterPlazo = "sinfecha";
      state.filterParque = ""; state.filterRubro = ""; state.filterSituacion = ""; state.search = "";
      document.getElementById("filterPlazo").value = "sinfecha";
      document.getElementById("filterParque").value = "";
      document.getElementById("filterRubro").value = "";
      document.getElementById("filterSituacion").value = "";
      document.getElementById("search").value = "";
      // Se abre el panel para que se vea qué filtro quedó puesto.
      abrirFiltros(true);
      renderList();
      showView("list");
      return;
    }
    if(t.closest("[data-drillclose]")){
      state.drill = null; state.drillEmpresa = null;
      renderDashboard();
      return;
    }
    var em = t.closest("[data-empresa]");
    if(em){
      var clave = em.getAttribute("data-empresa");
      state.drillEmpresa = (state.drillEmpresa===clave) ? null : clave;
      renderDashboard();
      return;
    }
    var dr = t.closest("[data-drill]");
    if(dr){
      var tipo = dr.getAttribute("data-drill"), valor = dr.getAttribute("data-valor");
      if(drillActivo(tipo, valor)){ state.drill = null; }
      else { state.drill = {tipo:tipo, valor:valor}; }
      state.drillEmpresa = null;
      renderDashboard();
      return;
    }
  });

  // ---- Solicitudes por año: barras apiladas por parque ----
  function renderAnual(m){
    var svg = document.getElementById("chartAnual");
    var legend = document.getElementById("legendAnual");
    if(!svg) return;
    var anios = m.anios;
    if(!anios.length){
      svg.innerHTML = "";
      legend.innerHTML = '<span>Sin fechas de inicio cargadas'+
        (m.sinFechaAnual ? ' ('+m.sinFechaAnual+' expedientes sin fecha válida)' : '')+'.</span>';
      return;
    }
    var orden = m.ordenParques;
    var W=560,H=260, padL=34, padB=28, padT=14, padR=10;
    var plotW = W-padL-padR, plotH = H-padT-padB;
    var totales = anios.map(function(a){
      return orden.reduce(function(s,p){ return s+(m.porAnio[a][p]||0); },0);
    });
    var max = Math.max.apply(null, totales.concat([1]));
    var niceMax = Math.ceil(max/5)*5 || 5;
    var barW = Math.min(64, plotW/anios.length*0.6);
    var slot = plotW/anios.length;

    var parts = [], steps = 5, i;
    for(i=0;i<=steps;i++){
      var yVal = niceMax*i/steps;
      var y = padT + plotH - (yVal/niceMax)*plotH;
      parts.push('<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>');
      parts.push('<text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+Math.round(yVal)+'</text>');
    }
    anios.forEach(function(anio, idx){
      var x0 = padL + idx*slot + (slot-barW)/2;
      var yCursor = padT+plotH;
      orden.forEach(function(p){
        var v = m.porAnio[anio][p]||0;
        if(!v) return;
        var hgt = (v/niceMax)*plotH;
        yCursor -= hgt;
        parts.push('<rect x="'+x0+'" y="'+yCursor+'" width="'+barW+'" height="'+Math.max(hgt-2,0)+
          '" rx="2" fill="'+colorParque(p)+'"><title>'+esc(p)+' '+anio+': '+v+'</title></rect>');
      });
      parts.push('<text x="'+(x0+barW/2)+'" y="'+(padT+plotH+18)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+anio+'</text>');
      parts.push('<text x="'+(x0+barW/2)+'" y="'+(padT+plotH-((totales[idx]/niceMax)*plotH)-6)+
        '" text-anchor="middle" font-size="10.5" fill="var(--fg)" font-weight="600">'+totales[idx]+'</text>');
    });
    svg.innerHTML = parts.join("");

    legend.innerHTML = orden.filter(function(p){
      return anios.some(function(a){ return (m.porAnio[a][p]||0)>0; });
    }).map(function(p){
      return '<span><i style="background:'+colorParque(p)+'"></i>'+esc(p)+'</span>';
    }).join("") +
    // Un expediente sin fecha válida no entra en ningún año. Antes se perdía
    // sin dejar rastro; ahora el gráfico dice cuántos no está mostrando.
    (m.anualAproximado
      ? '<span>'+esc(m.anualAproximado+(m.anualAproximado===1
          ? " expediente ubicado por año de expediente (sin fecha de presentación)"
          : " expedientes ubicados por año de expediente (sin fecha de presentación)"))+'</span>'
      : "") +
    (m.sinFechaAnual
      ? '<span>'+esc(m.sinFechaAnual+(m.sinFechaAnual===1
          ? " expediente sin fecha válida, fuera del gráfico"
          : " expedientes sin fecha válida, fuera del gráfico"))+'</span>'
      : "");
  }

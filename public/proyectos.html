<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Opt-in a la transición entre pantallas. Es LO ÚNICO del sistema de
       diseño que NO puede vivir en design-system.css: el navegador decide si
       anima en el primer render del documento nuevo, y una hoja externa llega
       tarde a esa decisión. Medido: con la regla en design-system.css la
       transición salía en 5 de 8 navegaciones; acá adentro, en 8 de 8.
       El resto —qué se anima, cuánto dura, qué se queda quieto— sí está en
       design-system.css. Si tocás este bloque, tocá las cinco páginas: lo
       verifica tests/ids.test.mjs. -->
  <style>@view-transition{navigation:auto}@media(prefers-reduced-motion:reduce){@view-transition{navigation:none}}</style>
  <!-- Sin este viewport el navegador movil renderiza a 980px y hace zoom out:
       todas las media queries de 420px/640px/860px de abajo quedaban muertas y
       la UI mobile-first no se usaba nunca. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Seguimiento de cartas de intención de los parques industriales de Salta.">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Proyectos">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>Cartas de Intención — Parques Industriales</title>
<!-- Sistema de diseño compartido por las 5 páginas. El orden importa:
     design-system.css son los valores (colores, radios, medidas) y
     ui-kit.css los componentes que los usan. El <style> de abajo es lo
     propio de esta pantalla y va último, para poder pisar algo puntual. -->
<link rel="stylesheet" href="/design-system.css">
<link rel="stylesheet" href="/ui-kit.css">
<style>

/* Barra de navegación inferior fija, presente en las 5 páginas del hub —
   mismo concepto que la barra de pestañas de WhatsApp (ícono + etiqueta,
   plana, sin cajas ni sombra), con la app actual marcada con color y un
   fondo sutil detrás del ícono. Queda siempre visible al cambiar de
   sección o hacer scroll (position:fixed), por eso el body le deja
   84px de aire abajo. */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:15}
.nav-item{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px 8px;text-decoration:none;color:var(--muted);transition:color .15s ease}
.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav-icon{width:26px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background-color .15s ease}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.01em;line-height:1.2}
.nav-item.active{color:var(--accent)}
.nav-item.active .nav-icon{background:color-mix(in srgb, var(--accent) 16%, transparent)}
/* Layout concept: dos vistas — Listado (tarjetas filtrables + ficha modal) y
   Dashboard (5 secciones con navegación propia) — con tabs arriba y ruteo por
   #hash. Mobile-first: todo el ancho es de una columna hasta 860px. */
/* Sin :root propio. Los colores, la tipografía y la paleta categórica
   (--s1..--s8) viven en design-system.css: esta pantalla los hereda. Si algo
   de acá necesita desviarse, se redeclara ESE token y se explica por qué —
   no se vuelve a copiar la paleta entera, que es lo que costó cinco ediciones
   cuando hubo que sacar el ámbar. */
body{margin:0 auto;padding-inline:16px;padding-top:20px;padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
svg text{font-family:var(--font-body)}

/* Pestañas: el patrón compartido vive en ui-kit.css (.app-tabs / .app-tab).
   Acá solo queda lo propio de esta pantalla. */
.view[hidden]{display:none}

/* ---- Dashboard: barra de sincronización ---- */
.sync-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:13px}
.sync-bar .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sync-bar .v{font-family:var(--font-mono);font-size:14px;font-weight:700;margin-top:2px}
.sync-bar .v.stale{color:var(--danger);font-size:12px}
.sync-bar .aside{font-size:11px;color:var(--muted);max-width:270px}
.sync-bar .aside.pend{color:var(--warn)}
.sync-bar .ultmov{font-size:11px;color:var(--muted);margin-top:4px}

/* ---- Dashboard: secciones. Mismo patrón de pestañas (ui-kit.css). ---- */
.dash-nav{margin-bottom:13px}
.dash-nav .pill-n{font-family:var(--font-mono);font-size:10.5px;margin-left:5px;background:var(--danger);color:#fff;border-radius:999px;padding:1px 5px;vertical-align:1px;font-weight:600}
.dash-nav .app-tab.active .pill-n{background:var(--accent-fg);color:var(--danger)}

/* ---- Dashboard stat tiles ---- */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-width:0;text-align:left}
.tile .num{font-family:var(--font-mono);font-size:26px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.tile .num.sm{font-size:19px}
.tile .num.na{font-size:19px;color:var(--muted)}
.tile .label{font-size:12px;color:var(--muted);margin-top:2px}
.tile .hint{font-size:10.5px;color:var(--muted);line-height:1.4;margin-top:7px;padding-top:7px;border-top:1px dashed var(--border)}
.tile .hint b{color:var(--fg);font-weight:600}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
/* El campo de búsqueda lo dibuja .search-bar de ui-kit.css: acá quedan
   solo los desplegables de filtro. */
.toolbar select{background:var(--surface);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:13px}

/* ---- Listado de tarjetas ---- */
.list-count{font-size:12px;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}
.exp-list{display:flex;flex-direction:column;gap:8px}
.exp-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px 12px;cursor:pointer;text-align:left;width:100%;flex-wrap:wrap}
.exp-card:hover{border-color:var(--accent)}
.exp-card-main{min-width:0;flex:1 1 190px}
.exp-card-exp{font-size:11.5px;line-height:16px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.exp-card-empresa{font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-card-sub{font-size:11.5px;color:var(--muted);margin-top:6px}
/* Línea de estado (opción B): plazo y situación van como texto con un punto de
   color, no como pastillas. El color sale de los mismos tokens que el semáforo. */
.exp-estado{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:12px;line-height:16px;margin-top:7px}
.exp-plazo{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.exp-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
.exp-sit{font-weight:600;white-space:nowrap}
.c-rojo{color:var(--danger)}
.c-naranja{color:var(--orange)}
.c-amarillo{color:var(--warn)}
.c-verde{color:var(--ok)}
.c-na{color:var(--muted)}
.exp-sit.b-ok{color:var(--ok)}
.exp-sit.b-warn{color:var(--warn)}
.exp-sit.b-idle{color:var(--idle)}
.exp-sit.b-danger{color:var(--danger)}
.empty-state{padding:30px 14px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:10px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:6px;padding:3px 8px;white-space:nowrap}
.badge.b-ok{background:var(--ok-bg);color:var(--ok)}
.badge.b-warn{background:var(--warn-bg);color:var(--warn)}
.badge.b-idle{background:var(--idle-bg);color:var(--idle)}
.badge.b-danger{background:var(--danger-bg);color:var(--danger)}
.badge-dot{width:7px;height:7px;border-radius:50%;display:inline-block}

/* El semáforo de color vive en la tarjeta del listado (.exp-plazo + .c-*).
   La ficha muestra el plazo como un dato más de la grilla; lo único que
   quedó acá es el aviso de cálculo estimado. */
.urg-aviso{font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);color:var(--muted);margin-top:8px}

/* ---- Modal ---- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:40px}
@media (min-width:640px){.veil{align-items:center}}
.veil[hidden]{display:none}
/* Toast con Deshacer: confirma una eliminación sin bloquear con un popup. Mismo
   criterio que Seguimiento: los colores salen de los tokens, no de literales. */
.toast{position:fixed;left:16px;right:88px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:420px;z-index:1100;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-size:14px;box-shadow:0 8px 20px -6px rgba(0,0,0,.3)}
.toast[hidden]{display:none}
.toast-mensaje{flex:1}
.toast-accion{background:none;border:none;color:var(--accent-fg);font:inherit;font-weight:700;text-decoration:underline;min-height:44px;padding:0 4px;cursor:pointer}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:18px}
@media (min-width:640px){.modal{border-radius:14px}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.modal-head h2{font-size:17px}
.x-close{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:4px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-error{font-size:11.5px;color:var(--danger);margin-top:-1px}
.field input[aria-invalid="true"],.field select[aria-invalid="true"]{border-color:var(--danger)}
.field .req{color:var(--danger);margin-left:2px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}

/* Escala de la ficha: los tamaños y altos vienen de design-system.css
   (--ds-text-*). Subtítulo = secciones; información = rótulos, datos, fechas
   y notas, todos al mismo nivel. Las notas (.notas-*, .nota-*) son las mismas
   que en Seguimiento: ui-kit.css, sección NOTAS. */
.view-section h3{font-size:var(--ds-text-subtitle);line-height:var(--ds-text-subtitle-lh);letter-spacing:.04em;text-transform:uppercase;color:var(--text);margin-bottom:9px;font-weight:700}

/* Los botones de acción (Guardar/Cancelar/Eliminar/Editar) viven en
   /ui-kit.css, compartidos con las otras tres apps. */
.modal-actions{display:flex;gap:8px;margin-top:16px}

/* ---- Modal: vista de lectura ---- */
/* Primer panel: el nombre de la empresa y el número de expediente, nada más.
   Los dos a 16px (pedido del usuario, 2026-10-21) y alineados al mismo borde
   izquierdo: sin el badge a la derecha, la fila ya no necesita ser flex. */
.view-head{display:block}
.view-empresa{font-size:16px;line-height:22px;font-weight:700;color:var(--text)}
.view-exp{font-family:var(--font-mono);font-size:16px;line-height:22px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.view-section{margin-top:14px;padding-top:13px;border-top:1px solid var(--border)}
.view-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px}
/* Rótulo en negrita (información, color de texto) y respuesta en gris: mismo
   nivel de tamaño y de alto de línea, para que la fila quede pareja. */
.view-item label{display:block;font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);font-weight:700;color:var(--text)}
.view-item .v{margin-top:1px;font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);font-weight:400;color:var(--muted)}
.view-actividad{font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);margin-top:11px;color:var(--muted)}
.view-empty{font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);color:var(--muted)}
/* ---- Ficha de empresa: sub-tab Contacto — fila con ícono + label + valor.
   Íconos SVG inline, todos en el mismo gris neutro (pedido explícito del
   usuario: "sin tanto color, todo gris", sin un color por red social). */
.contact-list{display:flex;flex-direction:column;gap:2px}
.contact-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);color:inherit;text-decoration:none}
.contact-row:last-child{border-bottom:none}
.contact-row:hover .contact-value{color:var(--accent)}
.contact-icon{flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted)}
.contact-icon svg{width:18px;height:18px}
.contact-body{min-width:0;display:flex;flex-direction:column;gap:1px}
/* Mismo criterio tipográfico que el resto de la ficha: título en negrita,
   contenido en gris (pedido explícito del usuario 2026-10-13). */
.contact-label{font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);font-weight:700;color:var(--fg)}
.contact-value{font-size:var(--ds-text-info);line-height:var(--ds-text-info-lh);font-weight:400;color:var(--muted);overflow-wrap:anywhere}
.view-actions{display:flex;gap:8px;margin-top:16px}

/* ---- Dashboard: gráficos ---- */
.dash-section{margin-bottom:22px}
.dash-section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.dash-section-head h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dash-grid{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media (min-width:860px){.dash-grid{grid-template-columns:1fr 1fr}}
.dash-grid.single{grid-template-columns:1fr}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px;min-width:0}
.chart-card.wide{grid-column:1/-1}
.chart-card h3{font-size:13.5px;font-weight:700;margin-bottom:3px}
.chart-sub{font-size:11.5px;color:var(--muted);margin-bottom:13px;line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* fila de métrica: etiqueta + valor arriba, barra abajo (mobile-first, la barra
   usa todo el ancho en vez de pelearlo con el texto) */
.mrow{display:block;width:100%;background:none;border:none;padding:0;margin:0 0 12px;text-align:left;font:inherit;color:inherit}
.mrow:last-child{margin-bottom:0}
.mrow-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.mrow-name{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow-val{font-family:var(--font-mono);font-size:12.5px;font-weight:700;flex:0 0 auto;white-space:nowrap}
.mrow-val .sub{font-weight:400;color:var(--muted)}
.mrow-track{background:var(--surface-2);border-radius:4px;height:11px;position:relative}
.mrow-fill{height:100%;border-radius:4px;background:var(--accent);min-width:2px}
.mrow-foot{font-size:10.5px;color:var(--muted);margin-top:3px}
button.mrow{cursor:pointer}
button.mrow:hover .mrow-name{color:var(--accent)}
button.mrow.sel .mrow-name{color:var(--accent)}
button.mrow.sel .mrow-track{box-shadow:0 0 0 2px var(--accent)}
.mrow.chica .mrow-fill{opacity:.45}
.tag-chica{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:1px 4px;margin-left:6px;white-space:nowrap}

/* línea de referencia (promedio general) sobre las barras de tasa */
.mrow-ref{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.5}
.ref-note{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:12px}
.ref-note i{width:2px;height:13px;background:var(--fg);opacity:.5;display:inline-block}
.axis-max{font-size:10px;color:var(--muted);font-family:var(--font-mono);text-align:right;margin-bottom:8px}
.chart-svg{width:100%;height:auto;max-width:640px;margin:0 auto;display:block;overflow:visible}

/* trazabilidad: de dónde sale cada número */
.src{font-size:10.5px;color:var(--muted);line-height:1.45;margin:13px 0 0;padding-top:9px;border-top:1px dashed var(--border)}
.src b{color:var(--fg);font-weight:600}
.note{font-size:11.5px;line-height:1.45;border-radius:8px;padding:8px 10px;margin-top:10px;background:var(--warn-bg);color:var(--warn)}
.note.plain{background:var(--surface-2);color:var(--muted)}
.note b{font-weight:700}

.ver-todos{background:none;border:1px dashed var(--border);color:var(--muted);border-radius:8px;padding:8px 10px;font-size:11.5px;width:100%;margin-top:12px}
.ver-todos:hover{border-color:var(--accent);color:var(--accent)}

/* panel de detalle al tocar un estado / parque / rubro */
.drill{margin-top:14px;padding-top:13px;border-top:1px solid var(--border)}
.drill-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.drill-head h4{font-size:12.5px;font-weight:700;margin:0}
.drill-head .n{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-weight:400}
.drill-close{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 9px;font-size:11px;flex:0 0 auto}
.drill-close:hover{border-color:var(--accent);color:var(--accent)}
.drill-scroll{max-height:420px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.emp-row{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;cursor:pointer}
.emp-row:hover{border-color:var(--accent)}
.emp-row .nom{display:block;font-size:13.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emp-row .met{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.emp-sub{padding:9px 0 3px 10px;border-left:2px solid var(--accent);margin:8px 0 2px}

/* ajustes del semáforo */
.cfg{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:14px}
.cfg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px}
.cfg-row:last-of-type{margin-bottom:0}
.cfg-acciones{display:flex;gap:8px;margin-top:14px}
.cfg-row label{color:var(--muted);flex:1 1 180px;min-width:0}
.cfg-row .inp{flex:0 0 auto;display:flex;align-items:center;gap:7px;margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.cfg-row input{width:68px;background:var(--surface-2);border:1px solid var(--border);color:var(--fg);border-radius:7px;padding:7px 8px;font-family:var(--font-mono);font-size:13px;text-align:right}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:11.5px;background:var(--surface)}
.chip .cn{font-family:var(--font-mono);font-size:13px;font-weight:700}
.chip.c-rojo{background:var(--danger);border-color:var(--danger);color:#fff}
.chip.c-naranja{background:var(--orange-bg);border-color:var(--orange-bg);color:var(--orange)}
.chip.c-amarillo{background:var(--warn-bg);border-color:var(--warn-bg);color:var(--warn)}
.chip.c-verde{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
/* Búsqueda de la pantalla: debajo del título y encima de las pestañas.
   Se muestra en Listado y Archivo; se oculta solo en Análisis (ver showView). */
.app-search{padding:12px 0 8px}
.app-search[hidden]{display:none}
/* Filtros avanzados: panel desplegable. El botón usa el chip de las pestañas. */
.filtros-toggle{margin-bottom:8px}
.filtros-toggle .count{font-weight:600}
.filtros-toggle .count[hidden]{display:none}

  padding:5px 9px;font-size:12px;font-weight:600}

<body>

<!-- El header (título + ⋮) lo monta header.js, común a las 4 apps.
     El alta vive ahora en el botón flotante (+), como en Seguimiento. -->

<!-- Orden de la pantalla: título (header.js) → búsqueda → pestañas → contenido.
     Una sola búsqueda para Listado y Archivo: filtra la pestaña que se ve.
     Solo se oculta en Análisis (ver showView). -->
<div class="app-search" id="busquedaListado">
  <div class="search-bar"><input type="search" id="search" placeholder="Buscar empresa, expediente o representante…"></div>
</div>

<div class="app-tabs" role="tablist" aria-label="Vistas">
  <button class="app-tab tab" id="tabList" role="tab" aria-selected="true" aria-controls="viewList">Listado</button>
  <button class="app-tab tab" id="tabArchivo" role="tab" aria-selected="false" aria-controls="viewArchivo">Archivo</button>
  <button class="app-tab tab" id="tabDash" role="tab" aria-selected="false" aria-controls="viewDash">Análisis</button>
</div>

<div class="alerta" id="alertaSync" hidden>
  <div class="alerta-cuerpo">
    <div class="alerta-titulo" id="alertaTitulo"></div>
    <div class="alerta-detalle" id="alertaDetalle"></div>
  </div>
  <div class="alerta-acciones">
    <button type="button" id="alertaReintentar">Reintentar</button>
  </div>
</div>

<!-- ===== VISTA LISTADO ===== -->
<section class="view" id="viewList" role="tabpanel" aria-labelledby="tabList">
  <button type="button" class="app-tab filtros-toggle" id="filtrosToggle" aria-expanded="false" aria-controls="filtrosPanel">Filtros <span class="count" id="filtrosN" hidden></span></button>
  <div class="toolbar" id="filtrosPanel" hidden>
    <select id="filterParque"><option value="">Todos los parques</option></select>
    <select id="filterRubro"><option value="">Todos los rubros</option></select>
    <select id="filterSituacion">
      <option value="">Todas las situaciones</option>

    <select id="filterPlazo">
      <option value="">Cualquier plazo</option>

      <option value="naranja">🟠 Críticos</option>
      <option value="amarillo">🟡 En alerta</option>
      <option value="verde">🟢 En plazo</option>
      <option value="sinfecha">⚠️ Sin fecha de inicio</option>

  </div>
  <!-- Con 157 expedientes y cuatro filtros combinables, sin esto no hay forma
       de saber cuántos quedaron. aria-live para que un lector de pantalla
       también se entere de que el filtro hizo algo. -->

  <div class="exp-list" id="expList"></div>
</section>

<!-- ===== VISTA ARCHIVO ===== -->

     solo (aplicarArchivadoAutomatico). "Rescatar" lo devuelve al listado
     normal. En_tratamiento nunca se archiva solo. -->
<section class="view" id="viewArchivo" role="tabpanel" aria-labelledby="tabArchivo" hidden>

<!-- ===== VISTA DASHBOARD ===== -->
<!-- Pantalla separada del listado. El cuerpo lo arma renderDashboard() según
     la sección activa: nunca se muestran todas las secciones juntas. -->

  <div class="sync-bar">

      <div class="k">Última sincronización con GitHub</div>

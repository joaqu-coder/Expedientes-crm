  function focusables(){
    // Ojo con la precedencia: `!a && b || c` es `(!a && b) || c`. Una versión
    // con ese encadenado dejaba pasar los botones deshabilitados y, donde
    // offsetParent no está implementado, descartaba todos los campos.
    return Array.prototype.filter.call(
      modal.querySelectorAll('a[href],button,input,select,textarea,[tabindex]:not([tabindex="-1"])'),
      function(el){ return !el.disabled && !el.hidden; }
    );
  }
  function enfocarPrimero(){
    var f = focusables();
    // El primero suele ser la X de cerrar; preferimos el primer campo real.
    var campo = modal.querySelector("input,select,textarea");
    var destino = campo || f[0];
    if(destino && destino.focus) destino.focus();
  }

  // Trampa de foco: sin esto, tabular dentro de un diálogo modal se escapaba
  // a la página de atrás, que para un lector de pantalla no existe.
  modal.addEventListener("keydown", function(ev){
    if(ev.key !== "Tab") return;
    var f = focusables();
    if(!f.length) return;
    var primero = f[0], ultimo = f[f.length-1];
    if(ev.shiftKey && document.activeElement === primero){ ev.preventDefault(); ultimo.focus(); }
    else if(!ev.shiftKey && document.activeElement === ultimo){ ev.preventDefault(); primero.focus(); }
  });

  // Escape cierra, que es lo que todo el mundo espera de un modal. Si hay
  // texto sin guardar, pregunta antes (la tarjeta corta su propio Escape).
  document.addEventListener("keydown", function(ev){
    if(ev.key === "Escape" && !veil.hidden && !ConfirmarCambios.abierto()) intentarSalir();
  });

  // Única puerta de salida de la ficha. Sin texto sin guardar, cierra (o
  // ejecuta despuesDescartar). Con texto, pregunta con la tarjeta:
  //   guardar   → envía el formulario; si la validación falla, la ficha queda
  //               abierta con los errores, igual que al tocar Guardar.
  //   descartar → descarta lo escrito y ejecuta despuesDescartar.
  //   seguir    → no hace nada: la ficha sigue como estaba.
  // Recibe función o nada: si la llaman directo desde un listener, el primer
  // argumento es el evento y no hay que tomarlo como acción.
  // `opciones` (opcional) dice qué hacer cuando la salida la decide la tarjeta
  // y no el usuario directo: alGuardar si el guardado entra, alSeguir si la
  // ficha queda abierta (por «Seguir editando» o por un error de validación).
  function intentarSalir(despuesDescartar, opciones){
    var accion = typeof despuesDescartar === "function" ? despuesDescartar : closeModal;
    if(!state.formSucio){ accion(); return; }
    ConfirmarCambios.pedir({
      titulo: "¿Desea guardar los cambios?",
      mensaje: "Hay cambios sin guardar en este expediente."
    }).then(function(opcion){
      var op = opciones || {};
      if(opcion === "guardar"){
        var form = document.getElementById("expForm");
        if(!form){ if(op.alSeguir) op.alSeguir(); return; }
        // La tarjeta ya cerró: el submit va por onSave, que valida y mueve el
        // foco al primer campo con error. onSave es síncrono, así que cuando
        // vuelve ya consumió `tras`: no queda pendiente para un guardado futuro.
        tras = { ok: op.alGuardar || null, fallo: op.alSeguir || null };
        if(form.requestSubmit) form.requestSubmit();
        else form.dispatchEvent(new Event("submit", {cancelable:true}));
        tras = null;
      } else if(opcion === "descartar"){
        state.formSucio = false;
        accion();
      } else if(op.alSeguir){
        op.alSeguir();
      }
    });
  }
  // Qué hacer según cómo termine el guardado que pidió la tarjeta.
  var tras = null;
  function resolverTras(ok){
    var t = tras;
    tras = null;
    if(!t) return;
    if(ok){ if(t.ok) t.ok(); }
    else if(t.fallo) t.fallo();
  }

  // Contacto de la ficha, igual que en Parques (pedido del usuario 2026-10-22):

  function contactRow(icon, label, valor, href){
    valor = String(valor||"").trim();

  function mailtoHref(v){
    var m = String(v||"").match(/[^\s|;,/<>()]+@[^\s|;,/<>()]+/);

  // Validación en un solo lugar, para que el formulario y cualquier dato que
  // entre por sync se midan con la misma vara.
  // Mismo formato que Seguimiento (validarNumeroExpediente): mesa-número/año-sufijo.
  var PATRON_NRO = /^\d{3}-\d{1,6}\/\d{4}-\d{1,2}$/;
  // Unifica guiones y espacios antes de comparar o guardar: "363 – 1254/2026-01"
  // y "363-1254/2026-01" son el mismo expediente.
  function normalizarNumero(s){
    return String(s||"").trim().replace(/\s*[-–—]\s*/g,"-").replace(/\s*\/\s*/g,"/");
  }
  // v.nro_previo: número que ya tenía el expediente. Solo se valida formato y
  // duplicado cuando el número es nuevo o cambió: hay expedientes cargados
  // antes con otra forma, y bloquearlos al editar otra cosa sería peor.
  // v.duplicado: empresa que ya usa ese número en otro expediente, si hay.
  function validarExpediente(v){
    var errores = {};
    var nroCambio = v.nro_expediente !== normalizarNumero(v.nro_previo);
    if(nroCambio){
      if(!v.nro_expediente) errores.nro_expediente = "Poné el número de expediente.";
      else if(!PATRON_NRO.test(v.nro_expediente)) errores.nro_expediente = "Formato: 363-1254/2025-01 (mesa-número/año-sufijo).";
      else if(v.duplicado) errores.nro_expediente = "Ya existe un expediente con ese número: "+v.duplicado+".";
    }
    if(!v.nombre_empresa) errores.nombre_empresa = "Poné el nombre de la empresa.";
    if(!v.fecha_inicio) errores.fecha_inicio = "Poné la fecha de inicio: sin ella no hay semáforo de plazo.";
    else if(!parseFechaLocal(v.fecha_inicio)) errores.fecha_inicio = "Fecha inválida. Usá dd/mm/aaaa (por ejemplo 09/10/2026).";
    if(v.superficie_solicitada_m2 !== "" && !(Number(v.superficie_solicitada_m2) >= 0)){
      errores.superficie_solicitada_m2 = "La superficie tiene que ser un número.";
    }
    return errores;
  }

  function mostrarErrores(errores){
    modal.querySelectorAll(".field-error").forEach(function(n){ n.remove(); });
    modal.querySelectorAll('[aria-invalid="true"]').forEach(function(n){ n.removeAttribute("aria-invalid"); });
    var primero = null;
    Object.keys(errores).forEach(function(campo){
      var cont = modal.querySelector('[data-campo="'+campo+'"]');
      var input = document.getElementById("f_"+campo);
      if(input) input.setAttribute("aria-invalid","true");
      if(cont){
        var nota = document.createElement("div");
        nota.className = "field-error";
        nota.textContent = errores[campo];
        cont.appendChild(nota);
      }
      if(!primero) primero = input;
    });
    if(primero){ primero.focus(); if(primero.scrollIntoView) primero.scrollIntoView({block:"center"}); }
  }
  function selectField(name,label,options,e,labelMap){
    var current = e ? e[name] : (name==="situacion" ? "Sin_tratamiento" : "");
    var opts = options.map(function(opt){
      var text = opt;
      if(labelMap){ var m=labelMap.find(function(l){return l.id===opt;}); if(m) text=m.label; }
      return '<option value="'+esc(opt)+'" '+(opt===current?"selected":"")+'>'+esc(text)+'</option>';
    }).join("");
    var blank = (!current) ? '<option value="" selected disabled>Seleccionar…</option>' : '';
    return '<div class="field"><label for="f_'+name+'">'+esc(label)+'</label><select id="f_'+name+'" name="'+name+'">'+blank+opts+'</select></div>';
  }
  // Mismo bloque que Seguimiento (ui-kit.css, NOTAS): encabezado "NOTAS (n)" y
  // las notas en el orden en que se cargaron, como las muestra Seguimiento.
  // Sin el cartel "SISTEMA" (pedido del usuario, 2026-10-21): el texto de la
  // nota ya dice que la escribió la app ("Archivado automáticamente…",
  // "Rescatado del archivo."). `n.tipo` se sigue guardando en el dato.
  function historialHtml(e){
    var notas = (e && e.intervenciones) || [];
    var body = notas.length
      ? '<div class="notas-list">'+notas.map(function(n){
          return '<div class="nota-item"><span class="nota-hora">'+esc(n.hora)+'</span><div class="nota-texto">'+esc(n.texto)+'</div></div>';
        }).join("")+'</div>'
      : '<div class="notas-empty">Sin notas aún</div>';
    return '<div class="notas-seccion"><div class="notas-header">Notas ('+notas.length+')</div>'+body+'</div>';
  }
  function closeModal(){
    veil.hidden = true;
    state.editingId = null;
    state.modalMode = null;
    state.formSucio = false;
    document.body.style.overflow = "";
    if(focoPrevio && focoPrevio.focus) focoPrevio.focus();
    focoPrevio = null;
  }

  function onSave(ev){
    ev.preventDefault();
    var id = state.editingId;
    var existing = id ? state.expedientes.find(function(x){return x.id===id;}) : null;
    var isNew = !existing;
    var g = function(name){ var el=document.getElementById("f_"+name); return el?el.value:""; };

    var situacionAnterior = existing ? existing.situacion : null;
    var situacionNueva = g("situacion") || "Sin_tratamiento";

    // Validar ANTES de mutar nada: antes el formulario se podía enviar
    // completamente vacío y creaba un expediente en blanco, y una fecha
    // inválida se guardaba corrida o dejaba el semáforo mudo.
    var nroNuevo = normalizarNumero(g("nro_expediente"));
    var otro = state.expedientes.find(function(x){
      return x.id!==id && normalizarNumero(x.nro_expediente)===nroNuevo && nroNuevo!=="";
    });
    var candidato = {
      nro_expediente: nroNuevo,
      nro_previo: existing ? existing.nro_expediente : "",
      duplicado: otro ? (otro.nombre_empresa || "otra empresa") : "",
      nombre_empresa: g("nombre_empresa").trim(),
      fecha_inicio: isoADdmmaaaa(g("fecha_inicio")),
      superficie_solicitada_m2: g("superficie_solicitada_m2").trim()
    };
    var errores = validarExpediente(candidato);
    if(Object.keys(errores).length){ mostrarErrores(errores); resolverTras(false); return; }

    var exp = existing || {id:uid(), intervenciones:[]};

    exp.nro_expediente = nroNuevo;
    exp.nombre_empresa = g("nombre_empresa").trim();
    exp.fecha_inicio = isoADdmmaaaa(g("fecha_inicio"));
    exp.parque_industrial = g("parque_industrial");
    exp.rubro = g("rubro");
    exp.superficie_solicitada_m2 = g("superficie_solicitada_m2") ? Number(g("superficie_solicitada_m2")) : "";
    exp.actividad_empresa = g("actividad_empresa").trim();
    exp.situacion = situacionNueva;
    exp.representante_nombre = g("representante_nombre").trim();
    exp.contacto_tel = g("contacto_tel").trim();
    exp.contacto_tel_2 = g("contacto_tel_2").trim();
    exp.contacto_mail = g("contacto_mail").trim();
    exp.contacto_mail_2 = g("contacto_mail_2").trim();
    exp.intervenciones = exp.intervenciones || [];

    var huboCambioEstado = !isNew && situacionAnterior !== situacionNueva;
    var ahora = horaLocal();
    if(huboCambioEstado){
      exp.intervenciones.push({hora:ahora, texto:"Cambio de situación: "+labelSituacion(situacionAnterior)+" → "+labelSituacion(situacionNueva), tipo:"sistema"});
    }
    var nota = (document.getElementById("f_nota").value||"").trim();
    if(nota) exp.intervenciones.push({hora:ahora, texto:nota, tipo:"manual"});

    // Editar un archivado es, de hecho, darle tratamiento: lo saca solo del
    // archivo (además del botón "Rescatar" dedicado, para cuando no hace
    // falta tocar ningún otro campo).
    var eraArchivado = !!exp.archivado;
    if(eraArchivado){
      exp.archivado = false;
      delete exp.fecha_archivado;
      exp.intervenciones.push({hora:ahora, texto:"Rescatado del archivo (editado).", tipo:"sistema"});
    }
    if(huboCambioEstado || nota || isNew || eraArchivado) exp.fecha_ultimo_movimiento = ahora;

    // Marca de modificación: es lo que permite fusionar sin perder trabajo
    // cuando dos dispositivos tocaron el mismo expediente.
    exp.actualizado_en = new Date().toISOString();

    if(isNew) state.expedientes.push(exp);
    save();
    closeModal();
    renderList();
    if(!viewDash.hidden) renderDashboard();
    if(!viewArchivo.hidden) renderArchivo();
    resolverTras(true);
  }

  // Sin tocar ningún otro campo: vuelve al flujo normal y el reloj de los 6
  // meses hábiles arranca de nuevo desde ahora.
  function onRescatar(){
    if(!state.editingId) return;
    var e = state.expedientes.find(function(x){return x.id===state.editingId;});
    if(!e || !e.archivado) return;
    var ahora = horaLocal();
    e.archivado = false;
    delete e.fecha_archivado;
    e.fecha_ultimo_movimiento = ahora;
    e.intervenciones = e.intervenciones || [];
    e.intervenciones.push({hora:ahora, texto:"Rescatado del archivo.", tipo:"sistema"});
    e.actualizado_en = new Date().toISOString();
    save();
    closeModal();
    renderList();
    renderArchivo();
    if(!viewDash.hidden) renderDashboard();
  }
  function labelSituacion(id){ var m=SITUACIONES.find(function(s){return s.id===id;}); return m?m.label:id; }
  // Eliminar no pide confirmación nativa (bloquea y no se entiende): borra en
  // el acto y ofrece Deshacer por unos segundos, como el resto de la suite. La
  // lápida se escribe igual que siempre: sin ella la fusión no distingue "yo lo
  // borré" de "el otro lo agregó", y el expediente reaparecería en el próximo
  // sync desde otro dispositivo. Deshacer la saca de la lista de borrados.
  function onDelete(){
    if(!state.editingId) return;
    var idx = state.expedientes.findIndex(function(x){return x.id===state.editingId;});
    if(idx < 0) return;
    var e = state.expedientes[idx];
    var quien = e.nombre_empresa || e.nro_expediente || "este expediente";
    var eliminadosAntes = state.eliminados;
    state.expedientes.splice(idx, 1);
    state.eliminados = podarBorrados(state.eliminados.concat([
      {id: e.id, en: new Date().toISOString()}
    ]));
    save(); closeModal(); renderList();
    if(!viewDash.hidden) renderDashboard();
    if(!viewArchivo.hidden) renderArchivo();
    mostrarToast("Expediente de " + quien + " eliminado", function(){
      deshacerEliminar(e, idx, eliminadosAntes);
    });
  }
  function deshacerEliminar(e, idx, eliminadosAntes){
    state.expedientes.splice(Math.min(idx, state.expedientes.length), 0, e);
    state.eliminados = eliminadosAntes;
    save(); renderList();
    if(!viewDash.hidden) renderDashboard();
    if(!viewArchivo.hidden) renderArchivo();
  }

  // ---- Toast con Deshacer ----
  var toastEl = document.getElementById("toast"), toastMsg = document.getElementById("toastMensaje"),
      toastBtn = document.getElementById("toastAccion"), toastTimer = null, toastAccion = null;
  function ocultarToast(){
    clearTimeout(toastTimer);
    toastTimer = null;
    toastAccion = null;
    toastEl.hidden = true;
  }
  function mostrarToast(mensaje, accion){
    clearTimeout(toastTimer);
    toastAccion = accion;
    toastMsg.textContent = mensaje;
    toastBtn.hidden = !accion;
    toastEl.hidden = false;
    toastTimer = setTimeout(ocultarToast, 6000);
  }
  toastBtn.addEventListener("click", function(){
    var a = toastAccion;
    ocultarToast();
    if(a) a();
  });


  // Header común a las 4 apps (título + ⋮) y botón flotante de alta.
  HeaderGlobal.init({
    titulo: "Proyectos",
    accion: { etiqueta: "Nuevo Proyecto", onClick: function(){ openModal(null); } },
    menu: [
      { etiqueta: "Actualizar datos", onClick: function(){ bajarCambiosIniciales(); } }
    ]
  });

  // ---- Devueltos desde Seguimiento ----
  // Seguimiento resuelve o archiva sus expedientes con motivo. Si el número es el de
  // una carta de Proyectos, no queda en «Archivados» de Seguimiento: vuelve acá
  // (estado «devuelto» en expedientes.json, que esta pantalla solo LEE) y se muestra
  // en la ficha de la carta. Rescatar escribe una sola cosa en expedientes.json:
  // ese expediente vuelve a «activo», con _baseSha y reintento ante un 409.
  var devueltos = {};
  var enSeguimiento = {};   // todos los números que ya están en Seguimiento, en cualquier estado
  var segListas = { areas: [], responsables: [], parques: [] };
  function puedePasarASeguimiento(e){
    return !!e && e.situacion==="En_tratamiento" && !e.archivado && !!normNro(e.nro_expediente) &&
      !devueltoDe(e) && !enSeguimiento[normNro(e.nro_expediente)];
  }
  function normNro(n){ return String(n||"").replace(/[–—]/g,"-").replace(/\s+/g,""); }
  function devueltoDe(e){ return e ? devueltos[normNro(e.nro_expediente)] || null : null; }
  function leyendaDevuelto(x){
    return "Archivado en Seguimiento"+(x.fechaResolucion?" el "+x.fechaResolucion.split("-").reverse().join("/"):"");
  }
  async function cargarDevueltos(){
    try{
      var resp = await HeaderGlobal.fetchApi("/api/sync");
      if(!resp.ok) return;
      var datos = await resp.json();
      if(!datos || !Array.isArray(datos.expedientes)) return;
      var m = {}, todos = {};
      datos.expedientes.forEach(function(x){
        if(!normNro(x.numero)) return;
        todos[normNro(x.numero)] = true;
        if(x.estado==="devuelto") m[normNro(x.numero)] = x;
      });
      segListas = { areas: datos.areas||[], responsables: datos.responsables||[], parques: datos.parques||[] };
      if(JSON.stringify(m)===JSON.stringify(devueltos) && JSON.stringify(todos)===JSON.stringify(enSeguimiento)) return;
      devueltos = m;
      enSeguimiento = todos;
      renderList();
      // La ficha abierta en modo lectura se redibuja; una que se está editando, no.
      if(!veil.hidden && state.editingId && state.modalMode!=="edit") renderModal();
    }catch(err){ /* sin red: se muestra lo último que se supo */ }
  }
  // Días hábiles que el expediente llevaba usados cuando se archivó (desde su inicio hasta el archivo).
  function isoAFecha(s){ var p=String(s||"").split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function diasUsadosAlArchivar(x){
    if(!x.fechaInicio || !x.fechaResolucion) return 0;
    return diasHabilesEntre(isoAFecha(x.fechaInicio), isoAFecha(x.fechaResolucion));
  }
  // Fecha de inicio tal que, desde ella hasta hoy, hay exactamente n días hábiles.
  function fechaInicioConDiasUsados(n, hoy){
    var f = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()), k = 0;
    while(k < n){ f.setDate(f.getDate()-1); if(esHabil(f)) k++; }
    return fechaISO(f);
  }

  async function onRescatarASeguimiento(){
    var e = state.expedientes.find(function(x){return x.id===state.editingId;});
    var k = e && normNro(e.nro_expediente);
    if(!k) return;
    var btn = document.getElementById("btnRescatarSeg");
    if(btn) btn.disabled = true;
    try{
      for(var intento=0; intento<3; intento++){
        var resp = await HeaderGlobal.fetchApi("/api/sync");
        if(!resp.ok) throw new Error("get");
        var datos = await resp.json();
        var sha = datos._meta && datos._meta.sha;
        delete datos._meta;
        var x = (datos.expedientes||[]).find(function(y){return y.estado==="devuelto" && normNro(y.numero)===k;});
        if(!x){
          delete devueltos[k]; renderList(); renderModal();
          mostrarToast("Ese expediente ya no está devuelto desde Seguimiento.");
          return;
        }
        var hoy = new Date();
        var usados = diasUsadosAlArchivar(x); // antes de borrar fechaResolucion
        x.estado = "activo";
        delete x.final; delete x.motivoFinal; delete x.fechaResolucion;
        // Retoma los días hábiles que ya llevaba usados: el reloj no arranca de cero.
        x.fechaInicio = fechaInicioConDiasUsados(usados, hoy);
        x.intervenciones = x.intervenciones || [];
        x.intervenciones.push({hora:horaLocal(), texto:"Rescatado desde Proyectos. Retoma los "+usados+" días hábiles usados."});
        datos.timestamp = new Date().toISOString();
        if(sha) datos._baseSha = sha;
        var post = await HeaderGlobal.fetchApi("/api/sync", {
          method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(datos)
        });
        if(post.status===409) continue;     // otro dispositivo guardó en el medio: se vuelve a leer
        if(!post.ok) throw new Error("post");
        delete devueltos[k];
        closeModal();
        renderList();
        mostrarToast("Vuelve a Seguimiento.");
        return;
      }
      throw new Error("conflicto");
    }catch(err){
      if(btn) btn.disabled = false;
      mostrarToast("No se pudo rescatar a Seguimiento. Probá de nuevo.");
    }
  }

  // «Pasar a Seguimiento»: única otra escritura de Proyectos sobre expedientes.json.
  // Lee con sha, agrega el expediente (mismo número que la carta) y POSTea con
  // _baseSha; ante un 409 relee y reintenta. No toca cartas-intencion.json.
  async function abrirPasar(){
    var btn = document.getElementById("btnPasarSeg");
    if(btn) btn.disabled = true;
    await cargarDevueltos();   // listas y números al día antes de mostrar el diálogo
    var e = state.expedientes.find(function(x){return x.id===state.editingId;});
    if(!e) return;
    if(!puedePasarASeguimiento(e)){
      renderModal();
      mostrarToast("Ese expediente ya está en Seguimiento.");
      return;
    }
    state.modalMode = "pasar";
    renderModal();
    enfocarPrimero();
  }
  async function onPasarASeguimiento(){
    var e = state.expedientes.find(function(x){return x.id===state.editingId;});
    var k = e && normNro(e.nro_expediente);
    if(!k) return;
    var plazoTxt = document.getElementById("pasarPlazo").value.trim();
    var plazo = /^\d{1,3}$/.test(plazoTxt) ? parseInt(plazoTxt,10) : 0;
    var area = document.getElementById("pasarArea").value;
    var resp = document.getElementById("pasarResp").value;
    if(plazo<1 || !area || !resp){ document.getElementById("pasarError").hidden = false; return; }
    var btn = document.getElementById("pasarConfirmar");
    btn.disabled = true;
    try{
      for(var intento=0; intento<3; intento++){
        var r = await HeaderGlobal.fetchApi("/api/sync");
        if(!r.ok) throw new Error("get");
        var datos = await r.json();
        var sha = datos._meta && datos._meta.sha;
        delete datos._meta;
        datos.expedientes = datos.expedientes || [];
        if(datos.expedientes.some(function(y){ return normNro(y.numero)===k; })){
          enSeguimiento[k] = true;
          renderModal();
          mostrarToast("Ese expediente ya está en Seguimiento.");
          return;
        }
        var hoy = new Date();
        var parque = (datos.parques||[]).indexOf(e.parque_industrial)>=0 ? e.parque_industrial : "";
        var nuevo = {
          id: String(Date.now())+String(Math.floor(Math.random()*1000)),
          numero: e.nro_expediente,
          tema: e.nombre_empresa||"",
          area: area, responsable: resp,
          fechaInicio: hoy.getFullYear()+"-"+String(hoy.getMonth()+1).padStart(2,"0")+"-"+String(hoy.getDate()).padStart(2,"0"),
          diasPlazo: plazo,
          estado: "activo",
          intervenciones: [{hora:horaLocal(), texto:"Pasado desde Proyectos."}]
        };
        if(parque) nuevo.parque = parque;
        datos.expedientes.push(nuevo);
        datos.timestamp = new Date().toISOString();
        if(sha) datos._baseSha = sha;
        var post = await HeaderGlobal.fetchApi("/api/sync", {
          method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(datos)
        });
        if(post.status===409) continue;     // otro dispositivo guardó en el medio: se vuelve a leer
        if(!post.ok) throw new Error("post");
        enSeguimiento[k] = true;
        closeModal();
        renderList();
        mostrarToast("Pasó a Seguimiento.");
        return;
      }
      throw new Error("conflicto");
    }catch(err){
      btn.disabled = false;
      mostrarToast("No se pudo pasar a Seguimiento. Probá de nuevo.");
    }
  }

  aplicarArchivadoAutomatico();
  renderList();
  showView(vistaDeHash(location.hash), true);
  bajarCambiosIniciales();
  cargarDevueltos();
  programarPoll();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>

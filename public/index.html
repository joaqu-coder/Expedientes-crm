<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Expedientes CRM: seguimiento de expedientes y cartas de intención de parques industriales.">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expedientes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>Expedientes CRM</title>
  <style>
    :root {
      --primary: #667eea;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --text: #1f2937;
      --text-muted: #6b7280;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --gray-50: #111827;
        --gray-100: #1f2937;
        --gray-200: #374151;
        --text: #f3f4f6;
        --text-muted: #d1d5db;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--gray-50);
      color: var(--text);
    }
    .landing {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }
    .landing-inner {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }
    .landing-eyebrow {
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }
    .landing-title {
      margin: 10px 0 0;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
    }
    .landing-cards {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .card-link {
      flex: 1 1 280px;
      max-width: 340px;
      text-decoration: none;
      color: inherit;
      border-radius: 16px;
    }
    .card-link:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .card {
      background: var(--gray-100);
      border: 1px solid var(--gray-200);
      border-radius: 16px;
      padding: 32px 28px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .card-link:hover .card,
    .card-link:focus-visible .card {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 12px 28px -12px rgba(102, 126, 234, 0.35);
    }
    .card-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: var(--gray-50);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color .15s ease, color .15s ease;
    }
    .card-link:hover .card-icon,
    .card-link:focus-visible .card-icon {
      background: var(--primary);
      color: #fff;
    }
    .card-title { font-size: 19px; font-weight: 700; }
    .card-desc { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-top: 4px; }
    .card-cta {
      margin-top: auto;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div class="landing">
    <div class="landing-inner">
      <div style="text-align: center;">
        <div class="landing-eyebrow">Expedientes CRM</div>
        <h1 class="landing-title">¿Qué querés gestionar?</h1>
      </div>

      <div class="landing-cards">
        <a href="/seguimiento.html" class="card-link">
          <div class="card">
            <div class="card-icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                <path d="M9 3v2h6V3"></path>
                <path d="M8 11l2.5 2.5L16 8"></path>
              </svg>
            </div>
            <div>
              <div class="card-title">Seguimiento</div>
              <div class="card-desc">Expedientes administrativos y legales, con alertas automáticas de vencimiento.</div>
            </div>
            <div class="card-cta">
              Entrar
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </div>
          </div>
        </a>

        <a href="/proyectos.html" class="card-link">
          <div class="card">
            <div class="card-icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 21V8l9-5 9 5v13"></path>
                <path d="M9 21v-7h6v7"></path>
                <path d="M9 11h.01M15 11h.01M9 15h.01M15 15h.01"></path>
              </svg>
            </div>
            <div>
              <div class="card-title">Proyectos</div>
              <div class="card-desc">Cartas de intención de parques industriales — EGPAIS.</div>
            </div>
            <div class="card-cta">
              Entrar
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>

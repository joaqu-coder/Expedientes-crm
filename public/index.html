<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Gestión de expedientes administrativos y legales con alertas automáticas de vencimiento">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expedientes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>Expedientes CRM</title>
  <style>
    :root {
      --primary: #667eea;
      --red: #7f0000;
      --orange: #f97316;
      --yellow: #d5be00;
      --green: #336d0e;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --text: #1f2937;
      --text-muted: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --gray-50: #111827;
        --gray-100: #1f2937;
        --gray-200: #374151;
        --gray-300: #4b5563;
        --text: #f3f4f6;
        --text-muted: #d1d5db;
      }
    }

    :root[data-theme="dark"] {
      --gray-50: #111827;
      --gray-100: #1f2937;
      --gray-200: #374151;
      --gray-300: #4b5563;
      --text: #f3f4f6;
      --text-muted: #d1d5db;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--gray-50);
      color: var(--text);
      line-height: 1.5;
    }

    .app {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }

    /* Header */
    .header {
      height: 44px;
      padding: 0 16px;
      border-bottom: 1px solid var(--gray-300);
      display: flex;
      align-items: center;
      background: white;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    @media (prefers-color-scheme: dark) {
      .header {
        background: var(--gray-100);
      }
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
    }

    .sync-indicator {
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .sync-indicator.sync-ok {
      background: rgba(51, 109, 14, 0.12);
      color: var(--green);
    }

    .sync-indicator.sync-pending {
      background: rgba(107, 114, 128, 0.12);
      color: var(--text-muted);
    }

    .sync-indicator.sync-error {
      background: rgba(249, 115, 22, 0.12);
      color: var(--orange);
    }

    @media (max-width: 480px) {
      .sync-indicator {
        font-size: 0;
        padding: 6px;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
      }
      .sync-indicator::before {
        font-size: 14px;
      }
      .sync-indicator.sync-ok::before { content: '☁️'; }
      .sync-indicator.sync-pending::before { content: '⏳'; }
      .sync-indicator.sync-error::before { content: '⚠️'; }
    }

    /* Pestañas */
    .pestanas {
      background: white;
      padding: 0;
      border-bottom: 1px solid var(--gray-300);
      position: sticky;
      top: 44px;
      z-index: 40;
      display: flex;
      gap: 0;
    }

    @media (prefers-color-scheme: dark) {
      .pestanas {
        background: var(--gray-100);
      }
    }

    .pestana-btn {
      flex: 1;
      padding: 12px 16px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
      transition: all 0.2s;
      text-align: center;
    }

    .pestana-btn:hover {
      color: var(--text);
    }

    .pestana-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* Panel de Áreas */
    .panel-areas {
      background: white;
      padding: 12px;
      border-bottom: 1px solid var(--gray-300);
      position: sticky;
      top: 104px;
      z-index: 40;
    }

    @media (prefers-color-scheme: dark) {
      .panel-areas {
        background: var(--gray-100);
      }
    }

    .panel-areas-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .area-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .area-btn {
      padding: 8px 12px;
      font-size: 12px;
      background: var(--gray-100);
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text);
      white-space: nowrap;
    }

    @media (prefers-color-scheme: dark) {
      .area-btn {
        background: var(--gray-200);
        border-color: var(--gray-300);
      }
    }

    .area-btn:hover {
      border-color: var(--primary);
    }

    .area-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Lista de Expedientes */
    .expedientes-list {
      flex: 1;
      padding: 8px;
      overflow-y: auto;
    }

    .expediente-card {
      background: white;
      border-left: 4px solid;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: box-shadow 0.2s;
    }

    @media (prefers-color-scheme: dark) {
      .expediente-card {
        background: var(--gray-100);
      }
    }

    .expediente-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .expediente-card.rojo { border-left-color: var(--red); }
    .expediente-card.naranja { border-left-color: var(--orange); }
    .expediente-card.amarillo { border-left-color: var(--yellow); }
    .expediente-card.verde { border-left-color: var(--green); }

    .expediente-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 4px;
    }

    .expediente-numero {
      font-weight: 600;
      font-size: 13px;
      word-break: break-word;
    }

    .semaforo-emoji {
      font-size: 20px;
      flex-shrink: 0;
    }

    .expediente-tema {
      font-size: 12px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .expediente-meta {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .intervenciones-list {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--gray-200);
      max-height: 120px;
      overflow-y: auto;
    }

    .intervencion {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .intervencion-hora {
      font-weight: 600;
      color: var(--text);
    }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: none;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.2s;
    }

    .fab:hover {
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 8px;
      width: 90vw;
      max-width: 500px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px rgba(0,0,0,0.15);
    }

    @media (prefers-color-scheme: dark) {
      .modal {
        background: var(--gray-100);
      }
    }

    .modal-header {
      padding: 16px;
      border-bottom: 1px solid var(--gray-300);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header-title {
      font-size: 16px;
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text);
    }

    .modal-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .modal-footer {
      padding: 16px;
      border-top: 1px solid var(--gray-300);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* Formulario */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .form-label.required::after {
      content: " *";
      color: var(--red);
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      color: var(--text);
      background: white;
    }

    @media (prefers-color-scheme: dark) {
      .form-input,
      .form-select,
      .form-textarea {
        background: var(--gray-200);
        border-color: var(--gray-300);
      }
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
    }

    .form-input.invalid {
      border-color: var(--red);
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.1);
    }

    .form-input.valid {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 60px;
    }

    .form-help {
      color: var(--text-muted);
      display: block;
      margin-top: 4px;
      font-size: 11px;
    }

    .form-error {
      color: var(--red);
      display: block;
      margin-top: 4px;
      font-size: 11px;
    }

    /* Botones */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--gray-200);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--gray-300);
    }

    .btn-danger {
      background: var(--red);
      color: white;
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 11px;
    }

    .btn-success {
      background: var(--green);
      color: white;
    }

    .btn-success:hover {
      opacity: 0.9;
    }

    .hidden {
      display: none;
    }

    /* Config Popup Modal */
    .config-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 250;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .config-overlay.active {
      display: flex;
    }

    .config-modal {
      background: white;
      border-radius: 12px;
      width: 100%;
      max-width: 720px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    }

    @media (prefers-color-scheme: dark) {
      .config-modal {
        background: var(--gray-100);
      }
    }

    .config-header {
      padding: 24px;
      border-bottom: 1px solid var(--gray-300);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .config-header h2 {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .config-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .config-close:hover {
      background: var(--gray-200);
      color: var(--text);
    }

    .config-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    @media (max-width: 650px) {
      .config-body {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    .config-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .config-section h3 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary);
      margin: 0 0 12px 0;
    }

    .config-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .config-list::-webkit-scrollbar {
      width: 6px;
    }

    .config-list::-webkit-scrollbar-thumb {
      background: var(--gray-300);
      border-radius: 3px;
    }

    .config-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--gray-50);
      border-radius: 6px;
      font-size: 13px;
      border: 1px solid var(--gray-300);
    }

    @media (prefers-color-scheme: dark) {
      .config-item {
        background: var(--gray-200);
      }
    }

    .config-item span {
      flex: 1;
      word-break: break-word;
    }

    .config-item button {
      background: none;
      border: none;
      color: var(--red);
      cursor: pointer;
      font-size: 16px;
      padding: 4px 8px;
      margin-left: 8px;
      transition: all 0.2s;
      border-radius: 4px;
    }

    .config-item button:hover {
      background: rgba(127,0,0,0.1);
      transform: scale(1.15);
    }

    .config-input-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .config-input-group input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      font-size: 13px;
      background: white;
      color: var(--text);
    }

    @media (prefers-color-scheme: dark) {
      .config-input-group input {
        background: var(--gray-200);
        border-color: var(--gray-300);
      }
    }

    .config-input-group button {
      padding: 10px 16px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .config-input-group button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    /* Botón config en header */
    .header-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--text);
      padding: 8px;
      margin: 0 4px;
      transition: all 0.2s;
      border-radius: 6px;
    }

    .header-btn:hover {
      background: var(--gray-200);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="header-title">📋 Expedientes</h1>
      <span class="sync-indicator sync-pending" id="syncIndicator">⏳ Sincronizando...</span>
      <button class="header-btn" id="btnConfig" title="Configuración">⚙️</button>
    </header>

    <main class="main-content">
      <div class="pestanas">
        <button class="pestana-btn active" onclick="cambiarPestana('activos')">Activos</button>
        <button class="pestana-btn" onclick="cambiarPestana('archivados')">Archivados</button>
      </div>

      <div class="panel-areas">
        <div class="panel-areas-title">Áreas Responsables</div>
        <div class="area-buttons" id="areaBotones"></div>
      </div>

      <div class="expedientes-list" id="expedientesList"></div>
    </main>
  </div>

  <button class="fab" id="fabNuevo" title="Nuevo expediente">+</button>

  <!-- Modal Config -->
  <div class="config-overlay" id="configOverlay">
    <div class="config-modal">
      <div class="config-header">
        <h2>⚙️ Configuración</h2>
        <button class="config-close" id="configClose">✕</button>
      </div>
      <div class="config-body">
        <div class="config-section">
          <h3>📍 Áreas Responsables</h3>
          <div class="config-list" id="areasConfigList"></div>
          <div class="config-input-group">
            <input type="text" id="inputArea" placeholder="Nueva área">
            <button onclick="agregarAreaDesdeInput()">+</button>
          </div>
        </div>

        <div class="config-section">
          <h3>👤 Responsables</h3>
          <div class="config-list" id="responsablesConfigList"></div>
          <div class="config-input-group">
            <input type="text" id="inputResponsable" placeholder="Nuevo responsable">
            <button onclick="agregarResponsableDesdeInput()">+</button>
          </div>
        </div>
      </div>
      <div class="config-footer" style="display: flex; gap: 10px; padding: 16px; border-top: 1px solid var(--gray-300); justify-content: flex-end;">
        <button class="btn btn-secondary" onclick="document.getElementById('configOverlay').classList.remove('active')" style="border: none; background-color: var(--gray-200); color: var(--text); padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 500;">Cerrar</button>
        <button class="btn btn-primary" onclick="guardarConfiguracion()" style="background-color: var(--primary); color: white; padding: 10px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500;">Guardar cambios</button>
      </div>
    </div>
  </div>

  <!-- Modal Expediente -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-header-title" id="modalTitle">Nuevo Expediente</h2>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-content">
        <form id="formularioModal"></form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCancelar">Cancelar</button>
        <button class="btn btn-danger btn-small hidden" id="btnEliminar">Eliminar</button>
        <button class="btn btn-primary" id="btnGuardar">Guardar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="alertOverlay" style="display: none; z-index: 1001;">
    <div class="modal" style="max-width: 400px;">
      <div class="modal-header" style="border-bottom: 2px solid var(--orange);">
        <h2 class="modal-header-title" id="alertTitle" style="color: var(--orange);">⚠️ Aviso</h2>
      </div>
      <div class="modal-content">
        <p id="alertMessage" style="margin: 0; font-size: 15px; line-height: 1.6;"></p>
      </div>
      <div class="modal-footer" style="justify-content: flex-end;">
        <button class="btn btn-primary" id="alertBtn" onclick="cerrarAlert()">Aceptar</button>
      </div>
    </div>
  </div>

  <script>
    // ===== CONFIGURACIÓN =====
    const AREAS_DEFAULT = [
      "Jurídica",
      "Administración",
      "Operación",
      "Obras",
      "Promoción Industrial",
      "Intervención"
    ];

    const RESPONSABLES_DEFAULT = [
      "María García",
      "Juan López",
      "Carlos Rodríguez",
      "Ana Martínez",
      "Roberto Fernández",
      "Laura Sánchez",
      "Diego Fernández",
      "Patricia González"
    ];

    let AREAS = [...AREAS_DEFAULT];
    let RESPONSABLES = [...RESPONSABLES_DEFAULT];

    // Feriados argentinos 2024-2027
    const FERIADOS = [
      "2024-01-01", "2024-02-12", "2024-02-13", "2024-03-24", "2024-04-02",
      "2024-04-10", "2024-05-01", "2024-05-25", "2024-06-17", "2024-06-20",
      "2024-07-09", "2024-07-25", "2024-08-17", "2024-10-12", "2024-11-18",
      "2024-12-08", "2024-12-25",
      "2025-01-01", "2025-02-10", "2025-02-11", "2025-03-24", "2025-04-02",
      "2025-04-25", "2025-05-01", "2025-05-25", "2025-06-17", "2025-06-20",
      "2025-07-09", "2025-07-25", "2025-08-17", "2025-10-12", "2025-11-18",
      "2025-12-08", "2025-12-25",

    // ===== ESTADO =====
    let expedientes = [];

    // ===== ALERTAS ELEGANTES =====
    function mostrarAlerta(titulo, mensaje) {

    // ===== VALIDACIÓN EN TIEMPO REAL =====
    function validarNumeroExpediente(valor) {
      // Patrón: XXX-XXXXX/YYYY-ZZ (sin paréntesis)
      // Mesa (3 dígitos) - Número (1-6 dígitos) / Año (4 dígitos) - Sufijo (1-2 dígitos)
      // Ejemplos: 363-1254/2025-01, 363-125477/2026-0
      const patron = /^\d{3}\s*[-–—]\s*\d{1,6}\/\d{4}\s*[-–—]\s*\d{1,2}$/;
      return patron.test(valor);
    }

    function actualizarValidacionNumero(input) {
      const valor = input.value.trim();

      // Limpiar em dashes automáticamente
      if (valor.includes('–')) {
        input.value = valor.replace(/–/g, '-');
        return;
      }

      input.classList.remove('invalid', 'valid');

      if (valor.length === 0) {
        return; // Sin color si está vacío
      }

      if (validarNumeroExpediente(valor)) {
        input.classList.add('valid');
      } else {
        input.classList.add('invalid');
      }
    }

    // Impedir escritura de letras mientras tipeas
    function filtrarCaracteresNumero(e) {
      // Permitir teclas de control: Backspace, Delete, flechas, etc.
      // y SOLO: dígitos, paréntesis, guión y barra
      const teclasEspeciales = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Home', 'End'];
      const caracteresPermitidos = /[0-9()/-]/;

      if (!teclasEspeciales.includes(e.key) && !caracteresPermitidos.test(e.key)) {
        e.preventDefault(); // Impide que se escriba el carácter

        // Feedback visual: borde rojo rápido
        const input = e.target;
        input.classList.add('invalid');
        setTimeout(() => {
          if (!input.value.trim()) input.classList.remove('invalid');
        }, 300);
      }
    }

    // ===== FUNCIONES DE CÁLCULO =====
    function esFinDeSemana(fecha) {
      const day = fecha.getDay();
      return day === 0 || day === 6;
    }

    function esFeriado(fecha) {
      const str = fecha.toISOString().split('T')[0];
      return FERIADOS.includes(str);
    }

    function esHabil(fecha) {
      return !esFinDeSemana(fecha) && !esFeriado(fecha);
    }

    function calcularFechaFin(fechaInicio, diasPlazo) {
      let fecha = new Date(fechaInicio);
      let diasContados = 0;

      while (diasContados < diasPlazo) {
        fecha.setDate(fecha.getDate() + 1);
        if (esHabil(fecha)) diasContados++;
      }

      return fecha;
    }

    function calcularDiasRestantes(fechaInicio, diasPlazo) {
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);
      const fechaFin = calcularFechaFin(fechaInicio, diasPlazo);
      let diasRestantes = 0;
      let fecha = new Date(hoy);

      while (fecha < fechaFin) {
        fecha.setDate(fecha.getDate() + 1);
        if (esHabil(fecha)) diasRestantes++;
      }

      return Math.max(0, diasRestantes);
    }

    function obtenerSemaforo(diasRestantes) {
      if (diasRestantes === 0) return { emoji: "🔴", color: "rojo", orden: 0 };
      if (diasRestantes <= 5) return { emoji: "🟠", color: "naranja", orden: 1 };
      if (diasRestantes <= 15) return { emoji: "🟡", color: "amarillo", orden: 2 };
      return { emoji: "🟢", color: "verde", orden: 3 };
    }

    // ===== SYNC (vía Worker propio, sin exponer token) =====
    let sincronizando = false;
    let ultimoSyncOk = null; // true/false/null (null = todavía no se intentó)

    function actualizarIndicadorSync(estado) {
      ultimoSyncOk = estado;
      const el = document.getElementById('syncIndicator');
      if (!el) return;
      if (estado === true) {
        el.textContent = '☁️ Sincronizado';
        el.className = 'sync-indicator sync-ok';
      } else if (estado === false) {
        el.textContent = '⚠️ Sin conexión (guardado local)';
        el.className = 'sync-indicator sync-error';
      } else {
        el.textContent = '⏳ Sincronizando...';
        el.className = 'sync-indicator sync-pending';
      }
    }

    async function subirAGitHub() {
      try {
        sincronizando = true;
        actualizarIndicadorSync(null);
        const datos = {
          expedientes,
          areas: AREAS,
          responsables: RESPONSABLES,
          timestamp: new Date().toISOString()
        };

        const resp = await fetch('/api/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });

        const ok = resp.ok;
        actualizarIndicadorSync(ok);
        return ok;
      } catch (e) {
        console.error('Error al sincronizar:', e);
        actualizarIndicadorSync(false);
        return false;
      } finally {
        sincronizando = false;
      }
    }

    async function descargarDesdeGitHub() {
      try {
        const resp = await fetch('/api/sync');
        if (!resp.ok) {
          actualizarIndicadorSync(false);
          return false;
        }

        const datos = await resp.json();

        expedientes = datos.expedientes || [];
        AREAS = (datos.areas && datos.areas.length) ? datos.areas : [...AREAS_DEFAULT];
        RESPONSABLES = (datos.responsables && datos.responsables.length) ? datos.responsables : [...RESPONSABLES_DEFAULT];

        guardarEnLS(false); // guarda local sin re-subir lo que acabamos de bajar
        renderizar();
        actualizarIndicadorSync(true);
        return true;
      } catch (e) {
        console.error('Error al descargar:', e);
        actualizarIndicadorSync(false);
        return false;
      }
    }

    // ===== ALMACENAMIENTO CON SYNC BATCHING =====
    let syncQueue = [];
    let isSyncing = false;

    function guardarEnLS(sincronizar = true) {
      try {
        localStorage.setItem('expedientes_crm_expedientes', JSON.stringify(expedientes));
        localStorage.setItem('expedientes_crm_areas', JSON.stringify(AREAS));
        localStorage.setItem('expedientes_crm_responsables', JSON.stringify(RESPONSABLES));

        // Respuesta local INSTANTÁNEA sin esperar a GitHub (cambios optimistas)
        if (sincronizar) {
          programarSincronizacion();
        }
      } catch (e) {
        console.error('Error al guardar:', e);
      }
    }

    function programarSincronizacion() {
      // No sincronizar inmediatamente, agregar a queue
      // Se sincroniza en background cada ~100-500ms (batching inteligente)
      if (!isSyncing && syncQueue.length === 0) {
        setTimeout(sincronizarEnBackground, 100);
      }
    }

    async function sincronizarEnBackground() {
      if (isSyncing) return;
      isSyncing = true;

      try {
        // Sincronizar TODO (expedientes + config) en un solo POST
        await subirAGitHub();
        actualizarIndicadorSync(true);
      } catch (e) {
        console.error('Error en sync background:', e);
        actualizarIndicadorSync(false);
      } finally {
        isSyncing = false;
      }
    }

    function cargarDesdeLS() {
      try {
        const datos = localStorage.getItem('expedientes_crm_expedientes');
        expedientes = datos ? JSON.parse(datos) : [];

        const areas = localStorage.getItem('expedientes_crm_areas');
        AREAS = areas ? JSON.parse(areas) : [...AREAS_DEFAULT];

        const responsables = localStorage.getItem('expedientes_crm_responsables');
        RESPONSABLES = responsables ? JSON.parse(responsables) : [...RESPONSABLES_DEFAULT];
      } catch (e) {
        console.error('Error al cargar:', e);
        expedientes = [];
        AREAS = [...AREAS_DEFAULT];
        RESPONSABLES = [...RESPONSABLES_DEFAULT];
      }
    }

    function agregarArea(nombre) {
      if (nombre.trim() && !AREAS.includes(nombre)) {
        AREAS.push(nombre);
        guardarEnLS();
        renderizar();
        return true;
      }
      return false;
    }

    function eliminarArea(nombre) {
      AREAS = AREAS.filter(a => a !== nombre);
      guardarEnLS();
      renderizar();
    }

    function agregarResponsable(nombre) {
      if (nombre.trim() && !RESPONSABLES.includes(nombre)) {
        RESPONSABLES.push(nombre);
        guardarEnLS();
        renderizar();
        return true;
      }
      return false;
    }

    function eliminarResponsable(nombre) {
      RESPONSABLES = RESPONSABLES.filter(r => r !== nombre);
      guardarEnLS();
      renderizar();
    }

      pestanaActiva = pestana;
      document.querySelectorAll('.pestana-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderizar();
    }

    function actualizarPestanas() {
      document.querySelectorAll('.pestana-btn').forEach(btn => {
        btn.classList.remove('active');
        if ((btn.textContent.includes('Activos') && pestanaActiva === 'activos') ||
            (btn.textContent.includes('Archivados') && pestanaActiva === 'archivados')) {
          btn.classList.add('active');
        }
      });
    }

    function marcarResuelto(expedienteId) {
      const exp = expedientes.find(e => e.id === expedienteId);
      if (exp) {
        exp.estado = 'archivado';
        exp.fechaResolucion = new Date().toISOString().split('T')[0];
        guardarEnLS(true);
        mostrarAlerta('✓ Expediente archivado', 'El expediente se ha marcado como resuelto y movido al archivo.');
        renderizar();
      }
    }

    function reabrirExpediente(expedienteId) {
      const exp = expedientes.find(e => e.id === expedienteId);
      if (exp) {
        exp.estado = 'activo';
        delete exp.fechaResolucion;
        guardarEnLS(true);
        mostrarAlerta('↺ Expediente reabierto', 'El expediente volvió a estar activo.');
        renderizar();
      }
    }

    function renderizar() {
      renderizarConfigAreas();
      renderizarConfigResponsables();
      renderizarPanelAreas();
      actualizarPestanas();

      let filtrados = expedientes;

      // Filtrar por pestaña (activos/archivados)
      const estadoFiltro = pestanaActiva === 'activos' ? 'activo' : 'archivado';
      filtrados = filtrados.filter(e => (e.estado || 'activo') === estadoFiltro);

      // Filtrar por área
      if (filtroArea) {
        filtrados = filtrados.filter(e => e.area === filtroArea);
      }

      filtrados.sort((a, b) => {
        const diasA = calcularDiasRestantes(a.fechaInicio, a.diasPlazo);
        const diasB = calcularDiasRestantes(b.fechaInicio, b.diasPlazo);

        const semaforoA = obtenerSemaforo(diasA);
        const semaforoB = obtenerSemaforo(diasB);

        if (semaforoA.orden !== semaforoB.orden) {
          return semaforoA.orden - semaforoB.orden;
        }

        return diasA - diasB;
      });

      const html = filtrados.map(exp => {
        const diasRestantes = calcularDiasRestantes(exp.fechaInicio, exp.diasPlazo);
        const semaforo = obtenerSemaforo(diasRestantes);

        return `
          <div class="expediente-card ${semaforo.color}" onclick="abrirEditar('${exp.id}')">
            <div class="expediente-header">
              <div class="expediente-numero">${exp.numero}</div>
              <div style="display: flex; gap: 8px; align-items: center;">

                  ? `<button class="btn btn-small" style="padding: 4px 8px; font-size: 10px; background: var(--gray-300); color: var(--text);" onclick="event.stopPropagation(); reabrirExpediente('${exp.id}')">↺ Reabrir</button>`
                  : `<button class="btn btn-small" style="padding: 4px 8px; font-size: 10px;" onclick="event.stopPropagation(); marcarResuelto('${exp.id}')">✓ Resolver</button>`
                }
              </div>
            </div>

            <div class="expediente-tema">${exp.tema}</div>

            <div class="expediente-meta">
              <div><strong>${exp.area}</strong></div>
              <div><strong>${exp.responsable}</strong></div>
              <div><strong>${diasRestantes} d</strong></div>
              ${exp.intervenciones && exp.intervenciones.length > 0 ? `
                <div>💬 ${exp.intervenciones.length}</div>
              ` : ''}
            </div>

            ${exp.intervenciones && exp.intervenciones.length > 0 ? `
              <div class="intervenciones-list">
                ${exp.intervenciones.slice(-2).map(i => `
                  <div class="intervencion">
                    <span class="intervencion-hora">${i.hora}</span><br><small>${i.texto.substring(0, 60)}${i.texto.length > 60 ? '...' : ''}</small>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      document.getElementById('expedientesList').innerHTML = html || '<p style="padding: 16px; text-align: center; color: var(--text-muted);">No hay expedientes</p>';
    }

    function actualizarFechaVencimiento() {
      const fechaInicio = document.getElementById('fechaInicio')?.value;
      const diasPlazo = parseInt(document.getElementById('diasPlazo')?.value || 0);

      if (!fechaInicio || !diasPlazo) {
        document.getElementById('fechaVencimiento').textContent = 'Completa Fecha de Inicio y Plazo';
        return;
      }

      const fechaFin = calcularFechaFin(fechaInicio, diasPlazo);
      const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const fechaFormato = fechaFin.toLocaleDateString('es-AR', opciones);
      const diasRestantes = calcularDiasRestantes(fechaInicio, diasPlazo);

      document.getElementById('fechaVencimiento').textContent =
        `${fechaFormato} (${diasRestantes} día${diasRestantes !== 1 ? 's' : ''} restante${diasRestantes !== 1 ? 's' : ''})`;
    }

    function abrirNuevo() {

        inputNumero.addEventListener('input', (e) => actualizarValidacionNumero(e.target));
        inputNumero.addEventListener('blur', (e) => actualizarValidacionNumero(e.target));

      // Agregar cálculo de vencimiento en tiempo real
      const fechaInicio = document.getElementById('fechaInicio');
      const diasPlazo = document.getElementById('diasPlazo');

        inputNumero.addEventListener('input', (e) => actualizarValidacionNumero(e.target));
        inputNumero.addEventListener('blur', (e) => actualizarValidacionNumero(e.target));
        inputNumero.addEventListener('keydown', filtrarCaracteresNumero);
        actualizarValidacionNumero(inputNumero);
      }

      // Agregar cálculo de vencimiento en tiempo real
      const fechaInicio = document.getElementById('fechaInicio');
      const diasPlazo = document.getElementById('diasPlazo');
      if (fechaInicio) fechaInicio.addEventListener('change', actualizarFechaVencimiento);
      if (diasPlazo) diasPlazo.addEventListener('input', actualizarFechaVencimiento);
      actualizarFechaVencimiento(); // Mostrar el cálculo inicial

      document.getElementById('modalOverlay').classList.add('active');
    }

      document.getElementById('modalOverlay').classList.remove('active');
      editandoId = null;

    function guardarExpediente() {
      const numero = document.getElementById('numero').value.trim();
      const tema = document.getElementById('tema').value.trim();
      const area = document.getElementById('area').value;
      const responsable = document.getElementById('responsable').value;
      const fechaInicio = document.getElementById('fechaInicio').value;
      const diasPlazo = parseInt(document.getElementById('diasPlazo').value);
      const notas = document.getElementById('notas').value.trim();

      if (!tema || !area || !responsable || !fechaInicio || !diasPlazo) {
        mostrarAlerta('⚠️ Campos faltantes', 'Completa todos los campos obligatorios');
        return;
      }

      // Si se ingresó un número, validar que sea correcto. El número es opcional.
      if (numero && !validarNumeroExpediente(numero)) {
        mostrarAlerta('❌ Formato incorrecto', 'Usa: XXX-XXXXX/YYYY-ZZ\nEjemplos:\n363-1254/2025-01\n363-125477/2026-0');
        return;
      }

      let exp;

      if (editandoId) {
        exp = expedientes.find(e => e.id === editandoId);
        if (!exp) return;

        exp.numero = numero;
        exp.tema = tema;
        exp.area = area;
        exp.responsable = responsable;
        exp.fechaInicio = fechaInicio;
        exp.diasPlazo = diasPlazo;
      } else {
        exp = {
          id: Date.now().toString(),
          numero,
          tema,
          area,
          responsable,
          fechaInicio,
          diasPlazo,
          estado: 'activo',
          intervenciones: []
        };
        expedientes.push(exp);
      }

      if (notas) {
        const ahora = new Date();
        const hh = String(ahora.getHours()).padStart(2, '0');
        const mm = String(ahora.getMinutes()).padStart(2, '0');
        const dd = String(ahora.getDate()).padStart(2, '0');
        const mo = String(ahora.getMonth() + 1).padStart(2, '0');

        exp.intervenciones = exp.intervenciones || [];
        exp.intervenciones.push({
          hora: `${dd}/${mo} ${hh}:${mm}`,
          texto: notas
        });
      }

      guardarEnLS();
      renderizar();
      cerrarModal();
    }

    function eliminarExpediente() {
      if (!confirm('¿Estás seguro de que querés eliminar este expediente?')) return;

      expedientes = expedientes.filter(e => e.id !== editandoId);
      guardarEnLS();
      renderizar();
      cerrarModal();
    }

    // ===== FUNCIONES CONFIG MODAL =====
    function abrirConfigModal() {
      document.getElementById('configOverlay').classList.add('active');
    }

    function cerrarConfigModal() {
      document.getElementById('configOverlay').classList.remove('active');
    }

    // ===== EVENTOS =====
    document.getElementById('fabNuevo').addEventListener('click', abrirNuevo);
    document.getElementById('modalClose').addEventListener('click', cerrarModal);
    document.getElementById('btnCancelar').addEventListener('click', cerrarModal);
    document.getElementById('btnGuardar').addEventListener('click', guardarExpediente);
    document.getElementById('btnEliminar').addEventListener('click', eliminarExpediente);

    // Config Modal Events
    document.getElementById('btnConfig').addEventListener('click', abrirConfigModal);
    document.getElementById('configClose').addEventListener('click', cerrarConfigModal);

    document.getElementById('configOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('configOverlay')) {
        cerrarConfigModal();
      }
    });

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalOverlay')) {
        cerrarModal();
      }
    });

    // ===== INICIALIZACIÓN =====
    (async () => {
      cargarDesdeLS();
      renderizar(); // Mostrar lo local de inmediato, sin esperar la red

      await descargarDesdeGitHub(); // Trae cambios de otros dispositivos
    })();

    // Cerrar popup de alerta con Escape o al clickear afuera
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('alertOverlay').style.display !== 'none') {
        cerrarAlert();
      }
    });

    document.getElementById('alertOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('alertOverlay')) {
        cerrarAlert();
      }
    });

    // PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>

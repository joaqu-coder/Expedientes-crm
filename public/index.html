<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Expedientes CRM: seguimiento de expedientes, cartas de intención de parques industriales, resoluciones y lotes/empresas de Parques.">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expedientes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>Expedientes CRM</title>
  <style>
    :root {
      --primary: #667eea;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --text: #1f2937;
      --text-muted: #6b7280;
      /* Tarjetas blancas, como en el resto de la suite — antes la landing
         era la única que las pintaba con --gray-100 (gris claro). */
      --surface: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--gray-50);
      color: var(--text);
    }
    .landing {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      /* Deja lugar a la barra fija de abajo para que no tape el título en
         pantallas bajas. */
      padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    }
    .landing-inner {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }
    .landing-eyebrow {
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }
    .landing-title {
      margin: 10px 0 0;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
    }
    /* Barra inferior fija, mismo concepto que la barra de pestañas de
       WhatsApp (Chats/Novedades/Comunidades/Llamadas): ícono plano arriba,
       etiqueta abajo, cuatro columnas iguales, sin cajas ni sombras — la
       navegación entera vive ahí, no en el cuerpo de la página. */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      background: var(--surface);
      border-top: 1px solid var(--gray-200);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 10;
    }
    .nav-item {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* gap/padding/tamaño de ícono iguales a las otras 4 páginas: si acá
         difieren, la barra cambia de alto al entrar a una app. */
      gap: 3px;
      padding: 9px 4px 8px;
      text-decoration: none;
      color: var(--text-muted);
      transition: color .15s ease;
    }
    .nav-item:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: -2px;
    }
    .nav-item:hover,
    .nav-item:focus-visible {
      color: var(--primary);
    }
    .nav-icon {
      width: 26px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .01em;
      /* Explícito para que la barra mida igual en las 5 páginas, sin depender
         del line-height que herede cada una. */
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <div class="landing">
    <div class="landing-inner">
      <div style="text-align: center;">
        <div class="landing-eyebrow">Expedientes CRM</div>
        <h1 class="landing-title">¿Qué querés gestionar?</h1>
      </div>

    </div>
  </div>

  <nav class="bottom-nav" aria-label="Aplicaciones">
    <a href="/seguimiento.html" class="nav-item">
      <span class="nav-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="2"></rect>
          <path d="M9 3v2h6V3"></path>
          <path d="M8 11l2.5 2.5L16 8"></path>
        </svg>
      </span>
      <span class="nav-label">Seguimiento</span>
    </a>

    <a href="/proyectos.html" class="nav-item">
      <span class="nav-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21V8l9-5 9 5v13"></path>
          <path d="M9 21v-7h6v7"></path>
          <path d="M9 11h.01M15 11h.01M9 15h.01M15 15h.01"></path>
        </svg>
      </span>
      <span class="nav-label">Proyectos</span>
    </a>

    <a href="/resoluciones.html" class="nav-item">
      <span class="nav-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <path d="M14 2v6h6"></path>
          <path d="M9 13h6M9 17h6"></path>
          <circle cx="9" cy="9.5" r="1"></circle>
        </svg>
      </span>
      <span class="nav-label">Resoluciones</span>
    </a>

    <a href="/parques.html" class="nav-item">
      <span class="nav-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
      </span>
      <span class="nav-label">Parques</span>
    </a>
  </nav>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

  </script>
</body>
</html>
